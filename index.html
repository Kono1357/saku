<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#080b14">
<title>朔</title>
<style>
:root{
  --bg:#080b14; --card:#141a2a; --card2:#1b2338; --line:rgba(255,255,255,.09);
  --fg:#e8eef9; --dim:#8695b0; --dim2:#5a6880; --accent:#c9b98f;
  --red:#c0706a; --green:#7fc79a; --blue:#6fa8dc;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bot:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{
  background:
    radial-gradient(130% 80% at 80% -10%, #1c2a47 0%, rgba(28,42,71,0) 55%),
    radial-gradient(100% 60% at 8% 8%, #16203a 0%, rgba(22,32,58,0) 60%),
    var(--bg);
  color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  font-size:15px; line-height:1.75;
  -webkit-font-smoothing:antialiased;
}
.hide{display:none !important}

/* ================= 密码门 ================= */
#gate{
  position:fixed; inset:0; z-index:200; display:flex; flex-direction:column;
  align-items:center; justify-content:center; text-align:center; padding:24px;
  background:linear-gradient(180deg,#0a0e18,#070a12);
}
#gate .moon{width:58px;height:58px;margin-bottom:16px;opacity:.9}
#gate h1{font-size:26px;margin:0;letter-spacing:8px;font-weight:600}
#gate p{color:var(--dim2);font-size:12.5px;letter-spacing:1px;margin:10px 0 24px}
#gate input{
  width:100%;max-width:300px;padding:14px 16px;border-radius:13px;
  border:1px solid var(--line);background:rgba(255,255,255,.045);color:var(--fg);
  font-size:16px;font-family:inherit;outline:none;text-align:center;letter-spacing:1px;
}
#gate input:focus{border-color:rgba(201,185,143,.5);background:rgba(255,255,255,.07)}
#gate button{
  margin-top:13px;width:100%;max-width:300px;padding:14px;border-radius:13px;
  border:1px solid rgba(201,185,143,.35);background:rgba(201,185,143,.13);
  color:#e8dcb4;font-size:15.5px;font-family:inherit;font-weight:600;cursor:pointer;
}
#gate button:active{transform:scale(.985);background:rgba(201,185,143,.2)}
#gate .err{color:#f0a0a0;font-size:12.5px;margin-top:13px;min-height:18px}
#gate .tip{color:var(--dim2);font-size:11.5px;margin-top:18px;line-height:1.9;max-width:300px}

/* ================= 桌面 ================= */
#home{
  position:fixed; inset:0; display:flex; flex-direction:column;
  padding:calc(var(--safe-top) + 14px) 20px calc(var(--safe-bot) + 14px);
  transition:opacity .3s, transform .34s cubic-bezier(.3,.9,.3,1), filter .3s;
}
#home.push{opacity:0; transform:scale(.94); filter:blur(3px)}

/* 状态栏 */
.statusbar{display:flex; align-items:flex-end; gap:12px; margin-bottom:26px}
.statusbar .clockbig{
  font-size:44px; font-weight:300; letter-spacing:1px; line-height:1;
  font-variant-numeric:tabular-nums; color:#f2f6ff;
}
.statusbar .right{margin-left:auto; text-align:right}
.statusbar .date{font-size:12px; color:var(--dim); letter-spacing:.5px}
.statusbar .where{
  font-size:12px; color:var(--accent); margin-top:3px; letter-spacing:.5px;
  display:flex; align-items:center; gap:5px; justify-content:flex-end;
}
.dot{width:6px;height:6px;border-radius:50%;background:#7dd3fc;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

/* 图标色调：只做极淡的色相偏移，主体仍是毛玻璃 */
.app[data-app="diary"] .ico{background:rgba(190,170,235,.16)}
.app[data-app="calendar"] .ico{background:rgba(180,205,240,.15)}
.app[data-app="game"] .ico{background:rgba(240,180,150,.15)}
.app[data-app="wall"] .ico{background:rgba(150,220,210,.14)}
.app[data-app="drop"] .ico{background:rgba(200,170,140,.16)}
.app[data-app="about"] .ico{background:rgba(200,200,215,.13)}

/* 图标网格 */
.grid{
  display:grid; gap:22px 16px;
  grid-template-columns:repeat(auto-fill,minmax(78px,1fr));
  align-content:start;
}
.app{
  display:flex; flex-direction:column; align-items:center; gap:8px;
  cursor:pointer; user-select:none;
  transition:transform .16s cubic-bezier(.3,1.4,.5,1), opacity .3s;
}
.app:active{transform:scale(.9)}
.app.zooming{opacity:0}
.app .ico{
  width:62px;height:62px;border-radius:19px;
  display:flex;align-items:center;justify-content:center;
  font-size:26px; line-height:1; font-weight:300;
  color:#f4f8ff;
  border:1px solid rgba(255,255,255,.22);
  background:rgba(255,255,255,.10);
  -webkit-backdrop-filter:blur(10px) saturate(150%);
  backdrop-filter:blur(10px) saturate(150%);
  box-shadow:
    0 4px 14px rgba(0,0,0,.28),
    inset 0 1px 0 rgba(255,255,255,.26),
    inset 0 -1px 0 rgba(255,255,255,.06);
  text-shadow:0 1px 6px rgba(0,0,0,.5);
  transition:transform .22s cubic-bezier(.3,1.5,.5,1), box-shadow .22s, background .22s;
}
.app.opening .ico{transform:scale(1.18); background:rgba(255,255,255,.2);
  box-shadow:0 10px 26px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.34)}
.app .nm{font-size:11.5px; color:rgba(232,238,249,.82); letter-spacing:.5px; white-space:nowrap;
  text-shadow:0 1px 4px rgba(0,0,0,.6)}

/* ---------- 桌面壁纸 ---------- */
#wallpaper{
  position:fixed; inset:0; z-index:-1; background-size:cover; background-position:center;
  opacity:0; transition:opacity .5s;
}
#wallpaper.on{opacity:1}
#home .veil{
  position:fixed; inset:0; z-index:-1; pointer-events:none;
  background:linear-gradient(180deg,rgba(6,9,16,.62),rgba(6,9,16,.34) 42%,rgba(6,9,16,.72));
  opacity:0; transition:opacity .5s;
}
#home .veil.on{opacity:1}

/* 壁纸视图内的控件 */
.wpick{
  display:block; width:100%; border:2px dashed rgba(201,185,143,.4); border-radius:15px;
  padding:26px 16px; text-align:center; cursor:pointer; background:rgba(255,255,255,.03);
  font-size:15px; color:var(--accent); margin-bottom:12px;
}
.wpick:active{background:rgba(255,255,255,.08)}
.wpick input{display:none}
.wprev{
  width:100%; border-radius:15px; border:1px solid var(--line);
  max-height:52vh; object-fit:cover; display:block; margin-bottom:12px; background:#0c1018;
}
.wbtns{display:flex; gap:9px; flex-wrap:wrap}
.wbtns button{
  flex:1 1 120px; border:1px solid var(--line); background:rgba(255,255,255,.05);
  color:var(--fg); font-family:inherit; font-size:14px; border-radius:11px;
  padding:11px 14px; cursor:pointer;
}
.wbtns button.pri{border-color:rgba(201,185,143,.42); background:rgba(201,185,143,.15); color:#e8dcb4; font-weight:600}
.wbtns button.dan{border-color:rgba(192,112,106,.5); color:#e0a09a}
.wbtns button:active{transform:scale(.97)}
.app .badge{
  position:absolute; margin:-42px 0 0 44px; min-width:17px; height:17px; padding:0 4px;
  border-radius:9px; background:var(--red); color:#fff; font-size:10.5px;
  display:flex; align-items:center; justify-content:center; line-height:1;
}

/* Dock */
.dock{
  margin-top:auto; display:flex; justify-content:center; gap:8px; padding-top:18px;
}
.dock i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.25)}
.dock i.on{background:rgba(255,255,255,.6)}

/* ================= App 视图 ================= */
#viewHost{
  position:fixed; inset:0; z-index:100; display:flex; flex-direction:column;
  background:
    radial-gradient(120% 70% at 80% -8%, #1a2743 0%, rgba(26,39,67,0) 55%),
    var(--bg);
  opacity:0; transform:scale(.9); pointer-events:none;
  transition:opacity .26s ease, transform .34s cubic-bezier(.2,.9,.25,1);
  transform-origin:50% 50%;
}
#viewHost.on{opacity:1; transform:scale(1); pointer-events:auto}
.view-bar{
  display:flex; align-items:center; gap:12px; flex:0 0 auto;
  padding:calc(var(--safe-top) + 12px) 16px 12px;
  border-bottom:1px solid var(--line);
  background:rgba(10,14,24,.72); backdrop-filter:blur(12px);
}
.view-bar .back{
  border:1px solid var(--line); background:rgba(255,255,255,.05); color:var(--fg);
  font-size:13.5px; font-family:inherit; border-radius:999px; padding:6px 14px; cursor:pointer;
}
.view-bar .back:active{background:rgba(255,255,255,.12)}
.view-bar .vt{font-size:15px; letter-spacing:2px; color:var(--accent); font-weight:600}
.view-body{
  position:relative; flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch;
  padding:18px 18px calc(var(--safe-bot) + 40px);
}
.view-body.short{overflow:hidden; padding:0}

/* 视图内元素 */
.card{
  border:1px solid var(--line); border-radius:15px; padding:16px;
  background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.015));
  margin-bottom:14px;
}
.card.hl{
  border-color:rgba(201,185,143,.3);
  background:linear-gradient(180deg,rgba(201,185,143,.11),rgba(201,185,143,.025));
}
.card h3{margin:0 0 10px; font-size:13px; letter-spacing:2px; color:var(--accent); font-weight:600}
.card .big{font-size:22px; font-weight:600; color:#f2ecdc; letter-spacing:1px; margin-bottom:4px}
.card .sub{font-size:12.5px; color:var(--dim2)}
.card p{margin:8px 0; font-size:14px; color:#dfe6f2}

ul.items{list-style:none;margin:0;padding:0}
ul.items li{display:flex;gap:14px;padding:11px 0;border-top:1px solid rgba(255,255,255,.055)}
ul.items li:first-child{border-top:none}
ul.items .t{flex:0 0 44px;color:#9d8f68;font-size:12.5px;font-variant-numeric:tabular-nums;padding-top:3px}
ul.items .x{margin:0;flex:1;color:#dfe6f2;font-size:14.5px}
ul.items li.night .x{color:#b9c5d8}

.day{margin-bottom:9px;border:1px solid var(--line);border-radius:13px;overflow:hidden;
     background:rgba(255,255,255,.02)}
.dayhead{display:flex;align-items:center;gap:10px;cursor:pointer;
         padding:13px 15px;font-size:13.5px;color:var(--dim);user-select:none}
.dayhead .arrow{color:var(--dim2);font-size:10px;transition:transform .22s}
.day.open .dayhead .arrow{transform:rotate(90deg)}
.day.open .dayhead{color:var(--accent)}
.dayhead .tag{font-size:11px;color:var(--accent);border:1px solid rgba(201,185,143,.3);
              border-radius:999px;padding:1px 8px}
.dayhead .n{margin-left:auto;color:var(--dim2);font-size:12px}
.day ul.items{display:none;padding:0 15px 8px}
.day.open ul.items{display:block}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{font-size:12px;color:var(--dim);border:1px solid var(--line);
      padding:5px 11px;border-radius:999px;background:rgba(255,255,255,.025)}

/* 桌游视图 */
.game-shell{position:absolute; inset:0; display:flex; flex-direction:column; z-index:1}
.game-frame{flex:1; width:100%; border:0; background:#2e2822; display:block}

/* ============================================================
   太空游戏的操作层 —— 手机优先 · 赛博终端风 · 手柄式底座
   ────────────────────────────────────────────────────────────
   早期做法是「控件浮在满屏地图上」，结果是摇杆压住地图（用户：看不清界面了）。
   现在改成**分区**：屏幕从上到下切成三段，谁也不压谁 ——
     ① 顶部信息条（2 行文字高，正好顶替游戏自己的标题行+状态行）
     ② 游戏画面 iframe（顶部到底座之间，地图 + 游戏自己的日志条都在这段里）
     ③ 底部控制底座 .sg-deck（约屏幕下方 1/3，深色半透明面板）
          ├ 左下：虚拟摇杆（热区大、画得小）
          └ 右下：确认 / 交互 **两个圆角矩形大键**，右对齐、垂直排一列
   铁律：iframe 的 bottom = 底座高度 —— 地图**一格都不会被盖住**。
   尺寸一律由 JS 算（SG_SIZE + sgLayout）写进 CSS 变量，这里只放纯 px 兜底：
   手机浏览器对 clamp()/env() 支持参差，CSS 里算尺寸只要有一条不认，width 就退回
   auto —— 圆角矩形大键会当场塌成贴着文字的小方块。
   ============================================================ */
.game-shell.space{
  --sg-top:0px;
  --sg-deck:232px;                       /* 底部控制底座高度 */
  --sg-bot:40px;                         /* 底座内控件距屏幕底 */
  --sg-hit:130px; --sg-ring:108px;       /* 摇杆：热区 / 画出来的圆 */
  --sg-pad-w:104px; --sg-ok:58px; --sg-act:52px; --sg-gap:8px;
  --sg-hud:35px;
  --sg-cyan:#3fd8ff; --sg-orange:#ff9a3c;
  --sg-line:rgba(120,190,255,.22);
}
/* 画面整体下移到安全区之下，上不压信息条、下不压底座 —— 地图一格都不会被盖住 */
.game-shell.space .game-frame{
  position:absolute; left:0; right:0; top:var(--sg-top); bottom:var(--sg-deck);
}

.cmdbar.sg{
  position:absolute; inset:0; z-index:10; pointer-events:none;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif;
  -webkit-user-select:none; user-select:none;
}
.cmdbar.sg.hidekeys .sg-stick, .cmdbar.sg.hidekeys .sg-pad{display:none}
.cmdbar.sg .hidden{display:none !important}
/* 层级：底座 1 < 信息条 2 < 警告 3 < 遮罩 5 < 抽屉 6 < 菜单 7 */
.cmdbar.sg .sg-deck{z-index:1}
.cmdbar.sg .sg-hud{z-index:2}
.cmdbar.sg .sg-warn{z-index:3}
.cmdbar.sg .sg-veil{z-index:5}
.cmdbar.sg .sg-panel{z-index:6}
.cmdbar.sg .sg-menu{z-index:7}

/* ---------- ① 顶部信息条：地图状态 / 速度 / 时间（提示优先） ---------- */
.sg-hud{
  position:absolute; left:0; right:0; top:var(--sg-top); height:var(--sg-hud);
  display:flex; align-items:center; gap:6px; padding:0 8px;
  pointer-events:auto; overflow:hidden;
  background:linear-gradient(180deg, rgba(9,13,22,.97), rgba(9,13,22,.9));
  border-bottom:1px solid var(--sg-line);
  box-shadow:0 1px 0 rgba(63,216,255,.10), 0 8px 20px -14px #000;
  font-size:12.5px; color:#c7d6ea;
}
.sg-hud .sg-scene{
  color:#ffd9a8; font-weight:600; max-width:8em;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.sg-hud .sg-pos{color:#7f93b0; font-family:ui-monospace,Consolas,monospace; font-size:11px}
.sg-hud .sg-hp{display:flex; align-items:center; gap:5px; margin-left:auto;
  color:#9fd8b4; font-family:ui-monospace,Consolas,monospace; font-size:11.5px}
.sg-hud .sg-hp .bar{display:block; width:36px; height:4px; border-radius:2px;
  background:rgba(255,255,255,.15); overflow:hidden}
.sg-hud .sg-hp .bar i{display:block; height:100%; border-radius:2px;
  background:linear-gradient(90deg,#3fd8ff,#5ce6a0); transition:width .25s}
.sg-hud .sg-hp.low{color:#ff9d9d}
.sg-hud .sg-hp.low .bar i{background:linear-gradient(90deg,#ff9a3c,#ff6b7a)}
/* 游戏里有提示（world.hint）时，整条信息条让给提示 —— 它本来占的就是游戏那一行 */
.sg-hud.hinting .sg-scene, .sg-hud.hinting .sg-pos, .sg-hud.hinting .sg-hp{display:none}
.sg-hud .sg-hint{
  display:none; flex:1 1 auto; min-width:0; color:#ffe0b8; font-weight:600;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.sg-hud.hinting .sg-hint{display:block}
/* 速度胶囊：点一下就换档（暂停 → 1x → 2x → 4x → 8x） */
.sg-spd{
  flex:0 0 auto; font-family:inherit; font-size:11px; line-height:1; cursor:pointer;
  padding:5px 9px; border-radius:999px;
  border:1px solid rgba(63,216,255,.32); background:rgba(63,216,255,.10);
  color:#bfeaff; -webkit-tap-highlight-color:transparent; touch-action:manipulation;
}
.sg-spd.paused{border-color:rgba(255,154,60,.45); background:rgba(255,154,60,.12); color:#ffd9a8}
.sg-spd:active{filter:brightness(1.3)}
.sg-hud .sg-clock{
  flex:0 0 auto; font-family:ui-monospace,Consolas,monospace; font-size:15px; font-weight:700;
  color:#eaf7ff; letter-spacing:.5px; text-shadow:0 0 10px rgba(63,216,255,.5);
}
.sg-hud .sg-day{color:#6f8098; font-size:10.5px; font-family:ui-monospace,Consolas,monospace}

/* ---------- ③ 底部控制底座：手柄式，两侧控件稳稳贴在面板上 ---------- */
.sg-deck{
  position:absolute; left:0; right:0; bottom:0; height:var(--sg-deck);
  pointer-events:auto; overflow:hidden;
  background:
    radial-gradient(120% 90% at 18% 120%, rgba(63,216,255,.10), rgba(63,216,255,0) 62%),
    radial-gradient(120% 90% at 88% 120%, rgba(255,154,60,.09), rgba(255,154,60,0) 60%),
    linear-gradient(180deg, rgba(12,17,28,.80) 0%, rgba(8,11,19,.94) 46%, rgba(6,9,16,.98) 100%);
  border-top:1px solid rgba(63,216,255,.22);
  box-shadow:0 -14px 30px -20px #000, inset 0 1px 0 rgba(255,255,255,.05);
}
/* 面板上的细网格：让「按键贴在面板上」有依托，不是浮在半空 */
.sg-deck::before{
  content:''; position:absolute; inset:0; pointer-events:none; opacity:.5;
  background-image:
    linear-gradient(rgba(120,190,255,.045) 1px, transparent 1px),
    linear-gradient(90deg, rgba(120,190,255,.045) 1px, transparent 1px);
  background-size:22px 22px, 22px 22px;
}
.sg-deck .sg-deckline{
  position:absolute; left:14px; right:14px; top:9px; height:1px;
  background:linear-gradient(90deg, rgba(63,216,255,.28), rgba(63,216,255,.04) 42%, rgba(255,154,60,.22));
}

/* ---------- 摇杆（底座左下）：热区大、画得小 ---------- */
.sg-stick{
  position:absolute; left:14px; bottom:var(--sg-bot);
  width:var(--sg-hit); height:var(--sg-hit); border-radius:50%;
  pointer-events:auto; touch-action:none; background:none; border:0; padding:0;
  display:flex; align-items:center; justify-content:center;
}
.sg-ring{
  position:relative; width:var(--sg-ring); height:var(--sg-ring); border-radius:50%;
  background:
    radial-gradient(circle at 50% 42%, rgba(63,216,255,.10), rgba(63,216,255,0) 68%),
    linear-gradient(180deg, rgba(24,33,50,.85), rgba(12,17,28,.9));
  border:1px solid rgba(120,190,255,.3);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.06), inset 0 0 22px -10px rgba(63,216,255,.6),
             0 6px 16px -12px #000;
  transition:background .18s, border-color .18s, box-shadow .18s;
}
.sg-stick.on .sg-ring{
  border-color:rgba(63,216,255,.6);
  box-shadow:inset 0 0 26px -8px rgba(63,216,255,.6), 0 0 18px -10px rgba(63,216,255,.7);
}
.sg-stick .chev{
  position:absolute; width:30px; height:30px; border-radius:9px;
  display:flex; align-items:center; justify-content:center;
  font-size:12px; color:#8aa4c0; background:rgba(255,255,255,.05);
  border:1px solid rgba(120,190,255,.18);
  transition:background .1s, color .1s, box-shadow .1s;
}
.sg-stick .chev.u{left:50%; top:3px;    transform:translateX(-50%)}
.sg-stick .chev.d{left:50%; bottom:3px; transform:translateX(-50%)}
.sg-stick .chev.l{left:3px;  top:50%;    transform:translateY(-50%)}
.sg-stick .chev.r{right:3px; top:50%;    transform:translateY(-50%)}
.sg-stick .chev.lit{
  color:#04121a; background:var(--sg-cyan); border-color:var(--sg-cyan);
  box-shadow:0 0 14px -2px rgba(63,216,255,.75);
}
.sg-stick .knob{
  position:absolute; left:50%; top:50%; width:36%; height:36%; border-radius:50%;
  transform:translate(-50%,-50%) translate(var(--kx,0px), var(--ky,0px));
  display:flex; align-items:center; justify-content:center;
  background:radial-gradient(circle at 38% 32%, #36486a, #141d2e 74%);
  border:1px solid rgba(160,200,255,.4); color:#bcd8f2; font-size:13px;
  box-shadow:0 4px 12px -6px #000, inset 0 1px 0 rgba(255,255,255,.12);
}
.sg-stick.on .knob{border-color:rgba(63,216,255,.8); color:#eaf7ff;
  box-shadow:0 0 16px -4px rgba(63,216,255,.7), inset 0 1px 0 rgba(255,255,255,.14)}

/* ---------- 动作键（底座右下）：两个圆角矩形，右对齐、竖着排一列 ----------
   最右下角 = 主键【确认】；它正上方、同宽同右边缘 = 副键【交互】。 */
.sg-pad{
  position:absolute; right:14px; bottom:var(--sg-bot);
  display:flex; flex-direction:column; align-items:stretch; gap:var(--sg-gap);
  width:var(--sg-pad-w); pointer-events:none;
}
.sg-a{
  pointer-events:auto; width:100%; padding:0; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  font-family:inherit; font-weight:700; letter-spacing:2px;
  border-radius:16px;
  -webkit-tap-highlight-color:transparent; touch-action:manipulation;
  transition:transform .1s, filter .1s, box-shadow .18s, border-color .18s;
}
.sg-a.ok{
  height:var(--sg-ok); font-size:16px; color:#fff4e6;
  border:1.5px solid rgba(255,154,60,.78);
  background:linear-gradient(180deg, rgba(255,154,60,.30), rgba(255,154,60,.10) 62%), rgba(14,10,6,.72);
  box-shadow:0 0 20px -8px rgba(255,154,60,.85), inset 0 1px 0 rgba(255,255,255,.12);
}
.sg-a.act{
  height:var(--sg-act); font-size:14px; color:#e4f7ff;
  border:1.5px solid rgba(63,216,255,.6);
  background:linear-gradient(180deg, rgba(63,216,255,.24), rgba(63,216,255,.07) 62%), rgba(7,12,20,.72);
  box-shadow:0 0 16px -9px rgba(63,216,255,.9), inset 0 1px 0 rgba(255,255,255,.1);
}
.sg-a:active{transform:translateY(1px) scale(.985); filter:brightness(1.28)}
.sg-a.flash{filter:brightness(1.6)}
/* 键帽下沿的一道细线：按压感 + 「贴在面板上」的实感 */
.sg-a::after{
  content:''; position:absolute; left:14px; right:14px; bottom:5px; height:1px;
  background:currentColor; opacity:.18;
}
.sg-a{position:relative}

/* ---------- 菜单：底座右上角的小胶囊（低频键全收进去） ---------- */
.sg-menu{
  position:absolute; right:14px; top:10px;
  display:flex; align-items:center; gap:8px; pointer-events:none;
}
.sg-fab, .sg-back{
  height:32px; flex:0 0 auto; border-radius:11px; cursor:pointer;
  display:flex; align-items:center; justify-content:center; padding:0 12px;
  font-family:inherit; font-size:12.5px; line-height:1;
  -webkit-tap-highlight-color:transparent; touch-action:manipulation;
}
.sg-fab{
  pointer-events:auto; border:1px solid var(--sg-line);
  background:rgba(18,25,40,.9); color:#bcd0e6;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06);
}
.sg-back{
  border:1px solid rgba(63,216,255,.55); background:rgba(63,216,255,.16); color:#dff6ff;
  box-shadow:0 0 16px -8px rgba(63,216,255,.8);
}
.sg-fab.on{border-color:rgba(63,216,255,.55); color:#dff6ff}
.sg-fab:active, .sg-back:active{transform:scale(.95)}

/* 菜单抽屉：从底座右上方展开（不挡地图，也不遮住摇杆和两个大键） */
.sg-veil{position:absolute; inset:0; background:rgba(3,6,12,.55); pointer-events:auto;
  animation:sgFade .16s ease-out}
@keyframes sgFade{from{opacity:0} to{opacity:1}}
.sg-panel{
  position:absolute; right:14px; bottom:calc(var(--sg-deck) + 10px);
  width:min(330px, 88vw); max-height:min(56vh, 440px); overflow-y:auto; pointer-events:auto;
  padding:10px 12px 12px; border-radius:16px;
  background:linear-gradient(180deg, rgba(15,21,34,.98), rgba(9,13,22,.98));
  border:1px solid var(--sg-line);
  box-shadow:0 24px 60px -24px #000, inset 0 1px 0 rgba(255,255,255,.05);
  backdrop-filter:blur(16px) saturate(140%); -webkit-backdrop-filter:blur(16px) saturate(140%);
  animation:sgDrop .18s cubic-bezier(.2,.9,.3,1);
}
@keyframes sgDrop{from{opacity:0; transform:translateY(-8px)} to{opacity:1; transform:none}}
.sg-panel .gp{margin-bottom:9px}
.sg-panel .gp:last-child{margin-bottom:0}
.sg-panel .gp-t{font-size:10.5px; letter-spacing:2px; color:#5f7089; margin:0 0 6px 2px}
.sg-panel .gp-b{display:grid; grid-template-columns:repeat(auto-fill,minmax(88px,1fr)); gap:7px}
.sg-panel button{
  font-family:inherit; font-size:12.5px; height:42px; cursor:pointer; padding:0 6px;
  border:1px solid var(--sg-line); border-radius:11px;
  background:rgba(255,255,255,.045); color:#d3e0f0; white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis;
  -webkit-tap-highlight-color:transparent; touch-action:manipulation;
}
.sg-panel button:active{background:rgba(63,216,255,.18); border-color:rgba(63,216,255,.5)}
.sg-panel button.on{border-color:rgba(63,216,255,.55); color:#dff6ff; background:rgba(63,216,255,.14)}
.sg-panel .tip{font-size:10.5px; line-height:1.7; color:#6f8098; margin-top:2px}
.sg-panel .tip b{color:#9fb4cc; font-weight:600}
.sg-warn{
  position:absolute; left:10px; right:10px; top:calc(var(--sg-top) + var(--sg-hud) + 6px);
  padding:6px 10px; border-radius:10px; font-size:11.5px; line-height:1.5;
  color:#ffd9dc; background:rgba(40,12,16,.92); border-left:2px solid #ff6b7a;
}
.sg-imm{
  position:absolute; left:14px; bottom:var(--sg-bot); pointer-events:auto;
  font-family:inherit; font-size:11.5px; padding:9px 13px; border-radius:999px; cursor:pointer;
  border:1px solid var(--sg-line); background:rgba(18,25,40,.92); color:#9fb4cc;
  -webkit-tap-highlight-color:transparent;
}

/* 底部安全区之外的浮层：构建自检提示（比所有视图都高，但低于密码门） */
#buildPill{
  position:fixed; left:50%; transform:translateX(-50%);
  top:calc(var(--safe-top) + 8px); z-index:150; display:none;
  align-items:center; padding:7px 14px; border-radius:999px; cursor:pointer;
  font-family:inherit; font-size:12px; line-height:1.4; color:#ffe6c9;
  background:rgba(38,23,8,.95); border:1px solid rgba(255,154,60,.6);

  -webkit-tap-highlight-color:transparent; touch-action:manipulation;
}
#buildPill.on{display:flex}
#buildPill:active{transform:translateX(-50%) scale(.96)}

/* 返回按钮：足够显眼、可点、永远压在内容上面 */
.view-bar{position:relative; z-index:20}
.view-bar .back{
  border:1px solid rgba(201,185,143,.42) !important;

}
.view-bar .back:active{transform:scale(.96); background:rgba(201,185,143,.26) !important}
/* 左边缘右滑返回的提示条 */
.edge{
  position:fixed; left:0; top:0; bottom:0; width:18px; z-index:25;
  touch-action:pan-y;
}


/* ============================================================
   日历 · 心象轨迹（莫兰迪 · 极暗灰蓝）
   ============================================================ */
.cal-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.cal-head .ym{font-size:16.5px;letter-spacing:2px;color:#cfc6b0;font-weight:600}
.cal-head .sp{flex:1}
.cal-nav{border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);

  justify-content:center;cursor:pointer;transition:background .16s}
.cal-nav:active{background:rgba(255,255,255,.13)}
.cal-week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;font-size:11px;
  color:#5f6b80;text-align:center;margin-bottom:8px;letter-spacing:1.5px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;

    radial-gradient(rgba(255,255,255,.028) 1px, transparent 1px),

  box-shadow:inset 0 1px 0 rgba(255,255,255,.05), 0 6px 20px rgba(0,0,0,.35)}
.dcell{

}
.dcell.empty{background:transparent;box-shadow:none}
.dcell.has{background:rgba(159,176,200,.09);color:#cfd8e6;cursor:pointer}

.dcell.today{box-shadow:inset 0 0 0 1.5px rgba(125,211,252,.55), inset 0 1px 2px rgba(0,0,0,.45)}
.dcell.sel{background:rgba(201,185,143,.22);box-shadow:inset 0 0 0 1.5px rgba(201,185,143,.7)}

.cal-legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;font-size:10.5px;color:#5f6b80}

.cal-tip{text-align:center;color:#4e596b;font-size:12px;padding:14px 0 4px;letter-spacing:.5px}

/* 未来日期提示 */
function showFutureToast(key){
  var el = document.getElementById('ftoast');
  if(!el){
    el = document.createElement('div');
    el.id = 'ftoast'; el.className = 'ftoast';
    document.body.appendChild(el);
  }
  var d = parseInt(key.slice(8,10),10), m = parseInt(key.slice(5,7),10);
  el.innerHTML = '<b>时间尚未抵达</b><span>' + m + ' 月 ' + d + ' 日还没有发生</span>';
  el.classList.add('on');
  clearTimeout(el._t);
  el._t = setTimeout(function(){ el.classList.remove('on'); }, 2200);
}

/* ---------- 底部抽屉 ---------- */
.sheet{position:fixed;inset:0;z-index:180;pointer-events:none}
.sheet.on{pointer-events:auto}
.sheet-mask{position:absolute;inset:0;background:rgba(3,5,9,.66);
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
  opacity:0;transition:opacity .28s}

/* 轨迹概要 */
.traj{display:flex;gap:9px;align-items:flex-start;padding:10px 12px;border-radius:11px;

/* 时间轴 */
.tl-wrap{position:relative}
.tl{position:relative;display:flex;gap:12px;padding-bottom:12px}
.tl:last-child{padding-bottom:2px}
.tl-t{flex:0 0 44px;font-size:12px;color:#9d8f68;font-variant-numeric:tabular-nums;
  padding-top:9px;text-align:right;letter-spacing:.3px}

  background:rgba(139,115,85,.55);box-shadow:0 0 0 3px rgba(139,115,85,.14);position:relative}
.tl-dot::after{content:"";position:absolute;left:50%;top:14px;width:1px;height:calc(100% + 14px);
  background:linear-gradient(180deg,rgba(139,115,85,.3),rgba(139,115,85,.03));transform:translateX(-50%)}

/* ---------- 墨迹与长按解锁 ---------- */
.lockbar{position:relative;display:flex;align-items:center;gap:9px;cursor:pointer;

  background:linear-gradient(90deg,#8a6fb0,#c9a3e0);border-radius:2px;transition:width .06s linear}

/* ---------- 底部抽屉（Bottom Sheet） ---------- */
function sheetEl(){
  var el = document.getElementById('sheet');
  if(el) return el;
  el = document.createElement('div');
  el.id = 'sheet';
  el.className = 'sheet';
  el.innerHTML = '<div class="sheet-mask" id="sheetMask"></div>'
    + '<div class="sheet-box" id="sheetBox">'
    + '<div class="sheet-grab"></div>'
    + '<div class="sheet-head"><div class="sh-l"><span class="sh-d" id="shD"></span>'
    + '<span class="sh-w" id="shW"></span></div>'
    + '<button class="sh-x" id="shX">关上</button></div>'
    + '<div class="sheet-body" id="sheetBody"></div>'
    + '</div>';
  document.body.appendChild(el);
  el.querySelector('#sheetMask').onclick = closeSheet;
  el.querySelector('#shX').onclick = closeSheet;
  return el;
}
function closeSheet(){
  var el = document.getElementById('sheet');
  if(!el) return;
  el.classList.remove('on');
  sfx('closeapp');
  setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, 260);
  CAL_SEL = null;
}
/* 时间轴卡片 */
/* 私密记录：深夜的隐秘念头 / 身体感受 —— 默认上锁 */
const PRIVATE_RE = /腿夹紧|身体莫名|洗澡时她不敢|羞耻|隐秘|那一小块皮肤|指尖擦过腰|对着镜子看很久|不敢多看|想被抱住|渴望|皮肤的|半夜里|深夜身体|对自己身体|某种意志/;
function isPrivate(t){ return PRIVATE_RE.test(t); }

function tlItems(items){
  return items.map(function(it, i){
    var h = parseInt(it.time.slice(0,2),10);
    var night = (h < 6 || h >= 22);
    var priv = isPrivate(it.text);
    return '<div class="tl' + (night ? ' tl-night' : '') + (priv ? ' tl-priv' : '') + '">'
      + '<div class="tl-t">' + it.time + '</div>'
      + '<div class="tl-dot"></div>'
      + '<div class="tl-card">'
        + (priv
            ? '<div class="lockbar" data-unlock="' + i + '"><span class="lk">🔒</span>'
              + '<span class="lkt">这一段她锁起来了</span><span class="lkh">点一下打开</span></div>'
              + '<div class="locked-text" data-text="' + i + '">' + it.text + '</div>'
            : it.text)
      + '</div></div>';
  }).join('');
}
function bindLocks(root){
  if(!root) return;
  root.querySelectorAll('.lockbar').forEach(function(b){
    b.onclick = function(){
      var i = b.dataset.unlock;
      var t = root.querySelector('[data-text="' + i + '"]');
      if(t){ t.classList.add('on'); b.classList.add('opened'); sfx('coin'); }
      setTimeout(function(){ b.style.display = 'none'; }, 320);
    };
  });
}
function openDaySheet(key, rec){
  var el = sheetEl();
  var dt = new Date(key + 'T12:00:00');
  $('shD').textContent = (+key.slice(5,7)) + ' 月 ' + (+key.slice(8,10)) + ' 日';
  var lab = fmtDay(key);
  $('shW').textContent = (rec && rec.weekday ? rec.weekday : '')
    + (lab.tag ? ' · ' + lab.tag : '')
    + (rec && rec.items.length ? ' · ' + rec.items.length + ' 条' : '');
  var body = $('sheetBody');
  var html = '';
  if(rec && rec.items.length){
    html += '<div class="tl-wrap">' + tlItems(rec.items) + '</div>';
  } else {
    html += '<div class="sh-empty">这一天她没有留下记录。</div>';
  }
  if(rec && rec.extra && rec.extra.length) html += extraBlock(rec.extra);
  body.innerHTML = html;
  bindLocks(body);
  (function(){
    var el = $('dmoon'); if(!el) return;
    var lv = 'calm', pd = false;
    try{
      var em = (window.__SAKU_EMO_BY_DAY || {})[day.date];
      if(em){ lv = em.level; pd = !!em.period; }
    }catch(e){}
    var m = moonOf(lv, pd);
    el.innerHTML = '<span class="mg">' + m.g + '</span>' + m.cn;
  })();
  body.scrollTop = 0;
  el.classList.add('on');
  sfx('openapp');
}

/* ---------- 界外记录板块 ---------- */
function pickBySeed(arr, seed){ return arr[Math.abs(seed) % arr.length]; }
function extraBlock(list){
  if(!list || !list.length) return '';
  var rows = list.map(function(r){
    var isReb = (r.outcome === 'rebuild');
    var mood = r.mood || (currentMood() || {}).level || 'calm';
    var byMood = isReb
      ? (REBUILD_TEXT_MOOD[mood] || null)
      : ((OUTCOME_TEXT_MOOD[mood] || {})[r.outcome] || null);
    var t = byMood || (isReb ? REBUILD_TEXT : (OUTCOME_TEXT[r.outcome] || OUTCOME_TEXT.quit));
    var txt = pickBySeed(t, (r.at || 0) % 997);
    var icon = OUTCOME_ICON[r.outcome] || '…';
    var cn = OUTCOME_CN[r.outcome] || '';
    var detail = isReb
      ? '用了构筑权 · 她改了开局'
      : ('第 ' + (r.turns||'?') + ' 回合 · 深渊 ' + (r.abyss != null ? r.abyss : '?') + '/12'
         + (r.turnLimit ? '（上限 ' + r.turnLimit + '）' : ''));
    return '<li class="xr xr-' + (r.outcome||'quit') + '">'
      + '<span class="xt">' + (r.time || '--:--') + '</span>'
      + '<span class="xx">'
        + '<b><i class="xi">' + icon + '</i>' + cn + '</b>'
        + '<span class="xd">' + txt + '</span>'
        + '<span class="xm">' + detail + '</span>'
      + '</span></li>';
  }).join('');
  return '<div class="xblock">'
    + '<div class="xh"><span class="xo">⚄</span>界外记录'
    + '<span class="xnote">发生在梦里，不属于这一天的主线</span></div>'
    + '<ul class="xlist">' + rows + '</ul></div>';
}

/* ---------- 沙盒提示条 ---------- */

  animation:sbPulse 1.4s ease-in-out infinite}
@keyframes sbPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}

/* ============================================================
   日记：真正的纸
   米色纸底 + 深色衬线字，按当天情绪换排版气质
   ============================================================ */
.dpaper{
  position:relative; overflow:hidden; border-radius:14px;
  padding:26px 22px 24px;
  background:
    radial-gradient(rgba(150,120,80,.05) 1px, transparent 1px) 0 0/13px 13px,
    linear-gradient(178deg,#f4ead6 0%,#efe3cb 55%,#e9dcc0 100%);
  box-shadow:0 3px 18px rgba(0,0,0,.45), inset 0 0 60px rgba(150,120,80,.10);
  color:#2b2117;
}
/* 纸的毛边 */
.dpaper::before{
  content:''; position:absolute; inset:0; pointer-events:none;
  background:radial-gradient(ellipse at 12% 8%, rgba(120,95,60,.10), transparent 42%),
             radial-gradient(ellipse at 88% 92%, rgba(120,95,60,.09), transparent 46%);
}
.dmeta{display:flex; align-items:center; gap:9px; margin-bottom:14px;
  font-family:-apple-system,"PingFang SC",sans-serif; font-size:11.5px; color:#7a6a52}
.dmeta .sp{flex:1}
.dm-moon{display:inline-flex; align-items:center; gap:4px}
.dm-lock{font-style:normal; margin-left:3px; font-size:10px}

.dtitle{display:flex; align-items:baseline; gap:3px; margin-bottom:20px;
  color:#3a2c1c; font-family:"Songti SC","STSong",serif; letter-spacing:.04em}
.dt-n{font-size:34px; font-weight:600; line-height:1}
.dt-u{font-size:14px; color:#8a7455; margin:0 5px 0 1px}

/* 正文：有呼吸感 */
.dtxt{margin:0 0 8px}
.dtp{
  margin:0 0 17px; padding-left:1.2em; text-indent:-0.6em;
  font-family:"Kaiti SC","STKaiti","KaiTi","Songti SC",serif;
  font-size:16px; line-height:2.15; color:#2b2117;
  letter-spacing:.02em;
}
.dtp:last-child{margin-bottom:4px}
.dtp-empty{color:#9a8a72; font-style:italic}

/* ---- 情绪映射：平静 → 工整留白；烦躁/崩溃 → 错落、压暗 ---- */
.dpaper[data-mood="irrit"]{
  background:
    radial-gradient(rgba(150,120,80,.07) 1px, transparent 1px) 0 0/11px 11px,
    linear-gradient(176deg,#e9dcc2 0%,#e2d4b6 60%,#dbcaa8 100%);
  box-shadow:0 3px 18px rgba(0,0,0,.5), inset 0 0 70px rgba(110,80,50,.18);
}
.dpaper[data-mood="irrit"] .dtp{ line-height:1.95; letter-spacing:.01em }
.dpaper[data-mood="irrit"] .dtp:nth-child(odd){ margin-left:14px }
.dpaper[data-mood="irrit"] .dtp:nth-child(3n){ margin-left:-6px; text-indent:.6em }

.dpaper[data-mood="collapse"]{
  background:
    radial-gradient(rgba(120,95,65,.09) 1px, transparent 1px) 0 0/9px 9px,
    linear-gradient(174deg,#ddd0b4 0%,#d3c3a4 55%,#c9b795 100%);
  box-shadow:0 3px 18px rgba(0,0,0,.55), inset 0 0 90px rgba(90,60,35,.26);
}
.dpaper[data-mood="collapse"] .dtp{ line-height:1.85; font-size:15.5px }
.dpaper[data-mood="collapse"] .dtp:nth-child(2n){ margin-left:22px; transform:rotate(-.35deg) }
.dpaper[data-mood="collapse"] .dtp:nth-child(3n){ margin-left:-10px; transform:rotate(.4deg) }
/* 崩溃日的涂改痕迹 */
.dpaper[data-mood="collapse"] .dtp:nth-child(3)::after{
  content:''; display:block; height:1.5px; margin-top:-8px; width:72px;
  background:linear-gradient(90deg, rgba(90,60,35,.42), rgba(90,60,35,.06));
  transform:rotate(-1.6deg);
}

/* 随笔 */
.dnote{
  margin:22px 0 0; padding:15px 16px 16px; border-radius:10px;
  background:rgba(120,95,60,.075);
  border-left:3px solid rgba(120,95,60,.35);
}
.dn-h{display:flex; align-items:center; gap:6px; font-size:11px; color:#8a7455;
  letter-spacing:.18em; margin-bottom:8px; font-family:-apple-system,"PingFang SC",sans-serif}
.dn-h .sp{flex:1}
.dn-by{font-size:10px; color:#a08e72; letter-spacing:.05em}
.dn-t{font-size:15px; line-height:1.95; color:#33261a; text-indent:1.6em;
  font-family:"Kaiti SC","STKaiti","KaiTi",serif}

/* ---- 墨迹封层：私密的一天 ---- */
.inkveil{
  position:absolute; inset:0; z-index:5; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:14px; overflow:hidden; border-radius:14px;
  background:rgba(28,22,16,.30);
  -webkit-user-select:none; user-select:none;
  transition:opacity .5s ease, backdrop-filter .5s;
}
.inkveil.gone{opacity:0; pointer-events:none; backdrop-filter:blur(0)}
.inkblot{
  position:absolute; border-radius:48% 52% 55% 45% / 52% 46% 54% 48%;
  background:radial-gradient(circle at 38% 34%, rgba(22,18,14,.94), rgba(12,10,8,.99) 72%);
  filter:blur(1.2px); animation:inkDrift 9s ease-in-out infinite;
}
.inkblot:nth-child(1){width:58%; height:46%; top:12%; left:4%;  animation-delay:0s}
.inkblot:nth-child(2){width:52%; height:40%; top:44%; left:34%; animation-delay:-2.4s}
.inkblot:nth-child(3){width:44%; height:38%; top:8%;  left:52%; animation-delay:-4.1s}
.inkblot:nth-child(4){width:48%; height:34%; top:62%; left:8%;  animation-delay:-6.3s}
.inkblot:nth-child(5){width:36%; height:30%; top:30%; left:26%; animation-delay:-1.2s}
@keyframes inkDrift{
  0%,100%{transform:translate(0,0) rotate(0) scale(1)}
  33%    {transform:translate(3px,-4px) rotate(2deg) scale(1.03)}
  66%    {transform:translate(-3px,3px) rotate(-2deg) scale(.98)}
}
.inkctr{position:relative; z-index:2; text-align:center; color:#e7dcc6}
.inklock{font-size:30px; filter:drop-shadow(0 2px 8px rgba(0,0,0,.7))}
.inktip{font-size:12px; letter-spacing:.16em; opacity:.78; margin-top:9px;
  font-family:-apple-system,"PingFang SC",sans-serif}
.inkbar{

  background:rgba(240,230,210,.22); overflow:hidden;
}
.inkbar > i{display:block; height:100%; width:var(--p,0%);
  background:linear-gradient(90deg,#c9a95e,#f0e6d2); transition:width .06s linear}

/* 解锁之后：手写时的轻微颤抖 */

  0%{transform:skewX(-1.6deg) translateX(-3px); opacity:.4}
  40%{transform:skewX(.9deg) translateX(2px)}
  70%{transform:skewX(-.5deg)}
  100%{transform:none; opacity:1}

.drop-list{display:flex;flex-direction:column;gap:5px;font-size:12.5px;max-height:220px;overflow:auto}
.drop-item{border-left:3px solid rgba(201,169,94,.6);padding:3px 0 3px 9px;color:#cdd7e8;word-break:break-all}
.drop-item .di-n{font-family:ui-monospace,Menlo,monospace;font-size:12px}

/* ---------- 开发者模式 ---------- */
.dev-stat{display:flex; gap:14px; flex-wrap:wrap; margin:10px 0 4px}
.dev-stat span{font-size:12.5px; color:var(--dim2)}
.dev-stat b{font-size:17px; color:var(--accent); font-weight:600}
.dev-btns{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px}
.dev-btn{
  border:1px solid rgba(201,185,143,.35); background:rgba(201,185,143,.11);
  color:#e8dcb4; font-family:inherit; font-size:13px; border-radius:9px;
  padding:8px 14px; cursor:pointer;
}
.dev-btn:active{transform:scale(.97); background:rgba(201,185,143,.2)}
.dev-btn.dan{border-color:rgba(192,112,106,.5); background:rgba(192,112,106,.1); color:#e0a09a}
.dev-item{
  border:1px solid rgba(255,255,255,.07); border-radius:10px; padding:9px 11px;
  margin-bottom:8px; background:rgba(255,255,255,.028);
}
.di-top{display:flex; align-items:baseline; gap:8px; margin-bottom:4px}
.di-t{font-size:11.5px; color:#9d8f68; font-variant-numeric:tabular-nums}
.di-p{font-size:11px; color:var(--dim2); border:1px solid var(--line); border-radius:999px; padding:0 7px}
.di-x{font-size:14px; color:#e2e9f5; line-height:1.75}
.di-layer{display:flex; gap:6px; flex-wrap:wrap; margin-top:7px}
.dl{font-size:10.5px; border-radius:5px; padding:1px 7px; letter-spacing:.3px}
.dl-scene{background:rgba(111,168,220,.16); color:#9cc6ea}
.dl-size{background:rgba(255,255,255,.06); color:var(--dim2)}
.dl-tail{background:rgba(127,199,154,.16); color:#8fd4ab}
.dl-warn{background:rgba(192,112,106,.18); color:#e0a09a}

/* ---------- 加锁的私密记录 ---------- */
.tl-priv .tl-card{background:linear-gradient(180deg,rgba(140,110,180,.11),rgba(140,110,180,.03));
  border-color:rgba(160,130,200,.22)}
.tl-priv .tl-dot{background:rgba(170,140,210,.65); box-shadow:0 0 0 3px rgba(170,140,210,.13)}
.lockbar{display:flex; align-items:center; gap:9px; cursor:pointer; padding:2px 0;
  color:#b7a6d4; font-size:13px; letter-spacing:.5px}
.lockbar .lk{font-size:15px}
.lockbar .lkt{flex:1}
.lockbar .lkh{font-size:11.5px; color:var(--dim2)}
.lockbar.opened{opacity:0; transition:opacity .3s}
.locked-text{display:none; font-size:14px; line-height:1.85; color:#e2e9f5; animation:unlockIn .45s ease-out}
.locked-text.on{display:block}
@keyframes unlockIn{from{opacity:0; filter:blur(6px); transform:translateY(-4px)}to{opacity:1; filter:none; transform:none}}
.dmoon{display:flex; align-items:center; gap:5px; margin-left:auto}
.dmoon .mg{font-size:15px; line-height:1}
.cal-cell .ph{position:absolute; top:3px; left:4px; font-size:9.5px; opacity:.85}
.cal-cell.holiday{border-color:rgba(201,185,143,.55); border-width:2px}

/* ---------- 档案：月 / 周 折叠 ---------- */
.arc-month{margin-bottom:10px; border-radius:12px; overflow:hidden;
  background:rgba(240,230,210,.05); border:1px solid rgba(240,230,210,.07)}
.arc-mh{display:flex; align-items:center; gap:9px; padding:13px 14px; cursor:pointer;
  background:rgba(240,230,210,.06); transition:background .16s}
.arc-mh:hover{background:rgba(240,230,210,.11)}
.arc-mt{font-size:14.5px; color:#e2e6ee; letter-spacing:.06em; font-weight:600}
.arc-mc{font-size:11.5px; color:#7b8494}
.arc-mb{display:none; padding:2px 0 6px}
.arc-month.open > .arc-mb{display:block}
.arc-ar{font-size:9px; color:#8b94a3; width:10px; display:inline-block}
.arc-week{margin:4px 8px; border-radius:9px; overflow:hidden; background:rgba(0,0,0,.16)}
.arc-wh{display:flex; align-items:center; gap:9px; padding:9px 11px; cursor:pointer;
  transition:background .16s}
.arc-wh:hover{background:rgba(240,230,210,.07)}
.arc-wt{font-size:12.5px; color:#aab3c2; letter-spacing:.03em}
.arc-wc{font-size:11px; color:#6f7887}
.arc-wb{display:none}
.arc-week.open > .arc-wb{display:block}
.arc-week .arc-row{border-radius:0; margin:0}
.arc-week .arc-row + .arc-row{border-top:1px solid rgba(240,230,210,.05)}
/* ---------- 档案（已归档的报告） ---------- */
/* ---------- 沙盒提示条 ---------- */
.sandbox-bar{
  position:fixed; top:0; left:0; right:0; z-index:9999;
  display:flex; align-items:center; justify-content:center; gap:8px;
  padding:9px 14px; font-size:13px; letter-spacing:.06em;
  background:linear-gradient(180deg,rgba(168,57,44,.97),rgba(140,42,32,.95));
  color:#ffe9e4; font-family:-apple-system,"PingFang SC",sans-serif;
  box-shadow:0 2px 14px rgba(0,0,0,.5);
}
.sb-dot{width:7px;height:7px;border-radius:50%;background:#ffd9d0;
  animation:sbPulse 1.4s ease-in-out infinite}
@keyframes sbPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}

/* ---------- 日记：顶部的日期导航 ---------- */
.dn-head{display:flex; align-items:center; gap:10px; padding:2px 2px 12px}
.dn-title{font-size:19px; font-weight:600; letter-spacing:.14em; color:#e2e6ee}
.dn-head .sp{flex:1}
.dn-toggle{font:inherit; font-size:12.5px; padding:7px 14px; border-radius:18px; cursor:pointer;
  background:rgba(240,230,210,.10); border:1px solid rgba(240,230,210,.24); color:#c3cbd8}
.dn-toggle:hover{background:rgba(240,230,210,.16)}
.dn-nav{margin-bottom:16px; border-radius:12px; overflow:hidden;
  background:rgba(240,230,210,.05); border:1px solid rgba(240,230,210,.08)}
.dn-m + .dn-m{border-top:1px solid rgba(240,230,210,.07)}
.dn-mh,.dn-wh{display:flex; align-items:center; gap:9px; cursor:pointer; transition:background .16s}
.dn-mh{padding:12px 13px; background:rgba(240,230,210,.055)}
.dn-mh:hover{background:rgba(240,230,210,.10)}
.dn-wh{padding:8px 11px}
.dn-wh:hover{background:rgba(240,230,210,.06)}
.dn-mt{font-size:14px; color:#e2e6ee; letter-spacing:.05em; font-weight:600}
.dn-wt{font-size:12.5px; color:#aab3c2}
.dn-c{font-size:11px; color:#6f7887}
.dn-ar{font-size:9px; color:#8b94a3; width:10px; display:inline-block}
.dn-mb,.dn-wb{display:none}
.dn-m.open > .dn-mb{display:block}
.dn-w.open > .dn-wb{display:block}
.dn-w{margin:3px 7px; border-radius:8px; overflow:hidden; background:rgba(0,0,0,.16)}
.dn-d{display:flex; align-items:center; gap:8px; width:100%; text-align:left;
  font:inherit; font-size:12.5px; padding:8px 12px; cursor:pointer;
  background:none; border:none; color:#aab3c2; transition:background .14s}
.dn-d:hover{background:rgba(240,230,210,.07)}
.dn-d.on{background:rgba(201,169,94,.16); color:#e8dcb4}
.dn-moon{font-size:13px}
.dn-dd{font-variant-numeric:tabular-nums; min-width:44px}
.dn-wd{color:#6f7887; font-size:11.5px}

/* ---------- 日记正文（第一人称） ---------- */
.dtxt{margin:16px 0 18px}
.dtp{margin:0 0 13px; font-size:15px; line-height:2.0; color:#e6eaf2;
  text-indent:1.6em; font-family:"Kaiti SC","STKaiti","KaiTi","Songti SC",serif}
.dtp-empty{color:#6f7887; font-style:italic}
.draw-wrap{margin-top:16px; border-top:1px solid rgba(240,230,210,.10); padding-top:12px}
.draw-btn{font:inherit; font-size:12.5px; padding:8px 14px; border-radius:8px; cursor:pointer;
  background:rgba(240,230,210,.07); border:1px solid rgba(240,230,210,.16); color:#9aa4b2}
.draw-btn:hover{background:rgba(240,230,210,.12)}
.draw-body{display:none; margin-top:12px}
.draw-body.open{display:block}

/* ---------- 日记里的随笔 ---------- */
.dnote{margin:0 0 14px; padding:14px 16px 15px; border-radius:12px;
  background:linear-gradient(180deg,rgba(240,230,210,.10),rgba(240,230,210,.05));
  border:1px solid rgba(240,230,210,.13); position:relative}
.dn-h{display:flex; align-items:center; gap:6px; font-size:12px; color:#9aa4b2;
  letter-spacing:.16em; margin-bottom:9px}
.dn-h .sp{flex:1}
.dn-q{font-size:20px; color:rgba(240,230,210,.28); line-height:1; margin-top:5px}
.dn-by{font-size:10.5px; color:#6f7887; letter-spacing:.06em}
.dn-t{font-size:14.5px; line-height:1.95; color:#e6eaf2; text-indent:1.6em;
  font-family:"Kaiti SC","STKaiti","KaiTi","Songti SC",serif}
.arc-head{padding:2px 2px 14px}
.arc-title{font-size:19px; font-weight:600; letter-spacing:.12em; color:#e2e6ee}
.arc-sub{font-size:12px; color:#7b8494; margin-top:5px}
.arc-list{display:flex; flex-direction:column; gap:1px;
  background:rgba(240,230,210,.07); border-radius:12px; overflow:hidden; margin-bottom:16px}
.arc-row{display:grid; grid-template-columns:88px 62px 1fr; grid-template-rows:auto auto;
  gap:2px 12px; padding:13px 14px; background:#1b1f27; cursor:pointer;
  transition:background .16s ease-out}
.arc-row:hover{background:#212734}
.arc-row:active{background:#262d3b}
.arc-d{grid-row:1 / span 2; display:flex; flex-direction:column; justify-content:center; gap:3px}
.arc-date{font-size:15px; color:#dbe0e8; letter-spacing:.02em; font-variant-numeric:tabular-nums}
.arc-date i{font-style:normal; color:#9aa4b2; font-size:14px; margin-left:3px}
.arc-wd{font-size:11px; color:#6f7887}
.arc-m{display:flex; align-items:center; gap:5px; font-size:11.5px; color:#8b94a3}
.arc-moon{font-size:14px}
.arc-mooncn{color:#7b8494}
.arc-lock,.arc-game{font-size:11px; opacity:.75}
.arc-t{font-size:13.5px; line-height:1.62; color:#c3cbd8;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.arc-empty{color:#5f6875; font-style:italic}
.arc-x{font-size:11px; color:#6f7887; letter-spacing:.02em}
.arc-more{text-align:center; padding:4px 0 20px; display:flex; flex-direction:column;
  align-items:center; gap:9px}
.arc-more button{background:#232833; border:1px solid #2f3641; color:#c3cbd8;
  padding:10px 22px; border-radius:9px; font-size:13.5px; cursor:pointer}
.arc-more button:hover{background:#2b313d}
.arc-left{font-size:11.5px; color:#6f7887}

/* ---------- 日历 ---------- */
.cal-head{
  display:flex; align-items:center; gap:12px; margin-bottom:14px;
}
.cal-head .ym{font-size:17px; letter-spacing:2px; color:var(--accent); font-weight:600}
.cal-head .sp{flex:1}
.cal-nav{
  border:1px solid var(--line); background:rgba(255,255,255,.05); color:var(--fg);
  font-family:inherit; font-size:16px; line-height:1; border-radius:10px;
  width:36px; height:36px; cursor:pointer; display:flex; align-items:center; justify-content:center;
}
.cal-nav:active{background:rgba(255,255,255,.13)}
.cal-nav:disabled{opacity:.28}
.cal-week{
  display:grid; grid-template-columns:repeat(7,1fr); gap:5px;
  font-size:11.5px; color:var(--dim2); text-align:center; margin-bottom:7px;
  letter-spacing:1px;
}
.cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:5px}
.cal-cell{
  position:relative; aspect-ratio:1/1; border-radius:11px;
  border:1px solid transparent; background:rgba(255,255,255,.028);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  font-size:14.5px; color:var(--dim2); cursor:default;
  transition:transform .14s, background .16s, border-color .16s;
}
.cal-cell.empty{background:transparent; border-color:transparent}
.cal-cell.has{
  background:rgba(201,185,143,.13); border-color:rgba(201,185,143,.3);
  color:#f0e6c8; cursor:pointer;
}
.cal-cell.has:active{transform:scale(.93); background:rgba(201,185,143,.24)}
.cal-cell.today{border-color:rgba(125,211,252,.7); box-shadow:0 0 0 1px rgba(125,211,252,.35) inset}
.cal-cell.sel{background:rgba(201,185,143,.3); border-color:var(--accent); color:#fff8e6}
.cal-cell .cnt{
  position:absolute; bottom:5px; font-size:9.5px; line-height:1;
  color:var(--accent); letter-spacing:.5px;
}
.cal-cell .dots{position:absolute; bottom:13px; display:flex; gap:2px}
.cal-cell .dots i{width:3px;height:3px;border-radius:50%;background:var(--accent);opacity:.75}
.cal-day{
  margin-top:16px; border-top:1px solid var(--line); padding-top:14px;
}
.cal-day .dh{
  display:flex; align-items:baseline; gap:10px; margin-bottom:8px;
}
.cal-day .dh .d{font-size:16px; color:var(--accent); letter-spacing:1px; font-weight:600}
.cal-day .dh .w{font-size:12.5px; color:var(--dim2)}
.cal-day .dh .n{margin-left:auto; font-size:12px; color:var(--dim2)}

/* ---------- 她的东西 ---------- */
.things-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:12px}
.thing{
  border:1px solid var(--line); border-radius:14px; padding:14px 12px;
  background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.015));
  text-align:center; transition:transform .16s;
}
.thing:active{transform:scale(.97)}
.thing .art{
  font-family:ui-monospace,Menlo,Consolas,monospace; font-size:11px; line-height:1.15;
  white-space:pre; color:var(--accent); margin-bottom:10px; min-height:52px;
  display:flex; align-items:center; justify-content:center;
}
.thing .nm{font-size:14px; color:#f2ecdc; letter-spacing:1px; margin-bottom:5px}
.thing .ds{font-size:11.5px; color:var(--dim); line-height:1.6}
.places{display:flex; flex-direction:column; gap:8px}
.place{
  display:flex; align-items:center; gap:12px; padding:11px 13px;
  border:1px solid var(--line); border-radius:12px; background:rgba(255,255,255,.025);
}
.place .ic{
  font-family:ui-monospace,monospace; font-size:15px; color:var(--accent);
  width:30px; text-align:center; flex:0 0 auto;
}
.place .tx{flex:1; min-width:0}
.place .tx b{font-size:14px; color:#f2ecdc; font-weight:500}
.place .tx div{font-size:11.5px; color:var(--dim2); margin-top:2px}
.place .tagn{font-size:11px; color:var(--dim2); white-space:nowrap}

/* 列表式入口（规则/关于） */
.doc{font-size:14.5px;line-height:1.95;color:#cdd7e8}
.doc h4{margin:20px 0 8px;font-size:14px;letter-spacing:1.5px;color:var(--accent)}
.doc h4:first-child{margin-top:0}
.doc p{margin:8px 0}
.doc ul{margin:8px 0;padding-left:20px}
.doc li{margin:5px 0}
.doc b{color:#f2ecdc}
.doc code{background:rgba(255,255,255,.07);padding:1px 6px;border-radius:5px;font-size:13px}

.empty{color:var(--dim2);font-size:13.5px;padding:14px 0}
.center{text-align:center;padding:30px 0;color:var(--dim2);font-size:13.5px}

/* 桌面淡入 */
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.app{animation:fadeUp .42s backwards}
.app:nth-child(1){animation-delay:.02s}
.app:nth-child(2){animation-delay:.06s}
.app:nth-child(3){animation-delay:.1s}
.app:nth-child(4){animation-delay:.14s}
.app:nth-child(5){animation-delay:.18s}
.app:nth-child(6){animation-delay:.22s}
/* ============================================================
   日记 · 最终覆盖
   上面那批旧规则（浅色字 #e6eaf2）是在暗色主题时期写的，
   排在后面会把新写的深色字盖掉 —— 结果就是米色纸上写白字，看不见。
   这里用同样权重但更靠后的规则强制压回去。
   ============================================================ */
.dpaper{ color:#2b2117 }
.dpaper .dtp{
  margin:0 0 17px; padding-left:1.2em; text-indent:-.6em;
  font-size:16px; line-height:2.15; letter-spacing:.02em;
  color:#2b2117;
  font-family:"Kaiti SC","STKaiti","KaiTi","Songti SC",serif;
}
.dpaper .dtp:last-child{ margin-bottom:4px }
.dpaper .dtp-empty{ color:#9a8a72; font-style:italic }
.dpaper .dtxt{ margin:0 0 8px }
.dpaper .dnote{
  margin:22px 0 0; padding:15px 16px 16px; border-radius:10px;
  background:rgba(120,95,60,.075); border-left:3px solid rgba(120,95,60,.35);
}
.dpaper .dn-t{
  font-size:15px; line-height:1.95; color:#33261a; text-indent:1.6em;
  font-family:"Kaiti SC","STKaiti","KaiTi",serif;
}
.dpaper .dn-h{ color:#8a7455 }
.dpaper .dn-by{ color:#a08e72 }
.dpaper .dmeta{ color:#7a6a52 }
.dpaper .dtitle{ color:#3a2c1c }
.dpaper .dt-u{ color:#8a7455 }
.dpaper .dt-n{ color:#3a2c1c }
.dpaper .tl-x{ color:#3a2c1c }
.dpaper .tl-t{ color:#8a7455 }
.dpaper .tl-place{ color:#6b5940 }
.dpaper .draw-btn{ color:#5a4a33 }
.dpaper .trail-line{ color:#6b5940 }
.dpaper .trail-line b{ color:#4a3a24 }
/* 情绪映射的排版差异（覆盖里也要带上，否则被旧规则抹平） */
.dpaper[data-mood="irrit"] .dtp{ line-height:1.95; letter-spacing:.01em }
.dpaper[data-mood="irrit"] .dtp:nth-child(odd){ margin-left:14px }
.dpaper[data-mood="irrit"] .dtp:nth-child(3n){ margin-left:-6px; text-indent:.6em }
.dpaper[data-mood="collapse"] .dtp{ line-height:1.85; font-size:15.5px }
.dpaper[data-mood="collapse"] .dtp:nth-child(2n){ margin-left:22px; transform:rotate(-.35deg) }
.dpaper[data-mood="collapse"] .dtp:nth-child(3n){ margin-left:-10px; transform:rotate(.4deg) }
.dpaper.ink-open .dtp{ transform:skewX(-1.1deg) }
.dpaper.ink-open .dtp:nth-child(2n){ transform:skewX(.9deg) }
/* ============================================================
   归档轨迹：一条竖线串起她那天待过的地方
   ============================================================ */
.dpaper .trail-line{
  margin-bottom:16px; padding:11px 13px; border-radius:9px; line-height:1.9;
  background:rgba(120,95,60,.085); border-left:3px solid rgba(120,95,60,.32);
  font-size:13px; color:#5a4a33;
  font-family:-apple-system,"PingFang SC",sans-serif;
}
.dpaper .trail-line b{ color:#3f3018; font-weight:600 }
.dpaper .trail-line i{ font-style:normal; color:#a08e72; margin:0 7px }

.dpaper .tl{ padding-left:0 }
.dpaper .tl-node{ display:flex; gap:13px; align-items:stretch }
.dpaper .tl-rail{ position:relative; width:16px; flex:0 0 16px; display:flex; flex-direction:column; align-items:center }
.dpaper .tl-pin{
  width:11px; height:11px; border-radius:50%; margin-top:5px; flex:0 0 auto;
  background:#efe3cb; border:2px solid rgba(120,95,60,.6); box-sizing:border-box;
}
.dpaper .tl-stem{ flex:1 1 auto; width:2px; background:rgba(120,95,60,.28); margin-top:3px }
.dpaper .tl-node.night .tl-pin{ background:#5a4a33; border-color:#3a2c1c }
.dpaper .tl-node.priv  .tl-pin{ background:#8f2d22; border-color:#6d2018 }

.dpaper .tl-body{ flex:1; min-width:0; padding:0 0 17px }
.dpaper .tl-head{ display:flex; align-items:baseline; gap:9px; margin-bottom:4px; flex-wrap:wrap }
.dpaper .tl-when{
  font-family:ui-monospace,Menlo,monospace; font-size:11.5px; color:#8a7455;
  font-variant-numeric:tabular-nums; letter-spacing:.02em;
}
.dpaper .tl-where{
  font-size:10.5px; padding:1.5px 8px; border-radius:5px; color:#5f4c30;
  background:rgba(120,95,60,.16); letter-spacing:.06em;
  font-family:-apple-system,"PingFang SC",sans-serif;
}
.dpaper .tl-count{ font-size:10.5px; color:#a8977c; margin-left:auto }
.dpaper .tl-text{
  font-size:14px; line-height:1.82; color:#3a2c1c;
  font-family:"Kaiti SC","STKaiti","KaiTi",serif;
}
.dpaper .tl-masked{ color:#8e7a5e; font-style:italic }

/* ---- 私密日记：数字密码锁 ---- */
.inkpad{
  position:relative; z-index:2; width:230px; text-align:center; color:#e7dcc6;
  font-family:-apple-system,"PingFang SC",sans-serif;
}

/* ============================================================
   自适应
   之前整套样式一条 @media 都没有：所有屏幕共用一套固定尺寸，
   手机上偏挤、电脑上被拉成一条横贯整屏的长文，都很难读。
   这里补上：内容限宽居中 + 三档断点 + 动态视口高度。
   ============================================================ */
:root{
  /* 手机浏览器的地址栏会占掉一块高度：dvh 会跟着变，vh 不会。

     下一行再覆盖成 dvh —— 认得的用新的，不认的也不会塌。 */
  --vh: 100vh;
}
@supports (height:100dvh){
  :root{ --vh: 100dvh }
}
body{ height:var(--vh) }

<script>
/* =====================================================================
   朔 · 观察窗口（手机桌面风格）
   ===================================================================== */
const $ = id => document.getElementById(id);
const IS_DEPLOY = true;
const APP_BUILD = '10-02 04:19·70199f';     // 构建时替换成时间戳；直接开模板时保持占位符 = 不自检
const STORE_KEY = 'saku_pw';
const WORLD_START = {
  date:  new Date(2026, 8, 19, 0, 0, 0),
  anchor:new Date(2026, 8, 8, 0, 0, 0),
  seed:  20260919
};

const APPS = [
  {id:'game',    ico:'⚄', name:'桌游'},
  {id:'space',   ico:'🚀', name:'太空'},
  {id:'diary',   ico:'✎', name:'日记'},
  {id:'drop',    ico:'📥', name:'投递箱'},
  {id:'wall',    ico:'▧', name:'壁纸'},
  {id:'about',   ico:'◌', name:'关于'},
  {id:'dev',     ico:'⚙', name:'开发者', hidden:true},
];

let DATA = null, PLAN = null, PLACES = null, VIEW = null, clockSkew = 0, RAW = null;
let DATA_RAW = null;

/* ============================================================
   音频引擎：主总线 + 混响 + 多层合成，做出"游戏感"而不是哔哔声
   ============================================================ */
let ACTX = null, MASTER = null, REVERB = null, REV_GAIN = null, SFX_ON = true;

function actx(){
  if(!ACTX){
    try{
      ACTX = new (window.AudioContext || window.webkitAudioContext)();
      MASTER = ACTX.createGain(); MASTER.gain.value = 0.72; MASTER.connect(ACTX.destination);
      // 程序生成的混响脉冲（衰减噪声），营造空间感
      const sr = ACTX.sampleRate, len = Math.floor(sr * 1.6);
      const imp = ACTX.createBuffer(2, len, sr);
      for(let c = 0; c < 2; c++){
        const d = imp.getChannelData(c);
        for(let i = 0; i < len; i++){
          const t = i / len;
          d[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, 2.6) * (i < sr * 0.012 ? 0.35 : 1);
        }
      }
      REVERB = ACTX.createConvolver(); REVERB.buffer = imp;
      REV_GAIN = ACTX.createGain(); REV_GAIN.gain.value = 0.34;
      REVERB.connect(REV_GAIN); REV_GAIN.connect(MASTER);
    }catch(e){ ACTX = null; }
  }
  if(ACTX && ACTX.state === 'suspended') ACTX.resume();
  return ACTX;
}
/* 一个音符：可选滑音、滤波、声像、混响量 */
function note(o){
  const c = actx(); if(!c || !SFX_ON) return;
  const t0 = c.currentTime + (o.at || 0);
  const dur = o.dur || 0.2;
  const osc = c.createOscillator();
  osc.type = o.type || 'sine';
  osc.frequency.setValueAtTime(o.f, t0);
  if(o.to){ osc.frequency.exponentialRampToValueAtTime(Math.max(20, o.to), t0 + dur * (o.slide || 1)); }
  if(o.detune) osc.detune.setValueAtTime(o.detune, t0);
  const g = c.createGain();
  const peak = o.vol == null ? 0.16 : o.vol;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(peak, t0 + (o.att || 0.008));
  g.gain.exponentialRampToValueAtTime(peak * 0.42, t0 + dur * 0.35);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  let node = osc;
  if(o.lp){ const f = c.createBiquadFilter(); f.type = 'lowpass';
    f.frequency.setValueAtTime(o.lp, t0);
    if(o.lpTo) f.frequency.exponentialRampToValueAtTime(o.lpTo, t0 + dur);
    f.Q.value = o.q || 1; node.connect(f); node = f; }
  if(o.bp){ const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = o.bp; f.Q.value = o.bq || 3;
    node.connect(f); node = f; }
  const pan = c.createStereoPanner ? c.createStereoPanner() : null;
  if(pan){ pan.pan.value = o.pan || 0; node.connect(g); node = pan; node.connect(g); }
  else node.connect(g);
  g.connect(MASTER);
  if(o.rev){ const rg = c.createGain(); rg.gain.value = o.rev; g.connect(rg); rg.connect(REVERB); }
  osc.start(t0); osc.stop(t0 + dur + 0.05);
}
/* 噪声层：撞击/沙沙/爆炸 */
function noiseHit(o){
  const c = actx(); if(!c || !SFX_ON) return;
  const t0 = c.currentTime + (o.at || 0);
  const dur = o.dur || 0.2;
  const len = Math.floor(c.sampleRate * dur);
  const buf = c.createBuffer(1, len, c.sampleRate);
  const d = buf.getChannelData(0);
  for(let i = 0; i < len; i++){
    const t = i / len;
    d[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, o.decay || 2.2);
  }
  const src = c.createBufferSource(); src.buffer = buf;
  const f = c.createBiquadFilter();
  f.type = o.type || 'highpass';
  f.frequency.setValueAtTime(o.f || 900, t0);
  if(o.fTo) f.frequency.exponentialRampToValueAtTime(Math.max(60, o.fTo), t0 + dur);
  f.Q.value = o.q || 1;
  const g = c.createGain(); g.gain.value = o.vol == null ? 0.14 : o.vol;
  src.connect(f); f.connect(g); g.connect(MASTER);
  if(o.rev){ const rg = c.createGain(); rg.gain.value = o.rev; g.connect(rg); rg.connect(REVERB); }
  src.start(t0);
}
/* 低频冲击：打击感 */
function thump(freq, dur, vol, at){
  note({ f:freq, to:freq*0.42, dur:dur, type:'sine', vol:vol, att:0.004, at:at||0, lp:420 });
}
const SCALE = [0, 2, 4, 7, 9];          // 大调五声
const nf = (semi, base) => (base || 523.25) * Math.pow(2, semi / 12);

const SFX_LAST = {};
const SFX_GAP = { openapp:260, closeapp:260, click:120, place:70, coin:90, advance:90, tick:40 };
function sfx(name){
  if(!SFX_ON) return;
  var now = performance.now();
  var gap = SFX_GAP[name] || 0;
  if(gap && SFX_LAST[name] && now - SFX_LAST[name] < gap) return;   // 连点不叠音
  SFX_LAST[name] = now;
  actx();
  switch(name){
    /* —— 骰子：木质碰撞 + 滚动沙沙 —— */
    case 'roll':
      for(let i = 0; i < 5; i++)
        noiseHit({ type:'bandpass', f: 1100 + i*380, dur:0.045, vol:0.09, at:i*0.055, bq:4 });
      note({ f:170, to:90, dur:0.16, type:'triangle', vol:0.10, lp:900 });
      break;
    case 'tick':
      noiseHit({ type:'bandpass', f: 2600 + Math.random()*1600, dur:0.022, vol:0.055, bq:6 });
      break;
    case 'land':                        // 骰子落定：木质叩击 + 余韵
      noiseHit({ type:'bandpass', f:2200, dur:0.05, vol:0.13, bq:3, rev:0.5 });
      note({ f:330, to:240, dur:0.20, type:'triangle', vol:0.13, lp:1800, rev:0.55 });
      note({ f:660, to:520, dur:0.16, type:'sine', vol:0.07, at:0.02, rev:0.5 });
      break;
    case 'place':                       // 放进房间：轻快双击（音量收敛）
      note({ f:nf(4,440), dur:0.10, type:'sine', vol:0.07, lp:2200, rev:0.25 });
      note({ f:nf(7,440), dur:0.15, type:'sine', vol:0.055, at:0.05, lp:2400, rev:0.35 });
      break;
    case 'discard':
      note({ f:260, to:140, dur:0.22, type:'sawtooth', vol:0.075, lp:1200, lpTo:400, rev:0.2 });
      noiseHit({ type:'lowpass', f:800, dur:0.12, vol:0.06 });
      break;
    /* —— 正向反馈：灵魂/碎片/遗物 —— */
    case 'coin':
      [0, 4, 7, 12].forEach((semi, i) => {
        note({ f:nf(semi, 880), dur:0.30, type:'triangle', vol:0.10, at:i*0.045, rev:0.6 });
      });
      noiseHit({ type:'highpass', f:5200, dur:0.08, vol:0.05, rev:0.4 });
      break;
    case 'relic':
      [0, 4, 7, 11, 14].forEach((semi, i) => {
        note({ f:nf(semi, 659.25), dur:0.7, type:'sine', vol:0.10, at:i*0.07, rev:0.85 });
        note({ f:nf(semi, 659.25)*2, dur:0.4, type:'triangle', vol:0.035, at:i*0.07, rev:0.7 });
      });
      break;
    case 'heal':
      note({ f:523.25, to:783.99, dur:0.42, type:'sine', vol:0.11, rev:0.7 });
      note({ f:783.99, dur:0.5, type:'sine', vol:0.07, at:0.14, rev:0.8 });
      break;
    /* —— 战斗 —— */
    case 'good':                        // 击破小怪：冲击 + 上扬和弦
      noiseHit({ type:'bandpass', f:1800, fTo:300, dur:0.30, vol:0.17, q:1.4, rev:0.55 });
      thump(120, 0.32, 0.20);
      [0, 4, 7, 12].forEach((semi, i) =>
        note({ f:nf(semi, 523.25), dur:0.5, type:'triangle', vol:0.10, at:i*0.055, rev:0.7 }));
      break;
    case 'hurt':                        // 受伤：闷击 + 下坠
      thump(95, 0.30, 0.24);
      noiseHit({ type:'lowpass', f:900, dur:0.20, vol:0.14 });
      note({ f:220, to:110, dur:0.36, type:'sawtooth', vol:0.10, lp:900, lpTo:260, rev:0.3 });
      break;
    case 'bad':
      [0, -2, -5].forEach((semi, i) =>
        note({ f:nf(semi, 392), dur:0.30, type:'triangle', vol:0.09, at:i*0.10, rev:0.45 }));
      break;
    case 'monster':                     // 小怪登场：低频咆哮 + 不和谐
      thump(58, 0.85, 0.26);
      thump(62, 0.75, 0.20, 0.06);
      note({ f:98, to:82, dur:1.0, type:'sawtooth', vol:0.11, lp:520, rev:0.6 });
      note({ f:139, to:131, dur:0.9, type:'square', vol:0.06, at:0.05, lp:600, rev:0.55 });
      noiseHit({ type:'lowpass', f:420, dur:0.7, vol:0.13, decay:1.6, rev:0.6 });
      break;
    case 'boss':                        // Boss：轰鸣 + 四度堆叠
      thump(44, 1.6, 0.30);
      thump(46.5, 1.4, 0.22, 0.10);
      [0, 3, 6, 10].forEach((semi, i) =>
        note({ f:nf(semi, 130.81), dur:1.5, type:'sawtooth', vol:0.085, at:i*0.13, lp:700, rev:0.9 }));
      noiseHit({ type:'lowpass', f:600, fTo:120, dur:1.3, vol:0.14, decay:1.2, rev:0.8 });
      break;
    /* —— 推进 / 界面 —— */
    case 'advance':
      note({ f:nf(0,523.25), to:nf(0,659.25), dur:0.20, type:'triangle', vol:0.10, rev:0.4 });
      noiseHit({ type:'highpass', f:3000, dur:0.05, vol:0.04, rev:0.3 });
      break;
    case 'click':
      noiseHit({ type:'lowpass', f:1400, dur:0.018, vol:0.028 });
      note({ f:420 + Math.random() * 60, dur:0.05, type:'sine', vol:0.022, att:0.004, lp:1400 });
      break;
    /* 打开/关闭 App：低频柔和的一声，每次音高略不同，不刺耳 */
    case 'openapp': {
      const v = 1 + (Math.random() - 0.5) * 0.06;
      note({ f:294 * v, to:392 * v, dur:0.26, type:'sine', vol:0.055, att:0.016, lp:1200, rev:0.35 });
      note({ f:588 * v, dur:0.18, type:'sine', vol:0.022, at:0.02, lp:1600, rev:0.3 });
      noiseHit({ type:'lowpass', f:700, dur:0.05, vol:0.022 });
      break;
    }
    case 'closeapp': {
      const v = 1 + (Math.random() - 0.5) * 0.06;
      note({ f:330 * v, to:247 * v, dur:0.24, type:'sine', vol:0.05, att:0.016, lp:1100, rev:0.3 });
      noiseHit({ type:'lowpass', f:600, dur:0.045, vol:0.018 });
      break;
    }
    /* —— 结局 —— */
    case 'win':
      [0, 4, 7, 12, 16, 19].forEach((semi, i) => {
        note({ f:nf(semi, 523.25), dur:0.9, type:'triangle', vol:0.11, at:i*0.11, rev:0.95 });
        note({ f:nf(semi, 523.25)/2, dur:0.9, type:'sine', vol:0.06, at:i*0.11, rev:0.9 });
      });
      thump(65, 1.0, 0.16, 0.02);
      break;
    case 'true':                        // 真结局：更长的上行 + 空灵
      [0, 4, 7, 11, 12, 16, 19, 24].forEach((semi, i) => {
        note({ f:nf(semi, 523.25), dur:1.3, type:'sine', vol:0.10, at:i*0.15, rev:1.0 });
        note({ f:nf(semi, 523.25)*2, dur:0.8, type:'triangle', vol:0.03, at:i*0.15+0.03, rev:0.9 });
      });
      break;
    case 'lose':
      [0, -3, -7, -12].forEach((semi, i) =>
        note({ f:nf(semi, 392), dur:1.1, type:'sine', vol:0.11, at:i*0.20, rev:0.9 }));
      thump(52, 1.4, 0.18, 0.05);
      break;
  }
}

/* ---------- 工具 ---------- */
function pad(n){ return n < 10 ? '0' + n : '' + n; }
function b64buf(b64){
  var bin = atob(b64), len = bin.length, arr = new Uint8Array(len);
  for (var i = 0; i < len; i++) arr[i] = bin.charCodeAt(i);
  return arr;
}
async function decryptRaw(password, enc){
  var material = await crypto.subtle.importKey(
    'raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
  var key = await crypto.subtle.deriveKey(
    { name:'PBKDF2', salt: b64buf(enc.salt), iterations: 250000, hash:'SHA-256' },
    material, { name:'AES-GCM', length:256 }, false, ['decrypt']);
  var ct = b64buf(enc.ct), tag = b64buf(enc.tag);
  var joined = new Uint8Array(ct.length + tag.length);
  joined.set(ct, 0); joined.set(tag, ct.length);
  var plain = await crypto.subtle.decrypt({ name:'AES-GCM', iv: b64buf(enc.iv) }, key, joined);
  return new TextDecoder().decode(plain);
}
async function decryptJSON(password, enc){
  return JSON.parse(await decryptRaw(password, enc));
}

/* ---------- 安全读写 ---------- */
function extraLoad(){
  try{
    var raw = localStorage.getItem(EXTRA_KEY);
    if(!raw) return [];
    var arr = JSON.parse(raw);
    if(!Array.isArray(arr)) return [];
    // 逐条校验，坏数据直接丢掉，绝不让它把页面搞崩
    return arr.filter(function(r){
      return r && typeof r === 'object'
        && typeof r.date === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(r.date)
        && (OUTCOME_TEXT[r.outcome] || r.outcome === 'rebuild');
    });
  }catch(e){
    try{ localStorage.removeItem(EXTRA_KEY); }catch(e2){}
    return [];
  }
}
function extraSave(arr){
  if(SANDBOX) return;
  try{
    // 按日期裁剪 + 每天限量
    var byDay = {};
    arr.forEach(function(r){ (byDay[r.date] = byDay[r.date] || []).push(r); });
    var days = Object.keys(byDay).sort().slice(-EXTRA_KEEP_DAYS);
    var out = [];
    days.forEach(function(d){
      var list = byDay[d].sort(function(a,b){ return (a.at||0) - (b.at||0); });
      out = out.concat(list.slice(-EXTRA_PER_DAY));
    });
    localStorage.setItem(EXTRA_KEY, JSON.stringify(out));
  }catch(e){}
}
/* 沙盒（平行宇宙推演）里产生的一切都不许落盘 —— 那是推演，
   不该污染真实世界的历史。 */
let SANDBOX = false;
function setSandbox(on){
  SANDBOX = !!on;
  try{
    var bar = document.getElementById('sandboxBar');
    if(bar) bar.style.display = SANDBOX ? 'flex' : 'none';
    document.body.style.paddingTop = SANDBOX ? '38px' : '';
  }catch(e){}
}
function extraMerge(records){
  if(SANDBOX) return 0;
  if(!records || !records.length) return 0;
  var arr = extraLoad();
  var have = {};
  arr.forEach(function(r){ have[(r.date||'') + '|' + (r.at||0)] = 1; });
  var add = 0;
  records.forEach(function(r){
    if(!r || typeof r !== 'object') return;
    if(!r.date || !OUTCOME_TEXT[r.outcome]) return;
    var k = r.date + '|' + (r.at || 0);
    if(have[k]) return;            // 去重，补发时不会重复写
    have[k] = 1; arr.push(r); add++;
  });
  if(add) extraSave(arr);
  return add;
}
