/* ---------- 接收桌游的消息 ---------- */
function bindBridge(){
  window.addEventListener('message', function(ev){
    var d = ev.data;
    if(!d || typeof d !== 'object') return;
    /* 桌游顶部那个「← 返回」按钮：它自己关不掉 iframe，发消息让主页面关视图 */
    if(d.type === 'maze_close'){
      var gf = document.getElementById('gameFrame');
      if(gf && ev.source && ev.source !== gf.contentWindow) return;
      closeView();
      return;
    }
    if(d.type !== 'maze_result') return;
    // 只认自己那个 iframe 发来的
    var frame = document.getElementById('gameFrame');
    if(frame && ev.source && ev.source !== frame.contentWindow) return;
    /* 桌游 v3 会同时发两条 maze_result：
       · 数组形式 —— 每局的完整记录（日历/日记就靠它，带 title）
       · 对象形式 —— §7.2 规定的汇总 {outcome,turns,abyssDepth,usedRebuild,keys,title}
       两者内容重叠，只处理数组那条，否则同一次游戏会落两条记录。 */
    var payload = Array.isArray(d.payload) ? d.payload.slice() : [];
    // 用了构筑权的局，额外补一条「异世界回响」
    payload.forEach(function(r){
      if(r && r.usedRebuild){
        payload.push({
          v: 1,
          at: (r.at || Date.now()) + 60000,      // 排在正记录后面
          date: r.date, time: r.time,
          outcome: 'rebuild',
          turns: r.turns, abyss: r.abyss, turnLimit: r.turnLimit,
        });
      }
    });
    /* 把"收到这条记录时的情绪"盖上去。
       桌游若自己带了 mood 就尊重它；没带就用此刻的情绪——
       记录刚发生，此刻的情绪基本就是当时那个。 */
    var _nowMood = (currentMood() || {}).level || 'calm';
    payload.forEach(function(r){ if(r && !r.mood) r.mood = _nowMood; });
    var added = extraMerge(payload);
    if(added > 0){
      sfx('coin');
      if(VIEW === 'diary') renderDiary();
    }
  });
}

/* ---------- 朔在哪 ---------- */
function placeAt(date){
  if(!PLAN || !PLACES) return null;
  var plan = (date.getDay() === 0 || date.getDay() === 6) ? PLAN.weekend : PLAN.weekday;
  if(!plan || !plan.length) return null;
  var m = date.getHours() * 60 + date.getMinutes();
  var hit = plan[plan.length - 1];
  for(var i = 0; i < plan.length; i++){
    var a = plan[i][0].split(':'), b = plan[i][1].split(':');
    if((+a[0])*60 + (+a[1]) <= m && m < (+b[0])*60 + (+b[1])){ hit = plan[i]; break; }
  }
  var p = PLACES[hit[2]] || ['bedroom', true, '卧室'];
  return { place:hit[2], scene:hit[3], act:hit[4], room:p[0], indoor:!!p[1], cn:p[2] };
}
const ACT_CN = {
  idle:'没什么表情地站着', sleep:'睡着了', walk:'在走', study:'低头写着什么',
  eat:'在吃东西', read:'在看书', bath:'在洗漱', shop:'在挑东西', wait:'在等车',
  play:'在操场边上', cook:'在煮东西', phone:'在看手机',
};

/* ---------- 时钟 ---------- */
function tickClock(){
  var d = new Date(Date.now() + clockSkew);
  $('clkBig').textContent = pad(d.getHours()) + ':' + pad(d.getMinutes());
  var wk = ['日','一','二','三','四','五','六'][d.getDay()];
  $('clkDate').textContent = (d.getMonth()+1) + '月' + d.getDate() + '日 周' + wk;
  var P = placeAt(d);
  $('clkWhere').textContent = P ? (P.cn + ' · ' + (ACT_CN[P.act] || '')) : '—';
  /* 这里以前有一句 if(VIEW==='diary') renderDiary()，而 tickClock 是每秒跑的 ——
     等于日记每秒钟被整个重建一次：刚展开的原始记录、墨迹解锁、滚动位置全被抹掉。
     日记只在切换日期或数据更新时才需要重绘，秒针不管它。 */
}
setInterval(tickClock, 1000);

/* ---------- 视图切换 ---------- */
function showView(id, originEl){
  VIEW = id;
  var host = $('viewHost'), body = $('viewBody');
  $('viewTitle').textContent = (APPS.find(a => a.id === id) || {}).name || id;

  if(originEl){
    var r = originEl.getBoundingClientRect();
    host.style.transformOrigin = (r.left + r.width/2) + 'px ' + (r.top + r.height/2) + 'px';
  } else {
    host.style.transformOrigin = '50% 50%';
  }

  body.classList.remove('short');
  if(id === 'diary') renderDiary();
  else if(id === 'drop') renderDrop();
  else if(id === 'wall') renderWall();
  else if(id === 'dev') devRender();
  else if(id === 'about') renderAbout();
  else if(id === 'game'){
    body.innerHTML = '<div class="game-shell"><iframe class="game-frame" id="gameFrame" title="一页迷宫"></iframe></div>';
    body.classList.add('short');
    openGame();
  }
  else if(id === 'space'){
    /* 太空游戏是一个自包含单文件，直接装进 iframe。
       两边都必须**同源**，否则壳注不进按键、也读不到游戏状态（信息条全空）。
       本地版读 /game/space.html；线上版随包带一份 space.html（build_home.py 会拷）。
       带 ?log=1：宿主是手机，底部日志条压到 1 行（正好落进底部留白里），省下的行全给地图。 */
    /* 底部日志条行数按屏幕高度给：底座占掉约 1/3，剩下的行数要留给地图。
       这一条也是「日志向下延伸、不留大片空白」的抓手：行数给够，日志就占满地图下面那段。 */
    var lr = (window.innerHeight >= 860) ? 4 : (window.innerHeight >= 700 ? 3 : 2);
    var ssrc = (IS_DEPLOY ? 'space.html' : '/game/space.html') + '?log=' + lr;
    /* 手机默认只算出 9px 字号，太瞎眼 —— 第一次打开就给个适合手机的起手值。
       用户自己调过之后（localStorage 里已有）就不再覆盖。 */
    if(!IS_DEPLOY){
      try{
        if(localStorage.getItem('space_zoom') === null){
          localStorage.setItem('space_zoom', String(SPACE_ZOOM_DEFAULT));
        }
        /* 小窗口里状态栏默认收起；存成 0 而不是留空，方便用户自己看/改 */
        if(localStorage.getItem('space_info') === null){
          localStorage.setItem('space_info', '0');
        }
      }catch(e){}
    }
    SPACE_KEY_OK = null;
    SPACE_ZOOM = null;
    SPACE_MENU = false;
    SPACE_INFO = spaceInfoGet();       // 默认 false = 状态栏收起，地图最大化
    SPACE_HIDE = sgKeysGet();
    SG_HINT = '';
    /* 手机壳：?log=1 让游戏把底部日志条压到 1 行（那一行正好落在底部留白里），
       腾出来的行数全给地图。游戏不认这个参数也没有副作用。 */
    body.innerHTML = '<div class="game-shell space">'
      + '<iframe class="game-frame" id="spaceFrame" title="太空" src="' + ssrc + '"></iframe>'
      + '<div class="cmdbar sg" id="spaceCmd"></div></div>';
    body.classList.add('short');
    renderSpaceCmd();
    /* 游戏本身是「信息栏默认展开」的，装载完替用户按一次 F4。
       只在真实状态和偏好不一致时才按，所以反复打开不会来回抖。 */
    var sfr = $('spaceFrame');
    if(sfr) sfr.addEventListener('load', function(){
      setTimeout(function(){
        var real = spaceInfoReal();
        if(real !== null && real !== SPACE_INFO) spaceKey('F4');
        renderSpaceCmd();
      }, 80);
    });
  }

  $('home').classList.add('push');
  requestAnimationFrame(() => host.classList.add('on'));
}
/* ============================================================
   太空游戏的操作层 —— 把「手」和「眼睛」放在 iframe 上面
   iframe 是同源的（本地版同域；线上版 srcdoc 会继承主页面 origin），
   所以既能在它的 window 上派发 KeyboardEvent，也能直接读游戏状态
   （window.__space.game）来画顶部信息条和事件浮层 —— 不复制一份状态，
   永远以游戏为准。
   ============================================================ */
/* 低频键全收进右上角菜单，底部只留「确认 / 交互」两个大键 */
const SG_MENU_GROUPS = [
  { t:'视图', items:[
      {k:'g', t:'星图 G'}, {k:'l', t:'日志 L'}, {k:'m', t:'任务 M'},
      {k:'Tab', t:'环顾 Tab'}, {k:'x', t:'查看 X'} ] },
  { t:'时间', items:[
      {k:'1', t:'暂停'}, {k:'2', t:'1x'}, {k:'3', t:'2x'}, {k:'4', t:'4x'}, {k:'5', t:'8x'} ] },
  { t:'画面', items:[
      {zoom:-1, t:'字号 −'}, {zoom:1, t:'字号 ＋'}, {k:'c', t:'彩色'},
      {info:1, t:'信息栏'}, {keys:1, t:'收起按键'} ] },
  { t:'系统', items:[
      {k:'?', t:'帮助 ?'}, {k:'Escape', t:'返回 Esc'}, {k:'r', t:'重开 R'},
      {k:'F3', t:'诊断 F3'}, {k:'F2', t:'mod F2'} ] },
];
/* 手机操作层的尺寸：**唯一真源**（SG_SIZE 表 → sgLayout 算成 px 写进 CSS 变量）。
   为什么不写在 CSS 里算：手机浏览器对 clamp()/env() 的支持参差，CSS 里算尺寸只要有一条
   不认，width 就退回 auto —— 圆形大键当场塌成小方块、摇杆的热区散架。
   数字格式：[下限 px, 屏宽比例, 上限 px]
     hit  摇杆热区（透明，拇指拖动范围）——大：拖到边缘也不丢
     ring 摇杆画出来的圆 ——小：满屏 ASCII 地图，少盖一块是一块
     ok   确认键（右下落点）· act 交互键 */
const SG_SIZE = {
  deck:[168, 0.30, 264],   /* 底部控制底座高度（按屏高分比算） */
  hit :[120, 0.36, 152],   /* 摇杆热区（透明，拇指拖动范围） */
  ring:[ 96, 0.29, 124],   /* 摇杆画出来的圆 */
  padW:[ 92, 0.28, 112],   /* 右侧按钮列宽（两个键同宽、右边缘对齐） */
  ok  :[ 54, 0.16,  64],   /* 确认键高（主键，最右下角） */
  act :[ 48, 0.145, 58],   /* 交互键高（副键，确认正上方） */
  gap :[  8, 0.022, 12],   /* 两键之间的缝 */
};
let SPACE_KEY_OK = null, SPACE_ZOOM = null;
let SPACE_INFO = false;        // 游戏左下角状态栏是否展开；手机默认收起，见 spaceInfoSet
let SPACE_MENU = false;        // 右上角菜单抽屉是否打开
let SPACE_HIDE = false;        // 沉浸模式：收起摇杆和动作键
let SG_TIMER = null, SG_HINT = '';
const SG_DEAD = 0.26;          // 摇杆死区（半径比例）：中心这一圈不触发方向，防误触
const SG_RPT_FIRST = 240, SG_RPT_NEXT = 135;   // 按住不放的连走节奏（毫秒）


/* 字号：游戏把 zoomBias 存在 localStorage.space_zoom，每 +1 就是字号 +1px。
   手机上默认算出来只有 9px，太小 —— 这里给一个适合手机的起手值。 */
const SPACE_ZOOM_DEFAULT = 6;      // 360px 屏 → 15px 字号，画面仍有 40x44 格
function spaceZoomGet(){
  try{
    var v = localStorage.getItem('space_zoom');
    return v === null ? SPACE_ZOOM_DEFAULT : Number(v);
  }catch(e){ return SPACE_ZOOM_DEFAULT; }
}
function spaceZoomSet(v){
  v = Math.max(-6, Math.min(16, v));
  try{ localStorage.setItem('space_zoom', String(v)); }catch(e){}
  SPACE_ZOOM = v;
  /* 直接按 + / - 让游戏自己重算，比改完 localStorage 再刷新可靠 */
  var cur = spaceZoomGet();
  if(v !== cur){
    var delta = v - cur;
    for(var i = 0; i < Math.abs(delta); i++) spaceKey(delta > 0 ? '+' : '-');
  }
  spaceHudTick();
}

/* 左下角那几行状态（位置/HP/速度/键位提示）在小窗口里太占地。
   游戏自己就有开关：F4 会 toggle #info.hidden 并重算画面（viewport() 读的是
   #stage.clientHeight，信息栏是它的 flex 兄弟，收起来地图就真的多出几行）。
   这里不自己改 iframe 的 DOM，只替用户按 F4 —— 保证和游戏内部状态永远一致。 */
function spaceInfoGet(){
  try{ return localStorage.getItem('space_info') === '1'; }catch(e){ return false; }
}
function spaceInfoReal(){          // 读 iframe 里信息栏的真实状态；跨域/没装载 → null
  var f = document.getElementById('spaceFrame');
  if(!f) return null;
  var d;
  try{ d = f.contentDocument || (f.contentWindow && f.contentWindow.document); }catch(e){ return null; }
  if(!d) return null;
  var el = d.getElementById('info');
  if(!el) return null;
  return !el.classList.contains('hidden');
}
function spaceInfoSet(want){
  want = !!want;
  try{ localStorage.setItem('space_info', want ? '1' : '0'); }catch(e){}
  SPACE_INFO = want;
  var real = spaceInfoReal();
  if(real !== want){                     // null（跨域/状态不明）也按一下，按错了再按回来即可
    var ok = spaceKey('F4');
    if(!ok && SPACE_KEY_OK !== false){ SPACE_KEY_OK = false; sgWarn(); return; }
  }
  spaceHudTick();
}

function spaceKey(k){
  var f = document.getElementById('spaceFrame');
  if(!f) return false;
  var cw;
  try{ cw = f.contentWindow; }catch(e){ return false; }   // 跨域时这里会被拦
  if(!cw) return false;
  try{
    var KE = cw.KeyboardEvent || KeyboardEvent;
    cw.dispatchEvent(new KE('keydown', {key:k, bubbles:true, cancelable:true}));
    try{ f.focus(); }catch(e){}
    return true;
  }catch(e){ return false; }
}
function bindCmdBtn(el, fn){
  el.addEventListener('mousedown', function(ev){ ev.preventDefault(); });
  el.addEventListener('touchstart', function(ev){ ev.preventDefault(); fn(); }, {passive:false});
  el.addEventListener('click', function(ev){ if(ev.detail !== 0) return; fn(); });
}
function pressKey(b){
  var ok = spaceKey(b.getAttribute('data-k'));
  if(SPACE_KEY_OK !== ok){ SPACE_KEY_OK = ok; sgWarn(); }
  if(ok){ sfx('click'); b.classList.add('flash');
          setTimeout(function(){ b.classList.remove('flash'); }, 160); }
  else sfx('deny');
}

/* ---------------- 读游戏状态（同源才读得到；跨域 → null，界面自动降级） ---------------- */
function spaceGame(){
  var f = document.getElementById('spaceFrame');
  if(!f) return null;
  try{
    var w = f.contentWindow;
    return (w && w.__space && w.__space.game) || null;
  }catch(e){ return null; }
}
function sgNum(v, d){ return (typeof v === 'number' && isFinite(v)) ? v : d; }
function sgRowH(){                 // 游戏一行文字的实际像素高（信息条正好盖两行）
  var f = document.getElementById('spaceFrame');
  try{
    var d = f && f.contentWindow && f.contentWindow.__space && f.contentWindow.__space.out &&
            f.contentWindow.__space.out.diag;
    return sgNum(d && d.cellH, 0);
  }catch(e){ return 0; }
}
function sgClock(t){               // '年1 月1 日1 10:54' → { hm:'10:54', day:'1月1日' }
  var m = /(\d{1,2}):(\d{2})\s*$/.exec(t || '');
  var d = /月\s*(\d+)\s*日\s*(\d+)/.exec(t || '');
  return {
    hm: m ? ((m[1].length < 2 ? '0' : '') + m[1] + ':' + m[2]) : String(t || '').slice(-5),
    day: d ? (d[1] + '月' + d[2] + '日') : ''
  };
}
function spaceHostState(){
  var g = spaceGame();
  if(!g) return null;
  try{
    var p = g.world.player, stats = p.stats || {};
    var hint = g.world.hint;
    return {
      scene: String(g.sceneName(p.scene)),
      x: p.x, y: p.y,
      hp: Math.round(sgNum(stats.hp, 0)), maxHp: Math.max(1, Math.round(sgNum(stats.maxHp, 10))),
      clock: String(g.clockText ? g.clockText() : ''), day: sgNum(g.world.day, 1),
      spd: String(g.speedLabel ? g.speedLabel() : ''), speed: sgNum(g.speed, 1),
      galaxy: g.screenMode === 'galaxy',
      modal: !!(g.ui && (g.ui.view || g.ui.dialogue || g.ui.reader)),
      dialogue: !!(g.ui && g.ui.dialogue),
      hint: (hint && g.world.tick < sgNum(g.world.hintUntil, 0)) ? String(hint) : '',
      logs: (g.world && g.world.log) || []
    };
  }catch(e){ return null; }
}

function sgWarn(){
  var bar = $('spaceCmd');
  if(!bar) return;
  var w = bar.querySelector('.sg-warn');
  var need = (SPACE_KEY_OK === false);
  if(need && !w){
    w = document.createElement('div');
    w.className = 'sg-warn';
    w.textContent = '操作键暂时注不进游戏（线上版跨域）。画面仍可点着走／看，完整手机版等正式打包。';
    bar.appendChild(w);
  } else if(!need && w) w.parentNode.removeChild(w);
}

/* ---------------- 摇杆：纯方向映射（可单测）+ 按住连走 + 滑动换向 ---------------- */
function stickDir(dx, dy, r){
  if(!(r > 0)) r = 1;
  if(Math.sqrt(dx * dx + dy * dy) < r * SG_DEAD) return null;
  return Math.abs(dx) >= Math.abs(dy) ? (dx > 0 ? 'ArrowRight' : 'ArrowLeft')
                                      : (dy > 0 ? 'ArrowDown' : 'ArrowUp');
}
function bindStick(el){
  var rect = null, cx = 0, cy = 0, r = 1, cur = null, pid = null, t1 = null, t2 = null;
  var knob = el.querySelector('.knob');
  var ring = el.querySelector('.sg-ring');
  var chevs = el.querySelectorAll('.chev');

  function lit(dir){
    Array.prototype.forEach.call(chevs, function(c){
      c.classList.toggle('lit', !!dir && c.getAttribute('data-d') === dir);
    });
  }
  function stopRepeat(){ if(t1){ clearTimeout(t1); t1 = null; } if(t2){ clearInterval(t2); t2 = null; } }
  function fire(dir){
    var ok = spaceKey(dir);
    if(SPACE_KEY_OK !== ok){ SPACE_KEY_OK = ok; sgWarn(); }
    if(ok && navigator.vibrate) { try{ navigator.vibrate(6); }catch(e){} }
  }
  function wait(){                       // 按住不放：先等一下再连走，像真摇杆
    stopRepeat();
    t1 = setTimeout(function(){
      t2 = setInterval(function(){ if(cur) fire(cur); }, SG_RPT_NEXT);
    }, SG_RPT_FIRST);
  }
  function setDir(dir){
    if(dir === cur) return;
    cur = dir;
    lit(dir);
    if(dir){ fire(dir); wait(); } else stopRepeat();
  }
  function move(tx, ty){
    var dx = tx - cx, dy = ty - cy;
    setDir(stickDir(dx, dy, r));
    /* 摇杆头跟着拇指走，但不出圈（视觉上给足反馈，算法上仍按整体半径判方向） */
    var d = Math.sqrt(dx * dx + dy * dy), k = Math.min(1, d / (r || 1));
    var a = Math.atan2(dy, dx), lim = r * 0.30;
    knob.style.setProperty('--kx', (Math.cos(a) * lim * k).toFixed(1) + 'px');
    knob.style.setProperty('--ky', (Math.sin(a) * lim * k).toFixed(1) + 'px');
  }
  function reset(){
    setDir(null); pid = null; rect = null;
    el.classList.remove('on');
    knob.style.setProperty('--kx', '0px');
    knob.style.setProperty('--ky', '0px');
  }
  function begin(tx, ty){
    rect = el.getBoundingClientRect();
    var w = rect.width || el.offsetWidth || 132;
    cx = rect.left + (rect.width || w) / 2;
    cy = rect.top + (rect.height || w) / 2;
    /* 死区按**看得见的那个圆**算，不按热区 —— 热区比圆大一圈是给拇指拖的余地，
       不该让「要推多远才有反应」也跟着变大。 */
    var rw = 0;
    try{ rw = ring ? ring.getBoundingClientRect().width : 0; }catch(e){ rw = 0; }
    r = (rw || w) / 2;
    el.classList.add('on');
    move(tx, ty);
  }
  function evXY(ev, touch){
    var t = touch || (ev.touches && ev.touches[0]) || (ev.changedTouches && ev.changedTouches[0]) || ev;
    return [t.clientX, t.clientY];
  }
  if(window.PointerEvent){
    el.addEventListener('pointerdown', function(ev){
      if(pid !== null) return;                       // 第二根手指不接管
      pid = ev.pointerId;
      try{ el.setPointerCapture(pid); }catch(e){}
      ev.preventDefault();
      begin(ev.clientX, ev.clientY);
    });
    el.addEventListener('pointermove', function(ev){
      if(ev.pointerId !== pid) return;
      ev.preventDefault();
      move(ev.clientX, ev.clientY);
    });
    ['pointerup','pointercancel'].forEach(function(t){
      el.addEventListener(t, function(ev){ if(ev.pointerId === pid) reset(); });
    });
  } else {
    el.addEventListener('touchstart', function(ev){
      if(pid !== null) return;
      pid = 1; ev.preventDefault();
      var xy = evXY(ev); begin(xy[0], xy[1]);
    }, {passive:false});
    el.addEventListener('touchmove', function(ev){
      ev.preventDefault();
      var xy = evXY(ev); move(xy[0], xy[1]);
    }, {passive:false});
    ['touchend','touchcancel'].forEach(function(t){ el.addEventListener(t, reset); });
  }
}

/* ---------------- 右上角菜单 ---------------- */
function sgMenuHTML(){
  return SG_MENU_GROUPS.map(function(gp){
    var btns = gp.items.map(function(it){
      var at = it.k ? ' data-k="' + it.k + '"'
             : it.zoom ? ' data-zoom="' + it.zoom + '"'
             : it.info ? ' data-info="1"'
             : it.keys ? ' data-keys="1"' : '';
      var on = (it.info && SPACE_INFO) || (it.keys && SPACE_HIDE) ? ' class="on"' : '';
      var label = it.t;
      if(it.zoom) label = it.t + ' ' + SPACE_ZOOM;
      if(it.info) label = '信息栏 ' + (SPACE_INFO ? '显' : '隐');
      if(it.keys) label = SPACE_HIDE ? '显示按键' : '收起按键';
      return '<button' + on + at + '>' + label + '</button>';
    }).join('');
    return '<div class="gp"><div class="gp-t">' + gp.t + '</div><div class="gp-b">' + btns + '</div></div>';
  }).join('')
  + '<div class="tip">左下滑动 = 走路／选星系／选对话选项；右下 <b>确认</b> = 回车，'
  + '<b>交互</b> = E（面板开着时变成 <b>返回</b>）。顶部胶囊点一下换速度。</div>'
  + '<div class="tip" style="opacity:.55">本机构建 ' + APP_BUILD + '</div>';
}
function sgMenuSet(open){
  SPACE_MENU = !!open;
  var bar = $('spaceCmd');
  if(!bar) return;
  var old = bar.querySelector('.sg-veil');
  var pan = bar.querySelector('.sg-panel');
  var fab = bar.querySelector('.sg-fab');
  if(old) old.parentNode.removeChild(old);
  if(pan) pan.parentNode.removeChild(pan);
  if(fab) fab.classList.toggle('on', SPACE_MENU);
  if(!SPACE_MENU) return;
  var veil = document.createElement('div');
  veil.className = 'sg-veil'; veil.setAttribute('data-veil', '1');
  bindCmdBtn(veil, function(){ sfx('closeapp'); sgMenuSet(false); });
  var panel = document.createElement('div');
  panel.className = 'sg-panel';
  panel.innerHTML = sgMenuHTML();
  /* 抽屉挂在操作层根上，不挂在底座里 —— 底座有 overflow:hidden，会把它裁掉 */
  bar.appendChild(veil);
  bar.appendChild(panel);
  Array.prototype.forEach.call(panel.querySelectorAll('button'), function(b){
    bindCmdBtn(b, function(){
      if(b.hasAttribute('data-k')){ pressKey(b); sgMenuSet(false); return; }
      if(b.hasAttribute('data-zoom')){
        spaceZoomSet(spaceZoomGet() + Number(b.getAttribute('data-zoom'))); sfx('click');
        var z = panel.querySelector('button[data-zoom="-1"]');
        if(z) z.textContent = '字号 − ' + SPACE_ZOOM;
        var z2 = panel.querySelector('button[data-zoom="1"]');
        if(z2) z2.textContent = '字号 ＋ ' + SPACE_ZOOM;
        return;
      }

/* ---------------- 尺寸：按屏宽算好写进 CSS 变量（不依赖 CSS 的 clamp/env 支持） ---------------- */
function sgSafeInset(side){
  try{
    var v = getComputedStyle(document.documentElement).getPropertyValue('--safe-' + side);
    return parseFloat(v) || 0;
  }catch(e){ return 0; }

function sgLayout(){
  var bar = $('spaceCmd');
  if(!bar) return null;
  var w = window.innerWidth || 360, h = window.innerHeight || 780;
  var short = Math.min(w, h);                     /* 横屏/分屏时控件也不会撑爆 */
  var of = function(spec, base){ return Math.round(Math.max(spec[0], Math.min(spec[2], (base || short) * spec[1]))); };
  var top = sgSafeInset('top'), bot = Math.max(40, sgSafeInset('bot') + 16);
  var px = { hit: of(SG_SIZE.hit), ring: of(SG_SIZE.ring), padW: of(SG_SIZE.padW),
             ok: of(SG_SIZE.ok), act: of(SG_SIZE.act), gap: of(SG_SIZE.gap) };
  /* 底座自己解一次方程：装得下摇杆和两个键，再加顶部那道横线和菜单胶囊。
     宁可底座高一点，也不能让控件被 overflow:hidden 裁掉。 */
  var need = Math.max(px.hit, px.ok + px.gap + px.act + 4) + bot + 40;
  var deck = of(SG_SIZE.deck, h);
  px.deck = Math.round(Math.min(Math.max(deck, need), Math.min(h * 0.42, SG_SIZE.deck[2] + 24)));
  px.deck = Math.max(px.deck, need);
  var set = function(k, v){ bar.style.setProperty('--sg-' + k, v + 'px'); };
  set('hit', px.hit); set('ring', px.ring); set('pad-w', px.padW);
  set('ok', px.ok); set('act', px.act); set('gap', px.gap);
  set('deck', px.deck); set('top', top); set('bot', bot);
  px.w = w; px.h = h; px.bottom = bot; px.top = top;
  return px;
}

function dayReportLine(day){
  /* 当天最像"一句报告"的那条：优先取最后一条（夜里的收尾句） */
  var items = (day && day.items) || [];
  if(!items.length) return '';
  for(var i = items.length - 1; i >= 0; i--){
    var t = items[i].text;
    if(t && t.length && kindOf(t) !== 'secret') return t;
  }
  return items[items.length - 1].text || '';
}
function archiveOfDay(day){
  var items = day.items || [];
  var hasSecret = items.some(function(it){ return kindOf(it.text) === 'secret'; });
  var extra = day.extra || [];
  return { n: items.length, hasSecret: hasSecret, extra: extra,
           first: items.length ? items[0].time : '--:--',
           last: items.length ? items[items.length-1].time : '--:--' };
}


/* 朔的随笔：从 DIARY_NOTE 池里按日期确定性取一条。
   同一天永远是同一句（刷新不会变），池子空了就整块不显示。 */
function diaryNote(date){
  try{
    var pool = RAW && RAW.DIARY_NOTE;
    if(!pool || !pool.length) return '';
    var h = 2166136261;
    for(var i = 0; i < date.length; i++){ h ^= date.charCodeAt(i); h = Math.imul(h, 16777619); }
    return pool[Math.abs(h) % pool.length] || '';
  }catch(e){ return ''; }
}
function noteBlockHTML(date){
  var t = diaryNote(date);
  if(!t) return '';
  return '<div class="dnote">'
    + '<div class="dn-h"><span class="dn-q">\u201c</span>随笔<span class="sp"></span>'
    + '<span class="dn-by">她自己写的</span></div>'
    + '<div class="dn-t">' + esc(t) + '</div>'
    + '</div>';
}

/* ============================================================
   日记：朔自己写下来的东西
   正文不再是"时间戳 + 第三人称流水"，而是把当天真正发生的事
   用第一人称串起来 —— 她做了什么、那天是什么天气、什么状态。
   ============================================================ */
function diaryFacts(day){
  var items = (day && day.items) || [];
  var txt = items.map(function(i){ return i.text || ''; }).join(' ');
  var e = emoOf(day.date);
  var hrs = items.map(function(i){ return parseInt(i.time.slice(0,2),10); });
  var dt = new Date(day.date + 'T00:00:00');
  var wd = dt.getDay();
  var hasPlay = (day.extra && day.extra.length) ? true : false;
  var hasPriv = items.some(function(i){ return kindOf(i.text) === 'secret'; });
  return {
    emo: e.level || 'calm', v: (typeof e.v === 'number') ? e.v : 0,
    period: !!e.period,
    school: /课|教室|老师|黑板|同桌|课本|讲台|操场|考试|卷子/.test(txt),
    study:  /作业|卷子|复习|练习|笔记/.test(txt),
    social: /同桌|老师|同学|食堂|人群|朋友|排队/.test(txt),
    tired:  /困|累|撑不住|疲惫|没力气|发沉/.test(txt),
    sick:   /感冒|嗓子|鼻子|发烧|头晕/.test(txt),
    rain:   /雨|雪/.test(txt),
    cold:   /冷|凉|缩|手是冰/.test(txt),
    hot:    /热|汗|蝉|闷/.test(txt),
    night:  hrs.some(function(h){ return h >= 22 || h < 5; }),
    early:  hrs.some(function(h){ return h < 7; }),
    weekend: (wd === 0 || wd === 6),
    lonely: (e.v <= -3),
    good:   (e.level === 'glow' || e.v >= 2),
    low:    (e.level === 'collapse' || e.level === 'irrit' || e.v <= -5),
    play: hasPlay, priv: hasPriv,
    n: items.length
  };
}
/* 按要素从池里取一句；同一天永远取到同一句 */
function dtake(pool, date, salt){
  try{
    var arr = RAW && RAW[pool];
    if(!arr || !arr.length) return '';
    return arr[seedOf(date + '#' + salt) % arr.length] || '';
  }catch(e){ return ''; }
}
/* 把当天的事串成第一人称的几段 */
function diaryLines(day){
  var f = diaryFacts(day);
  var out = [];
  function add(pool, salt){ var t = dtake(pool, day.date, salt); if(t) out.push(t); }

  add('DIARY_WAKE', 'wake');
  if(f.sick)        add('DIARY_SICK', 'sick');
  else if(f.period) add('DIARY_PERIOD', 'period');
  else if(f.tired)  add('DIARY_TIRED', 'tired');
  if(f.rain)        add('DIARY_RAIN', 'rain');
  else if(f.cold)   add('DIARY_COLD', 'cold');
  else if(f.hot)    add('DIARY_HOT', 'hot');

  if(f.weekend){
    add('DIARY_WEEKEND', 'wk');
  }else{
    add('DIARY_COMMUTE', 'commute');
    if(f.school) add('DIARY_SCHOOL', 'school');
    add('DIARY_NOON', 'noon');
  }
  if(f.social) add('DIARY_SOCIAL', 'social');
  if(f.study)  add('DIARY_STUDY', 'study');
  add('DIARY_HOME', 'home');

  if(f.weekend && f.social) add('DIARY_SOCIAL', 'social2');
  if(f.lonely) add('DIARY_LONELY', 'lonely');
  if(f.low)    add('DIARY_LOW', 'low');
  else if(f.good) add('DIARY_GOOD', 'good');
  if(f.night)  add('DIARY_NIGHT', 'night');
  if(f.tired && !f.sick) add('DIARY_TIRED', 'tired2');

  /* 玩过桌游的那天：不写"我玩了游戏"，
     而是让它在日记里变成一段记不清的梦。 */
  if(f.play) add('DIARY_DREAM_GAME', 'dream');

  /* 收尾句按当天情绪分三种调子：
       平静 → 平常的语气；烦躁/生理痛 → 破碎短句；崩溃 → 更短，甚至只是留白 */
  var endPool = 'DIARY_END';
  if(f.emo === 'collapse') endPool = 'DIARY_END_COLLAPSE';
  else if(f.low || f.period) endPool = 'DIARY_END_IRRIT';
  else if(f.good || f.emo === 'calm' || f.emo === 'glow') endPool = 'DIARY_END_CALM';
  if(!(RAW && RAW[endPool] && RAW[endPool].length)) endPool = 'DIARY_END';   // 老数据兜底
  add(endPool, 'end');
  /* 一天别写太长：留 3-6 段，挑出来的顺序保持"早上→夜里" */
  if(out.length > 6){
    var keep = [out[0]];
    var mid = out.slice(1, out.length - 1);
    var step = Math.ceil(mid.length / 4);
    for(var i = 0; i < mid.length && keep.length < 5; i += step) keep.push(mid[i]);
    keep.push(out[out.length - 1]);
    out = keep;
  }
  return out;
}

function renderDiary(){
  var body = $('viewBody');
  var days = [];
  try{ if(DATA && DATA.days && DATA.days.length) days = DATA.days.slice(); }catch(e){}
  if(!days.length){ body.innerHTML = emptyDiary(); return; }

  days.sort(function(x,y){ return x.date < y.date ? 1 : -1; });     // 新的在上
  if(!DIARY_SEL || !days.some(function(d){ return d.date === DIARY_SEL; })) DIARY_SEL = days[0].date;
  var day = days.filter(function(d){ return d.date === DIARY_SEL; })[0];
  if(!day){ body.innerHTML = emptyDiary(); return; }

  var items = day.items || [];
  var seed = seedOf(day.date);
  var lab = fmtDay(day.date);
  var mo = parseInt(day.date.slice(5,7),10), dd = parseInt(day.date.slice(8,10),10);
  var e = emoOf(day.date), moon = moonFor(day.date);
  var weather = guessWeather(day);
  var hasSecret = items.some(function(it){ return kindOf(it.text) === 'secret'; });
  var f = diaryFacts(day);

  /* ---------- 顶部：日期导航（原来"档案"那套月/周折叠，合并进来了） ---------- */
  if(!window.__DN_OPEN) window.__DN_OPEN = { open: false, months: {}, weeks: {} };
  function weekOf(ds){
    var d = new Date(ds + 'T00:00:00');
    var t = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    t.setDate(t.getDate() - ((t.getDay() + 6) % 7));
    return t;
  }
  function weekLabel(ds){
    var m = weekOf(ds), sun = new Date(m.getTime()); sun.setDate(sun.getDate() + 6);
    return (m.getMonth()+1) + '/' + m.getDate() + ' – ' + (sun.getMonth()+1) + '/' + sun.getDate();
  }
  var months = [], byM = {};
  days.forEach(function(d){
    var ym = d.date.slice(0,7);
    if(!byM[ym]){ byM[ym] = { ym: ym, weeks: [], wIdx: {} }; months.push(byM[ym]); }
    var M = byM[ym], wk = weekOf(d.date).toISOString().slice(0,10);
    if(!M.wIdx[wk]){ M.wIdx[wk] = { key: wk, label: weekLabel(d.date), days: [] }; M.weeks.push(M.wIdx[wk]); }
    M.wIdx[wk].days.push(d);
  });

  var nav = '';
  if(window.__DN_OPEN.open){
    nav = '<div class="dn-nav">';
    months.forEach(function(M, mi){
      var mOpen = (window.__DN_OPEN.months[M.ym] !== undefined) ? window.__DN_OPEN.months[M.ym] : (mi === 0);
      nav += '<div class="dn-m' + (mOpen ? ' open' : '') + '">'
        + '<div class="dn-mh" data-nav-m="' + M.ym + '"><span class="dn-ar">' + (mOpen ? '▼' : '▶') + '</span>'
        + '<span class="dn-mt">' + M.ym.slice(0,4) + ' 年 ' + parseInt(M.ym.slice(5,7),10) + ' 月</span>'
        + '<span class="sp"></span><span class="dn-c">' + M.weeks.length + ' 周</span></div><div class="dn-mb">';
      M.weeks.forEach(function(W, wi){
        var wOpen = (window.__DN_OPEN.weeks[W.key] !== undefined) ? window.__DN_OPEN.weeks[W.key] : (mOpen && wi === 0);
        nav += '<div class="dn-w' + (wOpen ? ' open' : '') + '">'
          + '<div class="dn-wh" data-nav-w="' + W.key + '"><span class="dn-ar">' + (wOpen ? '▼' : '▶') + '</span>'
          + '<span class="dn-wt">' + W.label + '</span><span class="sp"></span>'
          + '<span class="dn-c">' + W.days.length + ' 天</span></div><div class="dn-wb">';
        W.days.forEach(function(d){
          var m2 = moonFor(d.date);
          var wd = ['日','一','二','三','四','五','六'][new Date(d.date+'T00:00:00').getDay()];
          nav += '<button class="dn-d' + (d.date === DIARY_SEL ? ' on' : '') + '" data-d="' + d.date + '">'
              + '<span class="dn-moon">' + m2.g + '</span>'
              + '<span class="dn-dd">' + parseInt(d.date.slice(5,7),10) + '/' + parseInt(d.date.slice(8,10),10) + '</span>'
              + '<span class="dn-wd">周' + wd + '</span></button>';
        });
        nav += '</div></div>';
      });
      nav += '</div></div>';
    });
    nav += '</div>';
  }

  var html = '<div class="dn-head">'
    + '<span class="dn-title">日记</span>'
    + '<span class="sp"></span>'
    + '<button class="dn-toggle" id="dnToggle">' + (window.__DN_OPEN.open ? '收起日期' : '选日期') + '</button>'
    + '</div>' + nav;

  var lines = diaryLines(day);
  /* 情绪决定排版气质：平静 = 工整留白，烦躁/崩溃 = 压暗、错落、带涂改 */
  var moodAttr = (f.low) ? ((f.emo === 'collapse') ? 'collapse' : 'irrit') : 'calm';

  html += '<div class="dpaper" data-mood="' + moodAttr + '" id="dpaper">'
    + '<div class="dmeta">'
      + '<span class="dm-w">' + day.weekday + (lab.tag ? ' · ' + lab.tag : '') + '</span>'
      + '<span class="dm-wx">' + weather + '</span>'
      + '<span class="dm-moon">' + moon.g + '<i>' + moon.cn + '</i>'
        + '</span>'
    + '</div>'
    + '<div class="dtitle"><span class="dt-n">' + mo + '</span><span class="dt-u">月</span>'
      + '<span class="dt-n">' + dd + '</span><span class="dt-u">日</span></div>';

  html += '<div class="dtxt" id="dtxt">';
  if(lines.length){
    lines.forEach(function(t){ html += '<p class="dtp">' + esc(t) + '</p>'; });
  }else if(!items.length){
    html += '<p class="dtp dtp-empty">这一天什么也没记下。</p>';
  }
  html += '</div>';

  /* 她的随笔 */
  html += noteBlockHTML(day.date);

  /* 原始记录：默认收起，想看细节时再展开 */
  if(items.length){
    var trail = trajectoryOfItems(items);
    html += '<div class="draw-wrap"><button class="draw-btn" id="dnRaw">'
      + '当天发生了什么 ▾</button><div class="draw-body" id="dnRawBody">';

    if(trail.length){
      html += '<div class="trail-line">她走过：'
        + trail.map(function(p){ return '<b>' + esc(p) + '</b>'; }).join('<i>→</i>') + '</div>';
    }

    /* 按地点把当天切成几段：同一个地方连着待着就算一段，
       这样出来是一条路线，而不是一长串挤在一起的时间点。 */
    function placeOf(it){
      for(var pi = 0; pi < PLACE_HINT.length; pi++){
        if(PLACE_HINT[pi][0].test(it.text)) return PLACE_HINT[pi][1];
      }
      return '';
    }
    var segs = [];
    items.forEach(function(it){
      var pl = placeOf(it);
      var lastSeg = segs[segs.length - 1];
      if(lastSeg && pl && lastSeg.place === pl){ lastSeg.items.push(it); lastSeg.end = it.time; }
      else segs.push({ place: pl, start: it.time, end: it.time, items: [it] });
    });

    html += '<div class="tl">';
    segs.forEach(function(sg, si){
      var first = sg.items[0];
      var h = parseInt(first.time.slice(0,2),10);
      var night = (h < 6 || h >= 22);
      var anyPriv = sg.items.some(function(x){ return kindOf(x.text) === 'secret'; });
      var span = (sg.start === sg.end) ? sg.start : (sg.start + ' – ' + sg.end);
      // 这一段里挑一句最能代表的话（优先非私密、较长的）
      var pickIt = null;
      for(var qi = 0; qi < sg.items.length; qi++){
        if(kindOf(sg.items[qi].text) !== 'secret'){ pickIt = sg.items[qi]; break; }
      }
      if(!pickIt) pickIt = first;
      html += '<div class="tl-node' + (night ? ' night' : '') + (anyPriv ? ' priv' : '') + '">'
        + '<div class="tl-time">' + span.replace(' – ', '<br>') + '</div>'
        + '<div class="tl-rail"><i class="tl-pin"></i>'
          + (si < segs.length - 1 ? '<i class="tl-stem"></i>' : '') + '</div>'
        + '<div class="tl-body">'
          + (sg.place ? '<div class="tl-where">' + esc(sg.place)
              + '<span class="tl-count">' + sg.items.length + ' 条</span></div>'
            : '<div class="tl-where"><span class="tl-count">' + sg.items.length + ' 条</span></div>')
          + '<div class="tl-text">'
            + (anyPriv ? '<span class="tl-masked">（这一段她没有写清楚）</span>'
                       : esc(pickIt.text))
          + '</div>'
        + '</div></div>';
    });
    html += '</div>';
    html += '</div></div>';
  }

  html += '</div>';

  html += extraBlock(extraByDate(DIARY_SEL));
  body.innerHTML = html;

  /* ---- 交互 ---- */
  var tg = $('dnToggle');
  if(tg) tg.onclick = function(){
    window.__DN_OPEN.open = !window.__DN_OPEN.open;
    try{ sfx('click'); }catch(e){}
    renderDiary();
  };
  Array.prototype.forEach.call(body.querySelectorAll('[data-nav-m]'), function(el){
    el.onclick = function(ev){
      ev.stopPropagation();
      var ym = el.dataset.navM, box = el.parentNode;
      var on = !box.classList.contains('open');
      box.classList.toggle('open', on);
      window.__DN_OPEN.months[ym] = on;
      el.querySelector('.dn-ar').textContent = on ? '▼' : '▶';
      try{ sfx('click'); }catch(e){}
    };
  });
  Array.prototype.forEach.call(body.querySelectorAll('[data-nav-w]'), function(el){
    el.onclick = function(ev){
      ev.stopPropagation();
      var wk = el.dataset.navW, box = el.parentNode;
      var on = !box.classList.contains('open');
      box.classList.toggle('open', on);
      window.__DN_OPEN.weeks[wk] = on;
      el.querySelector('.dn-ar').textContent = on ? '▼' : '▶';
      try{ sfx('click'); }catch(e){}
    };
  });
  Array.prototype.forEach.call(body.querySelectorAll('.dn-d'), function(el){
    el.onclick = function(ev){
      ev.stopPropagation();
      DIARY_SEL = el.dataset.d;
      try{ sfx('click'); }catch(e){}
      $('viewBody').scrollTop = 0;
      renderDiary();
    };
  });
  var rb = $('dnRaw');
  if(rb){
    // 记在内存里，重绘后还能保持展开
    if(!window.__DN_RAW) window.__DN_RAW = {};
    if(window.__DN_RAW[DIARY_SEL] && $('dnRawBody')){
      $('dnRawBody').classList.add('open');
      rb.textContent = '当天发生了什么 ▴';
    }
    rb.onclick = function(){
      var bd = $('dnRawBody');
      var on = bd.classList.toggle('open');
      window.__DN_RAW[DIARY_SEL] = on;
      rb.textContent = '当天发生了什么 ' + (on ? '▴' : '▾');
      try{ sfx('click'); }catch(e){}
    };
  }
}

/* 把朔当前的情绪推给桌游，让它改色调/音效/氛围。
   桌游没收到也能正常跑（它会用默认外观），所以这里失败一律静默。 */
function currentMood(){
  try{
    var e = (window.Saku && Saku.EMO) ? Saku.EMO() : null;
    if(!e) return { level:'calm', v:0 };
    var f = e.flags || {};
    return { level: e.level || 'calm', v: (typeof e.v === 'number') ? e.v : 0,
             period: !!f.period, sick: !!f.sick, sleepDebt: f.sleepDebt || 0 };
  }catch(err){ return { level:'calm', v:0 }; }
}
function pushMoodToGame(){
  try{
    var frame = $('gameFrame');
    if(!frame || !frame.contentWindow) return;
    frame.contentWindow.postMessage({ type:'maze_mood', payload: currentMood() }, '*');
  }catch(e){}
}

async function openGame(){
  var frame = $('gameFrame');
  if(!frame) return;
  try{
    if(!window.SAKU_MAZE_ENC) throw new Error('没有桌游数据');
    if(!window.__SAKU_PW) throw new Error('还没解锁');
    frame.srcdoc = await decryptRaw(window.__SAKU_PW, window.SAKU_MAZE_ENC);
    setTimeout(pushMoodToGame, 350);
    setTimeout(pushMoodToGame, 1400);
  }catch(e){
    frame.srcdoc = '<body style="background:#2e2822;color:#f3e9d6;font-family:serif;padding:40px;line-height:1.8">'
      + '桌游载入失败：' + e.message + '</body>';
  }
}

/* ============================================================
   开发者测试模式：沙盒生成 + 分层来源追踪
   数据全在内存，不碰 localStorage
   ============================================================ */
let DEV = { days: [], n: 7, sel: null, showLayer: true };

const DEV_SCENES = ['sleep','wake','commute','school_am','lunch','school_noon','school_pm',
                    'commute_home','home_evening','study','night','wk_morning','wk_noon',
                    'wk_afternoon','wk_evening'];
const DEV_PLACE = {
  sleep:'卧室', wake:'卧室', commute:'街上', school_am:'教室', lunch:'食堂',
  school_noon:'图书室', school_pm:'教室', commute_home:'街上', home_evening:'厨房',
  study:'书桌前', night:'浴室', wk_morning:'厨房', wk_noon:'咖啡店',
  wk_afternoon:'公园', wk_evening:'天台',
};
/* 确定性 hash（不引入随机，保证同一批数据可复现） */
function devHash(a, b){
  var h = 2166136261, x = String(a) + '#' + String(b);
  for(var i = 0; i < x.length; i++){ h ^= x.charCodeAt(i); h = Math.imul(h, 16777619); }
  return (h >>> 0);
}
/* 带去重的抽取，并记录来源 */
function devPick(cfg){
  var pool = cfg.pool, used = cfg.used, tag = cfg.tag;
  if(!pool || !pool.length) return null;
  var cand = pool.filter(function(x){ return used.indexOf(x) < 0; });
  var reset = false;
  if(!cand.length){ cand = pool.slice(); reset = true; }
  var idx = devHash(cfg.seed, tag + cand.length) % cand.length;
  var text = cand[idx];
  used.push(text);
  return { text: text, layer: tag, size: pool.length, at: idx, reset: reset };
}

function devBuild(n){
  DEV.n = n; DEV.sel = null; DEV.days = [];
  DEV.seed = Date.now() % 100000000;      // 每次推演全新种子
  setSandbox(true);                        // 从这里开始，一切都只活在内存里
  if(!RAW || !RAW.scenes) return;
  var today = new Date();
  for(var i = n - 1; i >= 0; i--){
    var dt = new Date(today.getTime() - i * 86400000);
    var date = dt.getFullYear() + '-' + pad(dt.getMonth()+1) + '-' + pad(dt.getDate());
    var wk = dt.getDay() === 0 || dt.getDay() === 6;
    var used = [];
    var items = [];
    var seedBase = devHash(date, 'day');
    // 一天按 2 小时一格走
    for(var h = (wk ? 8 : 6); h <= 23; h += 2){
      var sc = devSceneFor(h, wk);
      var r = null;
      var roll = devHash(seedBase, 'r' + h) % 100;
      if(roll < 22 && RAW.BODY){
        r = devPick({ pool: (h >= 21 || h < 6) ? RAW.BODY.concat(RAW.BODY_NIGHT) : RAW.BODY,
                      used: used, tag: 'BODY', seed: seedBase + h });
      }
      if(!r && roll >= 88 && RAW.CYCLE){
        r = devPick({ pool: RAW.CYCLE, used: used, tag: 'CYCLE', seed: seedBase + h });
      }
      if(!r){
        var grp = RAW.scenes[sc] || RAW.scenes.bedroom;
        r = devPick({ pool: grp.body, used: used, tag: '场景/' + sc, seed: seedBase + h });
      }
      if(!r) continue;
      // 尾巴
      var tailTxt = '', tailTag = '';
      var tr = devHash(seedBase, 't' + h) % 100;
      if(tr < 12 && RAW.RAIN_TAILS){
        tailTxt = RAW.RAIN_TAILS[devHash(seedBase, 'rt' + h) % RAW.RAIN_TAILS.length];
        tailTag = '尾巴/雨';
      } else if(tr < 20 && RAW.DICE_TAILS){
        tailTxt = RAW.DICE_TAILS[devHash(seedBase, 'dt' + h) % RAW.DICE_TAILS.length];
        tailTag = '尾巴/骰子';
      } else if(tr < 28 && RAW.CHAPTER_TAILS){
        tailTxt = RAW.CHAPTER_TAILS[devHash(seedBase, 'ct' + h) % RAW.CHAPTER_TAILS.length];
        tailTag = '尾巴/章节';
      }
      items.push({
        time: pad(h) + ':' + pad(devHash(seedBase, 'm' + h) % 60),
        text: r.text + (tailTxt ? ' ' + tailTxt.trim() : ''),
        layer: r.layer, size: r.size, at: r.at,
        tail: tailTag || null, scene: sc, place: DEV_PLACE[sc] || '—',
        reset: r.reset,
      });
    }
    DEV.days.push({ date: date, weekday: ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'][dt.getDay()],
                    items: items, extra: [] });
  }
  devRender();
}
function devSceneFor(h, wk){
  if(wk){
    if(h < 9) return 'wk_morning';
    if(h < 12) return 'wk_noon';
    if(h < 18) return 'wk_afternoon';
    if(h < 22) return 'wk_evening';
    return 'sleep';
  }
  if(h < 7) return 'wake';
  if(h < 9) return 'commute';
  if(h < 12) return 'school_am';
  if(h < 14) return 'lunch';
  if(h < 17) return 'school_pm';
  if(h < 18) return 'commute_home';
  if(h < 20) return 'home_evening';
  if(h < 22) return 'study';
  return 'night';
}

function devRender(){
  var body = $('viewBody');
  var n = DEV.days.length;
  var total = DEV.days.reduce(function(a,d){ return a + d.items.length; }, 0);
  var all = [];
  DEV.days.forEach(function(d){ d.items.forEach(function(i){ all.push(i.text); }); });
  var uniq = {};
  all.forEach(function(t){ uniq[t] = 1; });
  var dupRate = all.length ? Math.round((1 - Object.keys(uniq).length / all.length) * 100) : 0;

  var html = '<div class="card hl"><h3>开发者测试模式</h3>'
    + '<p style="font-size:13.5px;color:var(--dim)">沙盒数据，只在内存里。关闭这个页面就销毁，不写存档。</p>'
    + '<div class="dev-stat">'
      + '<span><b>' + n + '</b> 天</span>'
      + '<span><b>' + total + '</b> 条记录</span>'
      + '<span><b>' + dupRate + '%</b> 重复率</span>'
    + '</div>'
    + '<div class="dev-btns">'
      + '<button class="dev-btn" id="devR7">重新推演 7 天</button>'
      + '<button class="dev-btn" id="devR30">重新推演 30 天</button>'
      + '<button class="dev-btn" id="devR100">重新推演 100 天</button>'
      + '<button class="dev-btn" id="devLayer">来源标注 ' + (DEV.showLayer ? '开' : '关') + '</button>'
      + '<button class="dev-btn dan" id="devClose">销毁当前推演</button>'
    + '</div></div>';

  DEV.days.forEach(function(d, di){
    var open = (DEV.sel === d.date) || (DEV.sel === null && di === DEV.days.length - 1);
    html += '<div class="fold' + (open ? ' open' : '') + '" data-dev="' + d.date + '">'
      + '<div class="fold-h"><span class="ar">▶</span><span>' + d.date.slice(5) + '</span>'
      + '<span style="font-size:11.5px;color:var(--dim2)">' + d.weekday + '</span>'
      + '<span class="sp"></span><span class="cnt">' + d.items.length + ' 条</span></div>'
      + '<div class="fold-b">';
    d.items.forEach(function(it){
      html += '<div class="dev-item">'
        + '<div class="di-top"><span class="di-t">' + it.time + '</span>'
        + '<span class="di-p">' + it.place + '</span></div>'
        + '<div class="di-x">' + it.text + '</div>'
        + (DEV.showLayer
            ? '<div class="di-layer">'
                + '<span class="dl dl-scene">' + it.layer + '</span>'
                + '<span class="dl dl-size">池 ' + it.size + ' 条 · 取第 ' + (it.at + 1) + '</span>'
                + (it.tail ? '<span class="dl dl-tail">' + it.tail + '</span>' : '')
                + (it.reset ? '<span class="dl dl-warn">池已用尽，重置</span>' : '')
              + '</div>'
            : '')
        + '</div>';
    });
    html += '</div></div>';
  });

  body.innerHTML = html;
  var r7 = $('devR7'), r30 = $('devR30'), dl = $('devLayer'), dc = $('devClose');
  if(r7) r7.onclick = function(){ sfx('click'); devBuild(7); };
  if(r30) r30.onclick = function(){ sfx('click'); devBuild(30); };
  if(dl) dl.onclick = function(){ DEV.showLayer = !DEV.showLayer; sfx('click'); devRender(); };
  if(dc) dc.onclick = function(){ sfx('closeapp'); DEV.days = []; DEV.seed = 0; setSandbox(false); closeView(); };
  var r100 = $('devR100');
  if(r100) r100.onclick = function(){ sfx('click'); devBuild(100); };
  document.querySelectorAll('[data-dev]').forEach(function(f){
    var h = f.querySelector('.fold-h');
    h.onclick = function(){ f.classList.toggle('open'); sfx('click'); };
  });
}

/* ============================================================
   内容管理（在投递箱里）
   口令只从本机/局域网取得到，公网拿不到。
   静态托管的线上版一样能用，只要这台机器上跑着 8088。
   ============================================================ */
let CM = { token:'', file:null, ready:false };
const CM_STORE = 'saku_cm_token';          // 解锁后的 token 存这儿，下次不用再输

function cmApi(path, opt){
  return fetch(DROP_BASE + path + (path.indexOf('?') >= 0 ? '&' : '?') + 't=' + encodeURIComponent(CM.token), opt);
}
function cmLog(html){ var el = $('cmLog'); if(el) el.innerHTML = html; }
function cmEsc(x){ return String(x == null ? '' : x).replace(/[&<>]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }); }

function initContentManage(){
  var card = $('cmCard'); if(!card) return;

  function showLock(msg){
    $('cmLock').style.display = 'block';
    $('cmBody').style.display = 'none';
    if(msg) $('cmLockMsg').innerHTML = msg;
  }
  function showBody(){
    $('cmLock').style.display = 'none';
    $('cmBody').style.display = 'block';
  }
  window.__cmShowLock = showLock;
  window.__cmShowBody = showBody;

  var pw = $('cmPw');
  async function tryUnlock(){
    var v = (pw.value || '').trim();
    if(!v){ $('cmLockMsg').innerHTML = '<span class="err">先输密码。</span>'; return; }
    $('cmLockMsg').innerHTML = '<span class="mut">正在验证…</span>';
    try{
      var r = await fetch(DROP_BASE + '/admin/auth', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ password: v })
      });
      var d = await r.json();
      if(!d.ok){ $('cmLockMsg').innerHTML = '<span class="err">' + cmEsc(d.err || '解锁失败') + '</span>'; sfx('bad'); return; }
      CM.token = d.token; CM.ready = true;
      try{ localStorage.setItem(CM_STORE, d.token); }catch(e){}
      pw.value = '';
      showBody(); sfx('good'); cmStatus(); bindCmActions();
    }catch(e){
      $('cmLockMsg').innerHTML = '<span class="err">连不上本机服务 —— ' + cmEsc(e.message) + '</span><br>'
        + '<span class="mut">确认这台机器上跑着 8088。</span>';
    }
  }
  $('cmUnlock').onclick = tryUnlock;
  pw.addEventListener('keydown', function(ev){ if(ev.key === 'Enter') tryUnlock(); });
  $('cmLockAgain').onclick = function(){
    CM.token = ''; CM.ready = false;
    try{ localStorage.removeItem(CM_STORE); }catch(e){}
    sfx('click'); showLock('<span class="mut">已锁定。</span>');
  };

  // 上次解锁过就直接进
  var saved = '';
  try{ saved = localStorage.getItem(CM_STORE) || ''; }catch(e){}
  if(saved){
    CM.token = saved;
    fetch(DROP_BASE + '/admin/status?t=' + encodeURIComponent(saved), {cache:'no-store'})
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(d){
        if(d && d.ok){ CM.ready = true; showBody(); cmStatus(); bindCmActions(); }
        else { try{ localStorage.removeItem(CM_STORE); }catch(e){} showLock(); }
      })
      .catch(function(){ CM.token = ''; showLock('<span class="mut">本机服务没跑起来。</span>'); });
  }else{
    showLock();
  }
}

let cmBound = false;
function bindCmActions(){
  if(cmBound) return; cmBound = true;
  $('cmExport').onclick = function(){
    sfx('click');
    var a = document.createElement('a');
    a.href = DROP_BASE + '/admin/export?t=' + encodeURIComponent(CM.token);
    a.download = 'saku_word.json';
    document.body.appendChild(a); a.click(); a.remove();
  };
  var f = $('cmFile'), dz = $('cmDz');
  dz.addEventListener('dragover', function(e){ e.preventDefault(); dz.classList.add('over'); });
  dz.addEventListener('dragleave', function(){ dz.classList.remove('over'); });
  dz.addEventListener('drop', function(e){
    e.preventDefault(); dz.classList.remove('over');
    if(e.dataTransfer && e.dataTransfer.files[0]) cmTake(e.dataTransfer.files[0]);
  });
  f.addEventListener('change', function(){ if(f.files && f.files[0]) cmTake(f.files[0]); });
  $('cmSave').onclick  = function(){ if(CM.file) cmSend(CM.file, false); };
  $('cmCheck').onclick = function(){ if(CM.file) cmSend(CM.file, true); };
  $('cmClear').onclick = function(){
    CM.file = null; f.value = ''; cmLog('');
    $('cmSave').disabled = $('cmCheck').disabled = $('cmClear').disabled = true;
    sfx('click');
  };
  var bk = $('cmBackup');
  if(bk) bk.onclick = function(){
    sfx('click');
    var a = document.createElement('a');
    a.href = DROP_BASE + '/admin/backup?t=' + encodeURIComponent(CM.token);
    a.download = 'saku-src-' + new Date().toISOString().slice(0,10) + '.zip';
    document.body.appendChild(a); a.click(); a.remove();
  };
}

function cmTake(file){
  CM.file = file;
  $('cmSave').disabled = $('cmCheck').disabled = $('cmClear').disabled = false;
  $('cmDz').querySelector('.dz-t').textContent = file.name;
  $('cmDz').querySelector('.dz-s').textContent = (file.size/1024).toFixed(0) + ' KB · 已就绪';
  cmLog('<span class="mut">不确定就先点「仅检查」，它只看不改。</span>');
}

async function cmSend(file, dry){
  $('cmSave').disabled = $('cmCheck').disabled = true;
  cmLog('<span class="mut">' + (dry ? '检查中（不会改动任何东西）…' : '提交中，正在校验 → 自动修正 → 加密 → 部署…') + '</span>');
  var d;
  try{
    var r = await cmApi('/admin/save' + (dry ? '&dry=1' : ''), {
      method:'POST', headers:{'Content-Type':'application/json'}, body:file
    });
    d = await r.json();
  }catch(e){
    cmLog('<span class="err">读不出来 —— ' + cmEsc(e.message) + '</span><br>'
      + '<span class="mut">重新点一次「选择文件」再试（别用上次那次记录）；文件在网盘的话先下载到手机本地。</span>');
    $('cmSave').disabled = $('cmCheck').disabled = false;
    return;
  }

  if(dry){
    if(d.ok && d.dry){
      cmLog('<span class="ok">✓ 检查通过，文件没问题</span><br>'
        + '文本池 ' + d.pools + ' 个，共 ' + d.items + ' 条<br>'
        + '<span class="mut">没有改动任何东西。确认无误再点「加密并更新」。</span>');
    }else if(d.can_fix){
      cmLog('<span class="err">格式有问题，但可以自动修好。</span><br>'
        + '修完后会是：文本池 ' + (d.fix_preview ? d.fix_preview.pools : '?') + ' 个，共 '
        + (d.fix_preview ? d.fix_preview.items : '?') + ' 条<br><br>'
        + '<span class="warn">会做这些改动：</span><br>• ' + (d.fixes || []).map(cmEsc).join('<br>• '));
    }else{
      cmLog('<span class="err">' + cmEsc(d.err || '文件有问题，而且不能自动修') + '</span>'
        + (d.hint ? '<br><br>💡 ' + cmEsc(d.hint) : ''));
    }
    $('cmSave').disabled = false; $('cmCheck').disabled = false;
    setTimeout(cmStatus, 800);
    return;
  }

  if(!d.ok){
    cmLog('<span class="err">' + cmEsc(d.err || '未知错误') + '</span>'
      + (d.hint ? '<br><br>💡 ' + cmEsc(d.hint) : ''));
    $('cmSave').disabled = false; $('cmCheck').disabled = false;
    return;
  }

  var h = '<span class="ok">✓ 已加密并开始部署</span><br>'
        + '文本池 ' + d.pools + ' 个，共 ' + d.items + ' 条<br>'
        + '密文 ' + (d.enc_size/1024).toFixed(0) + ' KB　' + cmEsc(d.deploy);
  if(d.fixes && d.fixes.length)
    h += '<br><br><span class="warn">上传的文件有 ' + d.fixes.length + ' 处标点问题，已自动修好：</span><br>'
       + '<span class="mut">• ' + d.fixes.map(cmEsc).join('<br>• ') + '</span>';
  if(d.added && d.added.length)   h += '<br><span class="warn">新增的池：' + cmEsc(d.added.join('、')) + '</span>';
  if(d.removed && d.removed.length) h += '<br><span class="warn">删掉的池：' + cmEsc(d.removed.join('、')) + '</span>';
  h += '<br><span class="mut">旧版已备份为 saku_word.json.bak。</span>';
  cmLog(h);
  setTimeout(cmStatus, 1500);
  setTimeout(function(){ $('cmSave').disabled = false; $('cmCheck').disabled = false; }, 3000);
}

async function cmStatus(){
  var el = $('cmStat'); if(!el || !CM.ready) return;
  try{
    var d = await (await cmApi('/admin/status')).json();
    if(d.error){ el.innerHTML = '<span class="err">源文件读取失败：' + cmEsc(d.error) + '</span>'; return; }
    el.innerHTML = '<b>' + d.pools + '</b> 个文本池　<b>' + d.items + '</b> 条<br>'
      + '<span style="font-size:12px">密文 ' + (d.enc_size ? (d.enc_size/1024).toFixed(0) + ' KB' : '—')
      + (d.enc_mtime ? '　最后加密 ' + cmEsc(d.enc_mtime) : '') + '</span>';
    var dp = $('cmDeploy');
    dp.innerHTML = d.deploying
      ? '⏳ 部署中…' + (d.pending ? '<br>还有一次排队，跑完会自动接着上传' : '')
      : cmEsc(d.deploy_msg || '—').replace(/\n/g, '<br>');
    if(d.deploying) setTimeout(cmStatus, 4000);
  }catch(e){ el.innerHTML = '<span class="err">连不上：' + cmEsc(e.message) + '</span>'; }
}

function uploadAll(files){
  var list = Array.prototype.slice.call(files);
  var bar = $('dzBar'), log = $('dzLog');
  bar.classList.add('on');
  log.innerHTML = '';
  var i = 0;

  function next(){
    if(i >= list.length){
      bar.classList.remove('on');
      try{ sfx('good'); }catch(e){}
      loadDropList();
      return;
    }
    var f = list[i++];
    var line = document.createElement('div');
    line.className = 'dl-line';
    line.textContent = '↑ ' + f.name + '  (' + (f.size/1024).toFixed(0) + ' KB)';
    log.appendChild(line);

    var xhr = new XMLHttpRequest();
    xhr.open('POST', DROP_BASE + '/upload', true);
    xhr.setRequestHeader('X-Filename', encodeURIComponent(f.name));
    xhr.setRequestHeader('Content-Type', 'application/octet-stream');
    xhr.upload.onprogress = function(e){
      if(e.lengthComputable) bar.firstElementChild.style.width = (e.loaded/e.total*100).toFixed(0) + '%';
    };
    xhr.onload = function(){
      var r = {};
      try{ r = JSON.parse(xhr.responseText); }catch(e){}
      if(xhr.status === 200 && r.ok){
        line.className = 'dl-line ok';
        line.textContent = '✓ ' + r.name + '  (' + (r.size/1024).toFixed(0) + ' KB)';
        try{ sfx('coin'); }catch(e){}
      } else {
        line.className = 'dl-line err';
        line.textContent = '✗ ' + f.name + ' — ' + (r.result || r.error || xhr.status);
      }
      next();
    };
    xhr.onerror = function(){
      line.className = 'dl-line err';
      line.textContent = '✗ 连不上收件口。确认手机和容器在同一台机器上（' + DROP_BASE + '）';
      next();
    };
    xhr.send(f);
  }
  next();
}

function loadDropList(){
  var el = $('dzList');
  if(!el) return;
  fetch(DROP_BASE + '/api/uploaded', {cache:'no-store'})
    .then(function(r){ return r.json(); })
    .then(function(d){
      var fs = (d && d.files) || [];
      if(!fs.length){ el.innerHTML = '<span class="empty">（还没有）</span>'; return; }
      el.innerHTML = fs.map(function(n){
        return '<div class="drop-item"><span class="di-n">' + n + '</span></div>';
      }).join('');
    })
    .catch(function(){ el.innerHTML = '<span class="empty">收件口没应答（' + DROP_BASE + '）</span>'; });
}

/* ---------- 壁纸 ---------- */
const WALL_KEY = 'saku_wall';
function getWall(){ try{ return localStorage.getItem(WALL_KEY); }catch(e){ return null; } }
function applyWall(){
  var w = getWall(), el = $('wallpaper'), veil = document.querySelector('#home .veil');
  if(w){ el.style.backgroundImage = 'url(' + w + ')'; el.classList.add('on'); veil.classList.add('on'); }
  else { el.style.backgroundImage = ''; el.classList.remove('on'); veil.classList.remove('on'); }
}
function renderWall(){
  var cur = getWall();
  $('viewBody').innerHTML = `
    <div class="card"><h3>桌面壁纸</h3>
      <p style="color:var(--dim);font-size:13.5px">选一张图，它会成为这个世界的背景。图片只存在你这台手机上，不会上传到任何地方。</p>
    </div>
    ${cur ? '<img class="wprev" id="wPrev" src="' + cur + '">'
          : '<div class="card"><div class="empty">还没有设过壁纸。下面选一张。</div></div>'}
    <label class="wpick">＋ 从相册或文件里选一张图
      <input type="file" id="wFile" accept="image/*">
    </label>
    <div class="wbtns">
      ${cur ? '<button class="pri" id="wKeep">就这么用</button><button class="dan" id="wClear">清除壁纸</button>' : ''}
    </div>
    <div class="card" style="margin-top:14px"><h3>说明</h3>
      <p style="color:var(--dim);font-size:13.5px">图片会自动压缩到适合屏幕的尺寸再存下来（原图不会占空间）。竖图效果最好。</p>
    </div>`;

  var file = $('wFile');
  if(file) file.addEventListener('change', function(){
    var f = file.files && file.files[0];
    if(!f) return;
    var img = new Image(), rd = new FileReader();
    rd.onload = function(){ img.src = rd.result; };
    img.onload = function(){
      // 压缩：长边不超过 1600，转 JPEG
      var maxSide = 1600, w = img.width, h = img.height;
      var sc = Math.min(1, maxSide / Math.max(w, h));
      var cw = Math.round(w * sc), chh = Math.round(h * sc);
      var cv = document.createElement('canvas');
      cv.width = cw; cv.height = chh;
      var ctx = cv.getContext('2d');
      ctx.drawImage(img, 0, 0, cw, chh);
      var data = cv.toDataURL('image/jpeg', 0.86);
      try{
        localStorage.setItem(WALL_KEY, data);
      }catch(e){
        // 存不下就再压一档
        data = cv.toDataURL('image/jpeg', 0.62);
        try{ localStorage.setItem(WALL_KEY, data); }catch(e2){
          $('viewBody').insertAdjacentHTML('afterbegin',
            '<div class="card"><p style="color:#e0a09a">这张图太大了，本机存不下。换一张小一点的试试。</p></div>');
          return;
        }
      }
      sfx('relic');
      applyWall();
      renderWall();
    };
    rd.readAsDataURL(f);
  });
  var keep = $('wKeep');
  if(keep) keep.onclick = function(){ sfx('coin'); closeView(); };
  var clr = $('wClear');
  if(clr) clr.onclick = function(){
    try{ localStorage.removeItem(WALL_KEY); }catch(e){}
    sfx('discard');
    applyWall();
    renderWall();
  };
}

/* ---------- 桌面构建 ---------- */
function buildHome(){
  var g = $('grid');
  g.innerHTML = '';
  APPS.filter(function(a){ return !a.hidden; }).forEach(function(a){
    var el = document.createElement('div');
    el.className = 'app';
    el.dataset.app = a.id;
    el.innerHTML = '<div class="ico">' + a.ico + '</div><div class="nm">' + a.name + '</div>';
    el.addEventListener('click', function(){
      el.classList.add('opening');
      sfx('openapp');
      showView(a.id, el);
      setTimeout(() => el.classList.remove('opening'), 320);
    });
    g.appendChild(el);
  });
}

/* ---------- 启动 ---------- */
async function boot(serverMode){
  buildHome();
  tickClock();
  if(serverMode){
    try{
      var px = await fetch('/ascii/plan.json', {cache:'no-store'}).then(x => x.json()).catch(() => null);
      if(px){ PLAN = px.plan; PLACES = px.places; }
      var raw = await fetch('/saku_word.json', {cache:'no-store'}).then(x => x.json()).catch(() => null);
      if(raw && window.Saku){
        RAW = raw;
        var g = Saku.feed(WORLD_START, new Date(), raw);
        DATA = { days: g.days, bornAt: g.bornAt, total: g.total,
                 emoByDay: (Saku.emoByDay ? Saku.emoByDay() : {}) || {},
                 meta: '共 ' + g.total + ' 条记录，从 ' + g.bornAt + ' 开始。' };
      }
      setInterval(function(){
        try{
          if(!RAW || !window.Saku) return;
          pushMoodToGame();
          var g2 = Saku.feed(WORLD_START, new Date(), RAW);
          DATA.days = g2.days; DATA.total = g2.total;
          if(VIEW === 'now' || VIEW === 'archive'){
            if(VIEW === 'diary') renderDiary();
          }
        }catch(e){}
      }, 60000);
    }catch(e){}
    $('gate').classList.add('hide');
    $('home').classList.remove('hide');
    return;
  }
  // 加密模式
  async function tryOpen(password, remember){
    $('err').textContent = '';
    $('go').textContent = '解密中…';
    try{
      window.__SAKU_PW = password;
      var d = await decryptJSON(password, window.SAKU_ENC);
      if(window.SAKU_ASCII_ENC){
        try{
          var px = await decryptJSON(password, window.SAKU_ASCII_ENC);
          PLAN = px.plan; PLACES = px.places;
        }catch(e2){}
      }
      if(remember){ try{ localStorage.setItem(STORE_KEY, password); }catch(e){} }
      RAW = d;
      if(window.SAKU_ENGINE_ENC){
        try{
          var engTxt = await decryptRaw(password, window.SAKU_ENGINE_ENC);
          (new Function(engTxt))();
        }catch(e0){}
      }
      if(!window.Saku) throw new Error('引擎没有加载');
      var fresh = Saku.feed(WORLD_START, new Date(), d);
      var emoMap = (Saku.emoByDay ? Saku.emoByDay() : {}) || {};
      DATA = { days: fresh.days, bornAt: fresh.bornAt, total: fresh.total, emoByDay: emoMap,
               meta: '共 ' + fresh.total + ' 条记录，从 ' + fresh.bornAt + ' 开始。' };
      $('gate').classList.add('hide');
      $('home').classList.remove('hide');
      tickClock();
      if(!window.__sakuTick){
        window.__sakuTick = setInterval(function(){
          try{
            if(!RAW || !window.Saku) return;
            pushMoodToGame();      // 情绪变了就立刻反映到桌游的色调与音效上
            var g2 = Saku.feed(WORLD_START, new Date(), RAW);
            DATA.days = g2.days; DATA.total = g2.total;
            DATA.emoByDay = (Saku.emoByDay ? Saku.emoByDay() : {}) || {};
            if(VIEW === 'diary') renderDiary();
          }catch(e){}
        }, 60000);
      }
    }catch(e){
      var msg = (e && e.message) ? e.message : String(e);
      // 解密本身失败（AEAD 校验不过）才是密码错；其它错照实说
      var isPw = /decrypt|OperationError|DataError|tag|unable to authenticate/i.test(msg);
      $('err').textContent = isPw ? '密码不对，或者数据已损坏' : ('出错了：' + msg);
      $('go').textContent = '进入';
      if(isPw){ try{ localStorage.removeItem(STORE_KEY); }catch(e2){} }
      if(window.console) console.error('[saku] 打开失败', e);
    }
  }
  $('go').addEventListener('click', function(){ tryOpen($('pw').value, true); });
  $('pw').addEventListener('keydown', function(e){ if(e.key === 'Enter') tryOpen($('pw').value, true); });
  var saved = null;
  try{ saved = localStorage.getItem(STORE_KEY); }catch(e){}
  if(saved) tryOpen(saved, false); else $('pw').focus();
}

$('viewBack').addEventListener('click', closeView);
document.addEventListener('keydown', function(e){ if(e.key === 'Escape' && VIEW) closeView(); });

/* 左边缘右滑返回 */
(function(){
  var x0 = 0, y0 = 0, tracking = false;
  document.addEventListener('touchstart', function(e){
    if(!VIEW) return;
    var t = e.touches[0];
    if(t.clientX < 24){ tracking = true; x0 = t.clientX; y0 = t.clientY; }
  }, {passive:true});
  document.addEventListener('touchmove', function(e){
    if(!tracking) return;
    var t = e.touches[0];
    if(Math.abs(t.clientY - y0) > 60) tracking = false;
  }, {passive:true});
  document.addEventListener('touchend', function(e){
    if(!tracking) return;
    tracking = false;
    var t = e.changedTouches[0];
    if(t.clientX - x0 > 70 && Math.abs(t.clientY - y0) < 70) closeView();
  }, {passive:true});
})();

/* 壁纸初始化 */
applyWall();
/* 桌游结果桥 */
bindBridge();
/* ---------- 构建自检 ----------
   手机上最常见的情况是「我改了，你还开着旧页面」。回到前台时问一次服务器，
   版本对不上就在顶端浮一条，点一下直接刷新；取不到（离线 / 单文件 / 部署版没这文件）就安静待着。 */
function buildHide(){ var p = $('buildPill'); if(p) p.classList.remove('on'); }
function buildShow(v){
  var p = $('buildPill');
  if(!p) return;
  p.textContent = '页面是旧的（' + String(v).replace(/[^\w:.\- ·]/g, '') + '）· 点我刷新';
  p.classList.add('on');
}
function buildCheck(){
  if(APP_BUILD.charAt(0) === '_') return;         // 模板没被构建过（直接开 home.html）→ 不检查
  var url = (IS_DEPLOY ? 'build.json' : '/build.json') + '?t=' + Date.now();
  fetch(url, {cache:'no-store'})
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(j){
      if(!j || !j.build) return;
      if(String(j.build) === String(APP_BUILD)) buildHide(); else buildShow(j.build);
    })
    .catch(function(){});
}
(function(){
  var p = $('buildPill');
  if(p) p.addEventListener('click', function(){ location.reload(); });
  setTimeout(buildCheck, 1200);
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) buildCheck(); });
  window.addEventListener('focus', buildCheck);
  setInterval(buildCheck, 5 * 60 * 1000);
})();

boot(IS_DEPLOY ? false : true);
</script>
