<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#080b14">
<title>朔</title>
<style>
:root{
  --bg:#080b14; --card:#141a2a; --card2:#1b2338; --line:rgba(255,255,255,.09);
  --fg:#e8eef9; --dim:#8695b0; --dim2:#5a6880; --accent:#c9b98f;
  --red:#c0706a; --green:#7fc79a; --blue:#6fa8dc;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bot:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{
  background:
    radial-gradient(130% 80% at 80% -10%, #1c2a47 0%, rgba(28,42,71,0) 55%),
    radial-gradient(100% 60% at 8% 8%, #16203a 0%, rgba(22,32,58,0) 60%),
    var(--bg);
  color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  font-size:15px; line-height:1.75;
  -webkit-font-smoothing:antialiased;
}
.hide{display:none !important}

/* ================= 密码门 ================= */
#gate{
  position:fixed; inset:0; z-index:200; display:flex; flex-direction:column;
  align-items:center; justify-content:center; text-align:center; padding:24px;
  background:linear-gradient(180deg,#0a0e18,#070a12);
}
#gate .moon{width:58px;height:58px;margin-bottom:16px;opacity:.9}
#gate h1{font-size:26px;margin:0;letter-spacing:8px;font-weight:600}
#gate p{color:var(--dim2);font-size:12.5px;letter-spacing:1px;margin:10px 0 24px}
#gate input{
  width:100%;max-width:300px;padding:14px 16px;border-radius:13px;
  border:1px solid var(--line);background:rgba(255,255,255,.045);color:var(--fg);
  font-size:16px;font-family:inherit;outline:none;text-align:center;letter-spacing:1px;
}
#gate input:focus{border-color:rgba(201,185,143,.5);background:rgba(255,255,255,.07)}
#gate button{
  margin-top:13px;width:100%;max-width:300px;padding:14px;border-radius:13px;
  border:1px solid rgba(201,185,143,.35);background:rgba(201,185,143,.13);
  color:#e8dcb4;font-size:15.5px;font-family:inherit;font-weight:600;cursor:pointer;
}
#gate button:active{transform:scale(.985);background:rgba(201,185,143,.2)}
#gate .err{color:#f0a0a0;font-size:12.5px;margin-top:13px;min-height:18px}
#gate .tip{color:var(--dim2);font-size:11.5px;margin-top:18px;line-height:1.9;max-width:300px}

/* ================= 桌面 ================= */
#home{
  position:fixed; inset:0; display:flex; flex-direction:column;
  padding:calc(var(--safe-top) + 14px) 20px calc(var(--safe-bot) + 14px);
  transition:opacity .3s, transform .34s cubic-bezier(.3,.9,.3,1), filter .3s;
}
#home.push{opacity:0; transform:scale(.94); filter:blur(3px)}

/* 状态栏 */
.statusbar{display:flex; align-items:flex-end; gap:12px; margin-bottom:26px}
.statusbar .clockbig{
  font-size:44px; font-weight:300; letter-spacing:1px; line-height:1;
  font-variant-numeric:tabular-nums; color:#f2f6ff;
}
.statusbar .right{margin-left:auto; text-align:right}
.statusbar .date{font-size:12px; color:var(--dim); letter-spacing:.5px}
.statusbar .where{
  font-size:12px; color:var(--accent); margin-top:3px; letter-spacing:.5px;
  display:flex; align-items:center; gap:5px; justify-content:flex-end;
}
.dot{width:6px;height:6px;border-radius:50%;background:#7dd3fc;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

/* 图标色调：只做极淡的色相偏移，主体仍是毛玻璃 */
.app[data-app="diary"] .ico{background:rgba(190,170,235,.16)}
.app[data-app="calendar"] .ico{background:rgba(180,205,240,.15)}
.app[data-app="game"] .ico{background:rgba(240,180,150,.15)}
.app[data-app="wall"] .ico{background:rgba(150,220,210,.14)}
.app[data-app="about"] .ico{background:rgba(200,200,215,.13)}

/* 图标网格 */
.grid{
  display:grid; gap:22px 16px;
  grid-template-columns:repeat(auto-fill,minmax(78px,1fr));
  align-content:start;
}
.app{
  display:flex; flex-direction:column; align-items:center; gap:8px;
  cursor:pointer; user-select:none;
  transition:transform .16s cubic-bezier(.3,1.4,.5,1), opacity .3s;
}
.app:active{transform:scale(.9)}
.app.zooming{opacity:0}
.app .ico{
  width:62px;height:62px;border-radius:19px;
  display:flex;align-items:center;justify-content:center;
  font-size:26px; line-height:1; font-weight:300;
  color:#f4f8ff;
  border:1px solid rgba(255,255,255,.22);
  background:rgba(255,255,255,.10);
  -webkit-backdrop-filter:blur(10px) saturate(150%);
  backdrop-filter:blur(10px) saturate(150%);
  box-shadow:
    0 4px 14px rgba(0,0,0,.28),
    inset 0 1px 0 rgba(255,255,255,.26),
    inset 0 -1px 0 rgba(255,255,255,.06);
  text-shadow:0 1px 6px rgba(0,0,0,.5);
  transition:transform .22s cubic-bezier(.3,1.5,.5,1), box-shadow .22s, background .22s;
}
.app.opening .ico{transform:scale(1.18); background:rgba(255,255,255,.2);
  box-shadow:0 10px 26px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.34)}
.app .nm{font-size:11.5px; color:rgba(232,238,249,.82); letter-spacing:.5px; white-space:nowrap;
  text-shadow:0 1px 4px rgba(0,0,0,.6)}

/* ---------- 桌面壁纸 ---------- */
#wallpaper{
  position:fixed; inset:0; z-index:-1; background-size:cover; background-position:center;
  opacity:0; transition:opacity .5s;
}
#wallpaper.on{opacity:1}
#home .veil{
  position:fixed; inset:0; z-index:-1; pointer-events:none;
  background:linear-gradient(180deg,rgba(6,9,16,.62),rgba(6,9,16,.34) 42%,rgba(6,9,16,.72));
  opacity:0; transition:opacity .5s;
}
#home .veil.on{opacity:1}

/* 壁纸视图内的控件 */
.wpick{
  display:block; width:100%; border:2px dashed rgba(201,185,143,.4); border-radius:15px;
  padding:26px 16px; text-align:center; cursor:pointer; background:rgba(255,255,255,.03);
  font-size:15px; color:var(--accent); margin-bottom:12px;
}
.wpick:active{background:rgba(255,255,255,.08)}
.wpick input{display:none}
.wprev{
  width:100%; border-radius:15px; border:1px solid var(--line);
  max-height:52vh; object-fit:cover; display:block; margin-bottom:12px; background:#0c1018;
}
.wbtns{display:flex; gap:9px; flex-wrap:wrap}
.wbtns button{
  flex:1 1 120px; border:1px solid var(--line); background:rgba(255,255,255,.05);
  color:var(--fg); font-family:inherit; font-size:14px; border-radius:11px;
  padding:11px 14px; cursor:pointer;
}
.wbtns button.pri{border-color:rgba(201,185,143,.42); background:rgba(201,185,143,.15); color:#e8dcb4; font-weight:600}
.wbtns button.dan{border-color:rgba(192,112,106,.5); color:#e0a09a}
.wbtns button:active{transform:scale(.97)}
.app .badge{
  position:absolute; margin:-42px 0 0 44px; min-width:17px; height:17px; padding:0 4px;
  border-radius:9px; background:var(--red); color:#fff; font-size:10.5px;
  display:flex; align-items:center; justify-content:center; line-height:1;
}

/* Dock */
.dock{
  margin-top:auto; display:flex; justify-content:center; gap:8px; padding-top:18px;
}
.dock i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.25)}
.dock i.on{background:rgba(255,255,255,.6)}

/* ================= App 视图 ================= */
#viewHost{
  position:fixed; inset:0; z-index:100; display:flex; flex-direction:column;
  background:
    radial-gradient(120% 70% at 80% -8%, #1a2743 0%, rgba(26,39,67,0) 55%),
    var(--bg);
  opacity:0; transform:scale(.9); pointer-events:none;
  transition:opacity .26s ease, transform .34s cubic-bezier(.2,.9,.25,1);
  transform-origin:50% 50%;
}
#viewHost.on{opacity:1; transform:scale(1); pointer-events:auto}
.view-bar{
  display:flex; align-items:center; gap:12px; flex:0 0 auto;
  padding:calc(var(--safe-top) + 12px) 16px 12px;
  border-bottom:1px solid var(--line);
  background:rgba(10,14,24,.72); backdrop-filter:blur(12px);
}
.view-bar .back{
  border:1px solid var(--line); background:rgba(255,255,255,.05); color:var(--fg);
  font-size:13.5px; font-family:inherit; border-radius:999px; padding:6px 14px; cursor:pointer;
}
.view-bar .back:active{background:rgba(255,255,255,.12)}
.view-bar .vt{font-size:15px; letter-spacing:2px; color:var(--accent); font-weight:600}
.view-body{
  position:relative; flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch;
  padding:18px 18px calc(var(--safe-bot) + 40px);
}
.view-body.short{overflow:hidden; padding:0}

/* 视图内元素 */
.card{
  border:1px solid var(--line); border-radius:15px; padding:16px;
  background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.015));
  margin-bottom:14px;
}
.card.hl{
  border-color:rgba(201,185,143,.3);
  background:linear-gradient(180deg,rgba(201,185,143,.11),rgba(201,185,143,.025));
}
.card h3{margin:0 0 10px; font-size:13px; letter-spacing:2px; color:var(--accent); font-weight:600}
.card .big{font-size:22px; font-weight:600; color:#f2ecdc; letter-spacing:1px; margin-bottom:4px}
.card .sub{font-size:12.5px; color:var(--dim2)}
.card p{margin:8px 0; font-size:14px; color:#dfe6f2}

ul.items{list-style:none;margin:0;padding:0}
ul.items li{display:flex;gap:14px;padding:11px 0;border-top:1px solid rgba(255,255,255,.055)}
ul.items li:first-child{border-top:none}
ul.items .t{flex:0 0 44px;color:#9d8f68;font-size:12.5px;font-variant-numeric:tabular-nums;padding-top:3px}
ul.items .x{margin:0;flex:1;color:#dfe6f2;font-size:14.5px}
ul.items li.night .x{color:#b9c5d8}

.day{margin-bottom:9px;border:1px solid var(--line);border-radius:13px;overflow:hidden;
     background:rgba(255,255,255,.02)}
.dayhead{display:flex;align-items:center;gap:10px;cursor:pointer;
         padding:13px 15px;font-size:13.5px;color:var(--dim);user-select:none}
.dayhead .arrow{color:var(--dim2);font-size:10px;transition:transform .22s}
.day.open .dayhead .arrow{transform:rotate(90deg)}
.day.open .dayhead{color:var(--accent)}
.dayhead .tag{font-size:11px;color:var(--accent);border:1px solid rgba(201,185,143,.3);
              border-radius:999px;padding:1px 8px}
.dayhead .n{margin-left:auto;color:var(--dim2);font-size:12px}
.day ul.items{display:none;padding:0 15px 8px}
.day.open ul.items{display:block}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{font-size:12px;color:var(--dim);border:1px solid var(--line);
      padding:5px 11px;border-radius:999px;background:rgba(255,255,255,.025)}

/* 桌游视图 */
.game-shell{position:absolute; inset:0; display:flex; flex-direction:column; z-index:1}
.game-frame{flex:1; width:100%; border:0; background:#2e2822; display:block}

/* 返回按钮：足够显眼、可点、永远压在内容上面 */
.view-bar{position:relative; z-index:20}
.view-bar .back{
  border:1px solid rgba(201,185,143,.42) !important;
  background:rgba(201,185,143,.14) !important;
  color:#e8dcb4 !important;
  font-weight:600; padding:8px 18px !important;
  box-shadow:0 2px 10px rgba(0,0,0,.35);
}
.view-bar .back:active{transform:scale(.96); background:rgba(201,185,143,.26) !important}
/* 左边缘右滑返回的提示条 */
.edge{
  position:fixed; left:0; top:0; bottom:0; width:18px; z-index:25;
  touch-action:pan-y;
}


/* ============================================================
   日历 · 心象轨迹（莫兰迪 · 极暗灰蓝）
   ============================================================ */
.cal-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.cal-head .ym{font-size:16.5px;letter-spacing:2px;color:#cfc6b0;font-weight:600}
.cal-head .sp{flex:1}
.cal-nav{border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);
  color:#9fb0c8;font-family:inherit;font-size:16px;line-height:1;
  border-radius:11px;width:36px;height:36px;display:flex;align-items:center;
  justify-content:center;cursor:pointer;transition:background .16s}
.cal-nav:active{background:rgba(255,255,255,.13)}
.cal-week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;font-size:11px;
  color:#5f6b80;text-align:center;margin-bottom:8px;letter-spacing:1.5px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;
  padding:10px;border-radius:16px;
  background:
    radial-gradient(rgba(255,255,255,.028) 1px, transparent 1px),
    linear-gradient(180deg,#1a1e26,#161a21);
  background-size:3px 3px, 100% 100%;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05), 0 6px 20px rgba(0,0,0,.35)}
.dcell{
  position:relative;aspect-ratio:1/1;border-radius:11px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  background:rgba(255,255,255,.022);
  box-shadow:inset 0 1px 2px rgba(0,0,0,.45), inset 0 -1px 0 rgba(255,255,255,.035);
  font-size:14.5px;color:#66738a;cursor:default;
  transition:transform .14s, background .18s, box-shadow .18s;
}
.dcell.empty{background:transparent;box-shadow:none}
.dcell.has{background:rgba(159,176,200,.09);color:#cfd8e6;cursor:pointer}
.dcell.has:active{transform:scale(.92);background:rgba(159,176,200,.18)}
.dcell.today{box-shadow:inset 0 0 0 1.5px rgba(125,211,252,.55), inset 0 1px 2px rgba(0,0,0,.45)}
.dcell.sel{background:rgba(201,185,143,.22);box-shadow:inset 0 0 0 1.5px rgba(201,185,143,.7)}
.dcell.holiday .dnum{color:#c9a95e;text-shadow:0 0 8px rgba(201,169,94,.4)}
.dcell.holiday{box-shadow:inset 0 0 0 1.2px rgba(201,169,94,.42), inset 0 1px 2px rgba(0,0,0,.45)}
.dcell .dnum{line-height:1;font-variant-numeric:tabular-nums}
.dcell .dmoon2{font-size:9.5px;line-height:1;opacity:.9}
.dcell .dlock{position:absolute;top:2px;right:3px;font-size:8.5px;opacity:.85}
.dcell .dgame{position:absolute;bottom:1px;right:3px;font-size:8px;color:#c9a95e;opacity:.9}
.cal-legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;font-size:10.5px;color:#5f6b80}
.cal-legend span{white-space:nowrap}
.cal-tip{text-align:center;color:#4e596b;font-size:12px;padding:14px 0 4px;letter-spacing:.5px}

/* ---------- 底部抽屉 ---------- */
.sheet{position:fixed;inset:0;z-index:180;pointer-events:none}
.sheet.on{pointer-events:auto}
.sheet-mask{position:absolute;inset:0;background:rgba(3,5,9,.66);
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
  opacity:0;transition:opacity .28s}
.sheet.on .sheet-mask{opacity:1}
.sheet-box{
  position:absolute;left:0;right:0;bottom:0;height:60vh;min-height:380px;
  display:flex;flex-direction:column;border-radius:22px 22px 0 0;
  background:
    radial-gradient(rgba(120,100,70,.05) 1px, transparent 1px),
    linear-gradient(180deg,#f0e6d2,#e4d8be);
  background-size:3px 3px, 100% 100%;
  border-top:2px solid rgba(91,70,50,.5);
  box-shadow:0 -14px 50px rgba(0,0,0,.6);
  transform:translateY(100%);
  transition:transform .34s cubic-bezier(.2,.9,.25,1);
  color:#2b2117;
}
.sheet.on .sheet-box{transform:translateY(0)}
.sheet-grab{width:42px;height:4px;border-radius:2px;background:rgba(91,70,50,.32);margin:9px auto 0;flex:0 0 auto}
.sheet-head{display:flex;align-items:baseline;gap:10px;flex:0 0 auto;padding:10px 18px 12px;
  border-bottom:1px solid rgba(91,70,50,.22)}
.sh-l{display:flex;align-items:baseline;gap:9px;flex:1;min-width:0;flex-wrap:wrap}
.sh-d{font-family:"Songti SC","STSong",Georgia,serif;font-size:20px;letter-spacing:1.5px;color:#2b2117;font-weight:600}
.sh-w{font-size:12px;color:#7a6a52}
.sh-wx{font-size:12px;color:#8a6d16;display:flex;align-items:center;gap:4px;margin-left:auto}
.sh-wx .wxm{font-size:15px}
.sh-x{border:1px solid rgba(91,70,50,.35);background:rgba(255,255,255,.5);color:#5b4632;
  font-family:inherit;font-size:12.5px;border-radius:999px;padding:5px 14px;cursor:pointer}
.sh-x:active{background:rgba(255,255,255,.85)}
.sheet-body{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:14px 16px calc(var(--safe-bot) + 26px)}
.sh-empty{color:#8b7355;font-size:13.5px;text-align:center;padding:30px 0}
/* 轨迹概要 */
.traj{display:flex;gap:9px;align-items:flex-start;padding:10px 12px;border-radius:11px;
  background:rgba(91,70,50,.09);border:1px dashed rgba(91,70,50,.3);margin-bottom:14px}
.traj .tj-l{flex:0 0 auto;font-size:11.5px;color:#8b7355;padding-top:2px}
.traj .tj-v{flex:1;font-size:12.5px;color:#4a3f2c;line-height:1.8;word-break:break-all}
.traj .tj-v i{font-style:normal;color:#a8874a;margin:0 3px}
/* 时间轴 */
.tl-wrap{position:relative}
.tl{position:relative;display:flex;gap:12px;padding-bottom:12px}
.tl:last-child{padding-bottom:2px}
.tl-t{flex:0 0 44px;font-size:12px;color:#9d8f68;font-variant-numeric:tabular-nums;
  padding-top:9px;text-align:right;letter-spacing:.3px}
.tl-dot{flex:0 0 9px;width:9px;height:9px;border-radius:50%;margin-top:12px;
  background:rgba(139,115,85,.55);box-shadow:0 0 0 3px rgba(139,115,85,.14);position:relative}
.tl-dot::after{content:"";position:absolute;left:50%;top:14px;width:1px;height:calc(100% + 14px);
  background:linear-gradient(180deg,rgba(139,115,85,.3),rgba(139,115,85,.03));transform:translateX(-50%)}
.tl:last-child .tl-dot::after{display:none}
.tl-card{flex:1;min-width:0;font-family:"Songti SC","STSong",Georgia,serif;
  font-size:14.5px;line-height:1.85;color:#332a1c;
  background:rgba(255,255,255,.62);border:1px solid rgba(91,70,50,.18);
  border-radius:11px;padding:9px 13px;box-shadow:0 1px 3px rgba(91,70,50,.1)}
.tl-night .tl-card{background:rgba(214,222,238,.5);color:#39415a;border-color:rgba(90,110,150,.2)}
.tl-night .tl-dot{background:rgba(110,130,175,.6);box-shadow:0 0 0 3px rgba(110,130,175,.14)}
/* 崩溃时段：深底 + 细红线 */
.tl-intense .tl-card{background:rgba(60,50,44,.9);color:#e8e0d0;
  border-color:rgba(168,57,44,.45);box-shadow:0 0 0 1px rgba(168,57,44,.22), 0 2px 8px rgba(0,0,0,.3)}
.tl-intense .tl-dot{background:#a8392c;box-shadow:0 0 0 3px rgba(168,57,44,.2)}
.tl-secret .tl-card{background:rgba(70,58,84,.86);color:#e6dcf0;border-color:rgba(150,120,190,.4)}
.tl-secret .tl-dot{background:#8a6fb0;box-shadow:0 0 0 3px rgba(138,111,176,.2)}

/* ---------- 墨迹与长按解锁 ---------- */
.lockbar{position:relative;display:flex;align-items:center;gap:9px;cursor:pointer;
  padding:3px 0;color:#b7a6d4;font-size:12.5px;letter-spacing:.5px;
  -webkit-user-select:none;user-select:none;touch-action:none;
  --p:0%}
.lockbar::after{content:"";position:absolute;left:0;bottom:0;height:2px;width:var(--p);
  background:linear-gradient(90deg,#8a6fb0,#c9a3e0);border-radius:2px;transition:width .06s linear}
.lockbar .lk{font-size:14px}
.lockbar .lkt{flex:1}
.lockbar .lkh{font-size:11px;color:rgba(200,180,225,.7)}
.lockbar.holding{color:#e0cdf5}
.lockbar.opened{opacity:0;transition:opacity .4s}
.ink{
  position:relative;font-size:14px;line-height:1.85;color:transparent;
  border-radius:6px;overflow:hidden;min-height:1.6em;
}
.ink .ink-t{
  filter:blur(9px);opacity:.55;color:#c8bde0;
  transition:filter .8s cubic-bezier(.2,.9,.3,1), opacity .8s, color .8s;
}
.ink::before{
  content:"";position:absolute;inset:-2px;border-radius:8px;pointer-events:none;
  background:
    radial-gradient(60% 80% at 25% 40%, rgba(150,120,190,.5), transparent 70%),
    radial-gradient(50% 70% at 70% 60%, rgba(110,90,150,.45), transparent 70%),
    radial-gradient(70% 60% at 45% 80%, rgba(90,75,130,.4), transparent 72%);
  filter:blur(6px);opacity:.85;

function sheetEl(){
  var el = document.getElementById('sheet');
  if(el) return el;
  el = document.createElement('div');

  el.className = 'sheet';
  el.innerHTML = '<div class="sheet-mask" id="sheetMask"></div>'
    + '<div class="sheet-box" id="sheetBox">'
    + '<div class="sheet-grab"></div>'
    + '<div class="sheet-head"><div class="sh-l"><span class="sh-d" id="shD"></span>'
    + '<span class="sh-w" id="shW"></span></div>'
    + '<button class="sh-x" id="shX">关上</button></div>'
    + '<div class="sheet-body" id="sheetBody"></div>'
    + '</div>';
  document.body.appendChild(el);
  el.querySelector('#sheetMask').onclick = closeSheet;
  el.querySelector('#shX').onclick = closeSheet;
  return el;
}
function closeSheet(){
  var el = document.getElementById('sheet');
  if(!el) return;
  el.classList.remove('on');
  sfx('closeapp');
  setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, 260);
  CAL_SEL = null;
}

/* 私密记录：深夜的隐秘念头 / 身体感受 —— 默认上锁 */
const PRIVATE_RE = /腿夹紧|身体莫名|洗澡时她不敢|羞耻|隐秘|那一小块皮肤|指尖擦过腰|对着镜子看很久|不敢多看|想被抱住|渴望|皮肤的|半夜里|深夜身体|对自己身体|某种意志/;
function isPrivate(t){ return PRIVATE_RE.test(t); }

function tlItems(items){
  return items.map(function(it, i){
    var h = parseInt(it.time.slice(0,2),10);
    var night = (h < 6 || h >= 22);
    var priv = isPrivate(it.text);
    return '<div class="tl' + (night ? ' tl-night' : '') + (priv ? ' tl-priv' : '') + '">'
      + '<div class="tl-t">' + it.time + '</div>'
      + '<div class="tl-dot"></div>'
      + '<div class="tl-card">'
        + (priv
            ? '<div class="lockbar" data-unlock="' + i + '"><span class="lk">🔒</span>'
              + '<span class="lkt">这一段她锁起来了</span><span class="lkh">点一下打开</span></div>'
              + '<div class="locked-text" data-text="' + i + '">' + it.text + '</div>'
            : it.text)
      + '</div></div>';
  }).join('');
}
function bindLocks(root){
  if(!root) return;
  root.querySelectorAll('.lockbar').forEach(function(b){
    b.onclick = function(){
      var i = b.dataset.unlock;
      var t = root.querySelector('[data-text="' + i + '"]');
      if(t){ t.classList.add('on'); b.classList.add('opened'); sfx('coin'); }
      setTimeout(function(){ b.style.display = 'none'; }, 320);
    };
  });
}
function openDaySheet(key, rec){

  var dt = new Date(key + 'T12:00:00');
  $('shD').textContent = (+key.slice(5,7)) + ' 月 ' + (+key.slice(8,10)) + ' 日';
  var lab = fmtDay(key);
  $('shW').textContent = (rec && rec.weekday ? rec.weekday : '')
    + (lab.tag ? ' · ' + lab.tag : '')
    + (rec && rec.items.length ? ' · ' + rec.items.length + ' 条' : '');
  var body = $('sheetBody');
  var html = '';
  if(rec && rec.items.length){
    html += '<div class="tl-wrap">' + tlItems(rec.items) + '</div>';
  } else {
    html += '<div class="sh-empty">这一天她没有留下记录。</div>';
  }
  if(rec && rec.extra && rec.extra.length) html += extraBlock(rec.extra);
  body.innerHTML = html;
  bindLocks(body);
  (function(){
    var el = $('dmoon'); if(!el) return;
    var lv = 'calm', pd = false;
    try{
      var em = (window.__SAKU_EMO_BY_DAY || {})[day.date];
      if(em){ lv = em.level; pd = !!em.period; }
    }catch(e){}
    var m = moonOf(lv, pd);
    el.innerHTML = '<span class="mg">' + m.g + '</span>' + m.cn;
  })();

  el.classList.add('on');
  sfx('openapp');

/* ---------- 界外记录板块 ---------- */
function pickBySeed(arr, seed){ return arr[Math.abs(seed) % arr.length]; }
function extraBlock(list){
  if(!list || !list.length) return '';
  var rows = list.map(function(r){
    var isReb = (r.outcome === 'rebuild');
    var t = isReb ? REBUILD_TEXT : (OUTCOME_TEXT[r.outcome] || OUTCOME_TEXT.quit);
    var txt = pickBySeed(t, (r.at || 0) % 997);
    var icon = OUTCOME_ICON[r.outcome] || '…';
    var cn = OUTCOME_CN[r.outcome] || '';
    var detail = isReb
      ? '用了构筑权 · 她改了开局'
      : ('第 ' + (r.turns||'?') + ' 回合 · 深渊 ' + (r.abyss != null ? r.abyss : '?') + '/12'
         + (r.turnLimit ? '（上限 ' + r.turnLimit + '）' : ''));
    return '<li class="xr xr-' + (r.outcome||'quit') + '">'
      + '<span class="xt">' + (r.time || '--:--') + '</span>'
      + '<span class="xx">'
        + '<b><i class="xi">' + icon + '</i>' + cn + '</b>'
        + '<span class="xd">' + txt + '</span>'
        + '<span class="xm">' + detail + '</span>'
      + '</span></li>';
  }).join('');
  return '<div class="xblock">'
    + '<div class="xh"><span class="xo">⚄</span>界外记录'
    + '<span class="xnote">发生在梦里，不属于这一天的主线</span></div>'
    + '<ul class="xlist">' + rows + '</ul></div>';
}

<script>
/* =====================================================================
   朔 · 观察窗口（手机桌面风格）
   ===================================================================== */
const $ = id => document.getElementById(id);
const IS_DEPLOY = true;
const STORE_KEY = 'saku_pw';
const WORLD_START = {
  date:  new Date(2026, 8, 19, 0, 0, 0),
  anchor:new Date(2026, 8, 8, 0, 0, 0),
  seed:  20260919
};

const APPS = [
  {id:'calendar',ico:'▦', name:'日历'},
  {id:'game',    ico:'⚄', name:'桌游'},
  {id:'diary',   ico:'✎', name:'日记'},
  {id:'wall',    ico:'▧', name:'壁纸'},
  {id:'about',   ico:'◌', name:'关于'},
  {id:'dev',     ico:'⚙', name:'开发者', hidden:true},
];

let DATA = null, PLAN = null, PLACES = null, VIEW = null, clockSkew = 0, RAW = null;
let DATA_RAW = null;

/* ============================================================
   音频引擎：主总线 + 混响 + 多层合成，做出"游戏感"而不是哔哔声
   ============================================================ */
let ACTX = null, MASTER = null, REVERB = null, REV_GAIN = null, SFX_ON = true;

function actx(){
  if(!ACTX){
    try{
      ACTX = new (window.AudioContext || window.webkitAudioContext)();
      MASTER = ACTX.createGain(); MASTER.gain.value = 0.72; MASTER.connect(ACTX.destination);
      // 程序生成的混响脉冲（衰减噪声），营造空间感
      const sr = ACTX.sampleRate, len = Math.floor(sr * 1.6);
      const imp = ACTX.createBuffer(2, len, sr);
      for(let c = 0; c < 2; c++){
        const d = imp.getChannelData(c);
        for(let i = 0; i < len; i++){
          const t = i / len;
          d[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, 2.6) * (i < sr * 0.012 ? 0.35 : 1);
        }
      }
      REVERB = ACTX.createConvolver(); REVERB.buffer = imp;
      REV_GAIN = ACTX.createGain(); REV_GAIN.gain.value = 0.34;
      REVERB.connect(REV_GAIN); REV_GAIN.connect(MASTER);
    }catch(e){ ACTX = null; }
  }
  if(ACTX && ACTX.state === 'suspended') ACTX.resume();
  return ACTX;
}
/* 一个音符：可选滑音、滤波、声像、混响量 */
function note(o){
  const c = actx(); if(!c || !SFX_ON) return;
  const t0 = c.currentTime + (o.at || 0);
  const dur = o.dur || 0.2;
  const osc = c.createOscillator();
  osc.type = o.type || 'sine';
  osc.frequency.setValueAtTime(o.f, t0);
  if(o.to){ osc.frequency.exponentialRampToValueAtTime(Math.max(20, o.to), t0 + dur * (o.slide || 1)); }
  if(o.detune) osc.detune.setValueAtTime(o.detune, t0);
  const g = c.createGain();
  const peak = o.vol == null ? 0.16 : o.vol;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(peak, t0 + (o.att || 0.008));
  g.gain.exponentialRampToValueAtTime(peak * 0.42, t0 + dur * 0.35);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  let node = osc;
  if(o.lp){ const f = c.createBiquadFilter(); f.type = 'lowpass';
    f.frequency.setValueAtTime(o.lp, t0);
    if(o.lpTo) f.frequency.exponentialRampToValueAtTime(o.lpTo, t0 + dur);
    f.Q.value = o.q || 1; node.connect(f); node = f; }
  if(o.bp){ const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = o.bp; f.Q.value = o.bq || 3;
    node.connect(f); node = f; }
  const pan = c.createStereoPanner ? c.createStereoPanner() : null;
  if(pan){ pan.pan.value = o.pan || 0; node.connect(g); node = pan; node.connect(g); }
  else node.connect(g);
  g.connect(MASTER);
  if(o.rev){ const rg = c.createGain(); rg.gain.value = o.rev; g.connect(rg); rg.connect(REVERB); }
  osc.start(t0); osc.stop(t0 + dur + 0.05);
}
/* 噪声层：撞击/沙沙/爆炸 */
function noiseHit(o){
  const c = actx(); if(!c || !SFX_ON) return;
  const t0 = c.currentTime + (o.at || 0);
  const dur = o.dur || 0.2;
  const len = Math.floor(c.sampleRate * dur);
  const buf = c.createBuffer(1, len, c.sampleRate);
  const d = buf.getChannelData(0);
  for(let i = 0; i < len; i++){
    const t = i / len;
    d[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, o.decay || 2.2);
  }
  const src = c.createBufferSource(); src.buffer = buf;
  const f = c.createBiquadFilter();
  f.type = o.type || 'highpass';
  f.frequency.setValueAtTime(o.f || 900, t0);
  if(o.fTo) f.frequency.exponentialRampToValueAtTime(Math.max(60, o.fTo), t0 + dur);
  f.Q.value = o.q || 1;
  const g = c.createGain(); g.gain.value = o.vol == null ? 0.14 : o.vol;
  src.connect(f); f.connect(g); g.connect(MASTER);
  if(o.rev){ const rg = c.createGain(); rg.gain.value = o.rev; g.connect(rg); rg.connect(REVERB); }
  src.start(t0);
}
/* 低频冲击：打击感 */
function thump(freq, dur, vol, at){
  note({ f:freq, to:freq*0.42, dur:dur, type:'sine', vol:vol, att:0.004, at:at||0, lp:420 });
}
const SCALE = [0, 2, 4, 7, 9];          // 大调五声
const nf = (semi, base) => (base || 523.25) * Math.pow(2, semi / 12);

const SFX_LAST = {};
const SFX_GAP = { openapp:260, closeapp:260, click:120, place:70, coin:90, advance:90, tick:40 };
function sfx(name){
  if(!SFX_ON) return;
  var now = performance.now();
  var gap = SFX_GAP[name] || 0;
  if(gap && SFX_LAST[name] && now - SFX_LAST[name] < gap) return;   // 连点不叠音
  SFX_LAST[name] = now;
  actx();
  switch(name){
    /* —— 骰子：木质碰撞 + 滚动沙沙 —— */
    case 'roll':
      for(let i = 0; i < 5; i++)
        noiseHit({ type:'bandpass', f: 1100 + i*380, dur:0.045, vol:0.09, at:i*0.055, bq:4 });
      note({ f:170, to:90, dur:0.16, type:'triangle', vol:0.10, lp:900 });
      break;
    case 'tick':
      noiseHit({ type:'bandpass', f: 2600 + Math.random()*1600, dur:0.022, vol:0.055, bq:6 });
      break;
    case 'land':                        // 骰子落定：木质叩击 + 余韵
      noiseHit({ type:'bandpass', f:2200, dur:0.05, vol:0.13, bq:3, rev:0.5 });
      note({ f:330, to:240, dur:0.20, type:'triangle', vol:0.13, lp:1800, rev:0.55 });
      note({ f:660, to:520, dur:0.16, type:'sine', vol:0.07, at:0.02, rev:0.5 });
      break;
    case 'place':                       // 放进房间：轻快双击（音量收敛）
      note({ f:nf(4,440), dur:0.10, type:'sine', vol:0.07, lp:2200, rev:0.25 });
      note({ f:nf(7,440), dur:0.15, type:'sine', vol:0.055, at:0.05, lp:2400, rev:0.35 });
      break;
    case 'discard':
      note({ f:260, to:140, dur:0.22, type:'sawtooth', vol:0.075, lp:1200, lpTo:400, rev:0.2 });
      noiseHit({ type:'lowpass', f:800, dur:0.12, vol:0.06 });
      break;
    /* —— 正向反馈：灵魂/碎片/遗物 —— */
    case 'coin':
      [0, 4, 7, 12].forEach((semi, i) => {
        note({ f:nf(semi, 880), dur:0.30, type:'triangle', vol:0.10, at:i*0.045, rev:0.6 });
      });
      noiseHit({ type:'highpass', f:5200, dur:0.08, vol:0.05, rev:0.4 });
      break;
    case 'relic':
      [0, 4, 7, 11, 14].forEach((semi, i) => {
        note({ f:nf(semi, 659.25), dur:0.7, type:'sine', vol:0.10, at:i*0.07, rev:0.85 });
        note({ f:nf(semi, 659.25)*2, dur:0.4, type:'triangle', vol:0.035, at:i*0.07, rev:0.7 });
      });
      break;
    case 'heal':
      note({ f:523.25, to:783.99, dur:0.42, type:'sine', vol:0.11, rev:0.7 });
      note({ f:783.99, dur:0.5, type:'sine', vol:0.07, at:0.14, rev:0.8 });
      break;
    /* —— 战斗 —— */
    case 'good':                        // 击破小怪：冲击 + 上扬和弦
      noiseHit({ type:'bandpass', f:1800, fTo:300, dur:0.30, vol:0.17, q:1.4, rev:0.55 });
      thump(120, 0.32, 0.20);
      [0, 4, 7, 12].forEach((semi, i) =>
        note({ f:nf(semi, 523.25), dur:0.5, type:'triangle', vol:0.10, at:i*0.055, rev:0.7 }));
      break;
    case 'hurt':                        // 受伤：闷击 + 下坠
      thump(95, 0.30, 0.24);
      noiseHit({ type:'lowpass', f:900, dur:0.20, vol:0.14 });
      note({ f:220, to:110, dur:0.36, type:'sawtooth', vol:0.10, lp:900, lpTo:260, rev:0.3 });
      break;
    case 'bad':
      [0, -2, -5].forEach((semi, i) =>
        note({ f:nf(semi, 392), dur:0.30, type:'triangle', vol:0.09, at:i*0.10, rev:0.45 }));
      break;
    case 'monster':                     // 小怪登场：低频咆哮 + 不和谐
      thump(58, 0.85, 0.26);
      thump(62, 0.75, 0.20, 0.06);

/* ---------- 工具 ---------- */
function pad(n){ return n < 10 ? '0' + n : '' + n; }
function b64buf(b64){
  var bin = atob(b64), len = bin.length, arr = new Uint8Array(len);
  for (var i = 0; i < len; i++) arr[i] = bin.charCodeAt(i);
  return arr;
}
async function decryptRaw(password, enc){
  var material = await crypto.subtle.importKey(
    'raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
  var key = await crypto.subtle.deriveKey(
    { name:'PBKDF2', salt: b64buf(enc.salt), iterations: 250000, hash:'SHA-256' },
    material, { name:'AES-GCM', length:256 }, false, ['decrypt']);
  var ct = b64buf(enc.ct), tag = b64buf(enc.tag);
  var joined = new Uint8Array(ct.length + tag.length);
  joined.set(ct, 0); joined.set(tag, ct.length);
  var plain = await crypto.subtle.decrypt({ name:'AES-GCM', iv: b64buf(enc.iv) }, key, joined);
  return new TextDecoder().decode(plain);
}
async function decryptJSON(password, enc){
  return JSON.parse(await decryptRaw(password, enc));
}

/* ---------- 安全读写 ---------- */
function extraLoad(){
  try{
    var raw = localStorage.getItem(EXTRA_KEY);
    if(!raw) return [];
    var arr = JSON.parse(raw);
    if(!Array.isArray(arr)) return [];
    // 逐条校验，坏数据直接丢掉，绝不让它把页面搞崩
    return arr.filter(function(r){
      return r && typeof r === 'object'
        && typeof r.date === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(r.date)
        && (OUTCOME_TEXT[r.outcome] || r.outcome === 'rebuild');
    });
  }catch(e){
    try{ localStorage.removeItem(EXTRA_KEY); }catch(e2){}
    return [];
  }
}
function extraSave(arr){
  try{
    // 按日期裁剪 + 每天限量
    var byDay = {};
    arr.forEach(function(r){ (byDay[r.date] = byDay[r.date] || []).push(r); });
    var days = Object.keys(byDay).sort().slice(-EXTRA_KEEP_DAYS);
    var out = [];
    days.forEach(function(d){
      var list = byDay[d].sort(function(a,b){ return (a.at||0) - (b.at||0); });
      out = out.concat(list.slice(-EXTRA_PER_DAY));
    });
    localStorage.setItem(EXTRA_KEY, JSON.stringify(out));
  }catch(e){}
}
function extraMerge(records){
  if(!records || !records.length) return 0;
  var arr = extraLoad();
  var have = {};
  arr.forEach(function(r){ have[(r.date||'') + '|' + (r.at||0)] = 1; });
  var add = 0;
  records.forEach(function(r){
    if(!r || typeof r !== 'object') return;
    if(!r.date || !OUTCOME_TEXT[r.outcome]) return;
    var k = r.date + '|' + (r.at || 0);
    if(have[k]) return;            // 去重，补发时不会重复写
    have[k] = 1; arr.push(r); add++;
  });
  if(add) extraSave(arr);
  return add;
}
function extraByDate(date){
  return extraLoad().filter(function(r){ return r.date === date; })
    .sort(function(a,b){ return (a.at||0) - (b.at||0); });
}

    // 只认自己那个 iframe 发来的
    var frame = document.getElementById('gameFrame');

    var payload = Array.isArray(d.payload) ? d.payload.slice() : [];
    // 用了构筑权的局，额外补一条「异世界回响」
    payload.forEach(function(r){

        payload.push({
          v: 1,
          at: (r.at || Date.now()) + 60000,      // 排在正记录后面
          date: r.date, time: r.time,
          outcome: 'rebuild',
          turns: r.turns, abyss: r.abyss, turnLimit: r.turnLimit,
        });

    });

/* ---------- 朔在哪 ---------- */
function placeAt(date){
  if(!PLAN || !PLACES) return null;
  var plan = (date.getDay() === 0 || date.getDay() === 6) ? PLAN.weekend : PLAN.weekday;
  if(!plan || !plan.length) return null;
  var m = date.getHours() * 60 + date.getMinutes();
  var hit = plan[plan.length - 1];
  for(var i = 0; i < plan.length; i++){
    var a = plan[i][0].split(':'), b = plan[i][1].split(':');
    if((+a[0])*60 + (+a[1]) <= m && m < (+b[0])*60 + (+b[1])){ hit = plan[i]; break; }
  }
  var p = PLACES[hit[2]] || ['bedroom', true, '卧室'];
  return { place:hit[2], scene:hit[3], act:hit[4], room:p[0], indoor:!!p[1], cn:p[2] };
}

function trajectoryOfItems(items){
  var seq = [], last = null;
  (items || []).forEach(function(it){
    for(var i = 0; i < PLACE_HINT.length; i++){
      if(PLACE_HINT[i][0].test(it.text)){
        var p = PLACE_HINT[i][1];
        if(p !== last){ seq.push(p); last = p; }
        break;
      }
    }
  });
  return seq.slice(0, 8);
}

/* ---------- 私密记录：长按 1.5 秒解锁 ---------- */
function bindLocks(root){
  if(!root) return;
  root.querySelectorAll('.lockbar').forEach(function(bar){
    var i = bar.dataset.lk;
    var ink = root.querySelector('[data-ink="' + i + '"]');
    var timer = null, prog = 0, raf = null;

    function startHold(){
      if(bar.classList.contains('opened')) return;
      bar.classList.add('holding');
      var t0 = Date.now();
      var tick = function(){
        prog = Math.min(1, (Date.now() - t0) / 1500);
        bar.style.setProperty('--p', (prog * 100).toFixed(0) + '%');
        if(prog >= 1){ done(); return; }
        raf = requestAnimationFrame(tick);
      };
      raf = requestAnimationFrame(tick);
    }
    function cancelHold(){
      if(raf) cancelAnimationFrame(raf);
      raf = null;
      if(!bar.classList.contains('opened')){
        bar.classList.remove('holding');
        bar.style.setProperty('--p', '0%');
      }
    }
    function done(){
      if(raf) cancelAnimationFrame(raf);
      bar.classList.add('opened');
      if(ink) ink.classList.add('on');
      try{ sfx('coin'); }catch(e){}
      setTimeout(function(){ bar.style.display = 'none'; }, 420);
    }
    bar.addEventListener('pointerdown', function(ev){ ev.preventDefault(); startHold(); });
    bar.addEventListener('pointerup', cancelHold);
    bar.addEventListener('pointerleave', cancelHold);
    bar.addEventListener('pointercancel', cancelHold);
    // 桌面端兜底：点一下也能开
    bar.addEventListener('click', function(ev){ if(ev.detail === 0) done(); });
  });
}

function slotOf(h){
  if(h < 6) return 'late';
  if(h < 8) return 'early';
  if(h < 11) return 'am';
  if(h < 13) return 'noon';
  if(h < 17) return 'pm';
  if(h < 19) return 'eve';
  if(h < 22) return 'night';
  return 'late';
}
function seedOf(str, salt){
  var h = 2166136261, x = str + '|' + (salt || '');
  for(var i = 0; i < x.length; i++){ h ^= x.charCodeAt(i); h = Math.imul(h, 16777619); }
  return (h >>> 0);
}
function pick(arr, seed){ return arr[seed % arr.length]; }
/* 天气：从当天文本里猜，猜不到就按日期给个稳定的 */
function guessWeather(day){
  var t = (day.items || []).map(function(i){ return i.text; }).join(' ');
  if(/雨/.test(t)) return '雨';
  if(/雪/.test(t)) return '雪';
  if(/雾|霾/.test(t)) return '雾';
  if(/阴|灰|云|沉/.test(t)) return '阴';
  if(/太阳|晒|阳光|暖|亮/.test(t)) return '晴';
  var arr = ['晴','阴','多云','小雨','晴','阴'];
  return arr[seedOf(day.date, 'wx') % arr.length];
}

/* ============================================================
   开发者测试模式：沙盒生成 + 分层来源追踪
   数据全在内存，不碰 localStorage
   ============================================================ */
let DEV = { days: [], n: 7, sel: null, showLayer: true };

const DEV_SCENES = ['sleep','wake','commute','school_am','lunch','school_noon','school_pm',
                    'commute_home','home_evening','study','night','wk_morning','wk_noon',
                    'wk_afternoon','wk_evening'];
const DEV_PLACE = {
  sleep:'卧室', wake:'卧室', commute:'街上', school_am:'教室', lunch:'食堂',
  school_noon:'图书室', school_pm:'教室', commute_home:'街上', home_evening:'厨房',
  study:'书桌前', night:'浴室', wk_morning:'厨房', wk_noon:'咖啡店',
  wk_afternoon:'公园', wk_evening:'天台',
};
/* 确定性 hash（不引入随机，保证同一批数据可复现） */
function devHash(a, b){
  var h = 2166136261, x = String(a) + '#' + String(b);
  for(var i = 0; i < x.length; i++){ h ^= x.charCodeAt(i); h = Math.imul(h, 16777619); }
  return (h >>> 0);
}
/* 带去重的抽取，并记录来源 */
function devPick(cfg){
  var pool = cfg.pool, used = cfg.used, tag = cfg.tag;
  if(!pool || !pool.length) return null;
  var cand = pool.filter(function(x){ return used.indexOf(x) < 0; });
  var reset = false;
  if(!cand.length){ cand = pool.slice(); reset = true; }
  var idx = devHash(cfg.seed, tag + cand.length) % cand.length;
  var text = cand[idx];
  used.push(text);
  return { text: text, layer: tag, size: pool.length, at: idx, reset: reset };
}

function devBuild(n){
  DEV.n = n; DEV.sel = null; DEV.days = [];
  if(!RAW || !RAW.scenes) return;
  var today = new Date();
  for(var i = n - 1; i >= 0; i--){
    var dt = new Date(today.getTime() - i * 86400000);
    var date = dt.getFullYear() + '-' + pad(dt.getMonth()+1) + '-' + pad(dt.getDate());
    var wk = dt.getDay() === 0 || dt.getDay() === 6;
    var used = [];
    var items = [];
    var seedBase = devHash(date, 'day');
    // 一天按 2 小时一格走
    for(var h = (wk ? 8 : 6); h <= 23; h += 2){
      var sc = devSceneFor(h, wk);
      var r = null;
      var roll = devHash(seedBase, 'r' + h) % 100;
      if(roll < 22 && RAW.BODY){
        r = devPick({ pool: (h >= 21 || h < 6) ? RAW.BODY.concat(RAW.BODY_NIGHT) : RAW.BODY,
                      used: used, tag: 'BODY', seed: seedBase + h });
      }
      if(!r && roll >= 88 && RAW.CYCLE){
        r = devPick({ pool: RAW.CYCLE, used: used, tag: 'CYCLE', seed: seedBase + h });
      }
      if(!r){
        var grp = RAW.scenes[sc] || RAW.scenes.bedroom;
        r = devPick({ pool: grp.body, used: used, tag: '场景/' + sc, seed: seedBase + h });
      }
      if(!r) continue;
      // 尾巴
      var tailTxt = '', tailTag = '';
      var tr = devHash(seedBase, 't' + h) % 100;
      if(tr < 12 && RAW.RAIN_TAILS){
        tailTxt = RAW.RAIN_TAILS[devHash(seedBase, 'rt' + h) % RAW.RAIN_TAILS.length];
        tailTag = '尾巴/雨';
      } else if(tr < 20 && RAW.DICE_TAILS){
        tailTxt = RAW.DICE_TAILS[devHash(seedBase, 'dt' + h) % RAW.DICE_TAILS.length];
        tailTag = '尾巴/骰子';
      } else if(tr < 28 && RAW.CHAPTER_TAILS){
        tailTxt = RAW.CHAPTER_TAILS[devHash(seedBase, 'ct' + h) % RAW.CHAPTER_TAILS.length];
        tailTag = '尾巴/章节';
      }
      items.push({
        time: pad(h) + ':' + pad(devHash(seedBase, 'm' + h) % 60),
        text: r.text + (tailTxt ? ' ' + tailTxt.trim() : ''),
        layer: r.layer, size: r.size, at: r.at,
        tail: tailTag || null, scene: sc, place: DEV_PLACE[sc] || '—',
        reset: r.reset,
      });
    }
    DEV.days.push({ date: date, weekday: ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'][dt.getDay()],
                    items: items, extra: [] });
  }
  devRender();
}
function devSceneFor(h, wk){
  if(wk){
    if(h < 9) return 'wk_morning';
    if(h < 12) return 'wk_noon';
    if(h < 18) return 'wk_afternoon';
    if(h < 22) return 'wk_evening';
    return 'sleep';
  }
  if(h < 7) return 'wake';
  if(h < 9) return 'commute';
  if(h < 12) return 'school_am';
  if(h < 14) return 'lunch';
  if(h < 17) return 'school_pm';
  if(h < 18) return 'commute_home';
  if(h < 20) return 'home_evening';
  if(h < 22) return 'study';
  return 'night';
}

function devRender(){
  var body = $('viewBody');
  var n = DEV.days.length;
  var total = DEV.days.reduce(function(a,d){ return a + d.items.length; }, 0);
  var all = [];
  DEV.days.forEach(function(d){ d.items.forEach(function(i){ all.push(i.text); }); });
  var uniq = {};
  all.forEach(function(t){ uniq[t] = 1; });
  var dupRate = all.length ? Math.round((1 - Object.keys(uniq).length / all.length) * 100) : 0;

  var html = '<div class="card hl"><h3>开发者测试模式</h3>'
    + '<p style="font-size:13.5px;color:var(--dim)">沙盒数据，只在内存里。关闭这个页面就销毁，不写存档。</p>'
    + '<div class="dev-stat">'
      + '<span><b>' + n + '</b> 天</span>'
      + '<span><b>' + total + '</b> 条记录</span>'
      + '<span><b>' + dupRate + '%</b> 重复率</span>'
    + '</div>'
    + '<div class="dev-btns">'
      + '<button class="dev-btn" id="devR7">重roll 7 天</button>'
      + '<button class="dev-btn" id="devR30">重roll 30 天</button>'
      + '<button class="dev-btn" id="devLayer">来源标注 ' + (DEV.showLayer ? '开' : '关') + '</button>'
      + '<button class="dev-btn dan" id="devClose">销毁沙盒</button>'
    + '</div></div>';

  DEV.days.forEach(function(d, di){
    var open = (DEV.sel === d.date) || (DEV.sel === null && di === DEV.days.length - 1);
    html += '<div class="fold' + (open ? ' open' : '') + '" data-dev="' + d.date + '">'
      + '<div class="fold-h"><span class="ar">▶</span><span>' + d.date.slice(5) + '</span>'
      + '<span style="font-size:11.5px;color:var(--dim2)">' + d.weekday + '</span>'
      + '<span class="sp"></span><span class="cnt">' + d.items.length + ' 条</span></div>'
      + '<div class="fold-b">';
    d.items.forEach(function(it){
      html += '<div class="dev-item">'
        + '<div class="di-top"><span class="di-t">' + it.time + '</span>'
        + '<span class="di-p">' + it.place + '</span></div>'
        + '<div class="di-x">' + it.text + '</div>'
        + (DEV.showLayer
            ? '<div class="di-layer">'
                + '<span class="dl dl-scene">' + it.layer + '</span>'
                + '<span class="dl dl-size">池 ' + it.size + ' 条 · 取第 ' + (it.at + 1) + '</span>'
                + (it.tail ? '<span class="dl dl-tail">' + it.tail + '</span>' : '')
                + (it.reset ? '<span class="dl dl-warn">池已用尽，重置</span>' : '')
              + '</div>'
            : '')
        + '</div>';
    });
    html += '</div></div>';
  });

  body.innerHTML = html;
  var r7 = $('devR7'), r30 = $('devR30'), dl = $('devLayer'), dc = $('devClose');
  if(r7) r7.onclick = function(){ sfx('click'); devBuild(7); };
  if(r30) r30.onclick = function(){ sfx('click'); devBuild(30); };
  if(dl) dl.onclick = function(){ DEV.showLayer = !DEV.showLayer; sfx('click'); devRender(); };
  if(dc) dc.onclick = function(){ sfx('closeapp'); DEV.days = []; closeView(); };
  document.querySelectorAll('[data-dev]').forEach(function(f){
    var h = f.querySelector('.fold-h');
    h.onclick = function(){ f.classList.toggle('open'); sfx('click'); };
  });
}

/* ---------- 壁纸 ---------- */
const WALL_KEY = 'saku_wall';
function getWall(){ try{ return localStorage.getItem(WALL_KEY); }catch(e){ return null; } }
function applyWall(){
  var w = getWall(), el = $('wallpaper'), veil = document.querySelector('#home .veil');
  if(w){ el.style.backgroundImage = 'url(' + w + ')'; el.classList.add('on'); veil.classList.add('on'); }
  else { el.style.backgroundImage = ''; el.classList.remove('on'); veil.classList.remove('on'); }
}
function renderWall(){
  var cur = getWall();
  $('viewBody').innerHTML = `
    <div class="card"><h3>桌面壁纸</h3>
      <p style="color:var(--dim);font-size:13.5px">选一张图，它会成为这个世界的背景。图片只存在你这台手机上，不会上传到任何地方。</p>
    </div>
    ${cur ? '<img class="wprev" id="wPrev" src="' + cur + '">'
          : '<div class="card"><div class="empty">还没有设过壁纸。下面选一张。</div></div>'}
    <label class="wpick">＋ 从相册或文件里选一张图
      <input type="file" id="wFile" accept="image/*">
    </label>
    <div class="wbtns">
      ${cur ? '<button class="pri" id="wKeep">就这么用</button><button class="dan" id="wClear">清除壁纸</button>' : ''}
    </div>
    <div class="card" style="margin-top:14px"><h3>说明</h3>
      <p style="color:var(--dim);font-size:13.5px">图片会自动压缩到适合屏幕的尺寸再存下来（原图不会占空间）。竖图效果最好。</p>
    </div>`;

  var file = $('wFile');
  if(file) file.addEventListener('change', function(){
    var f = file.files && file.files[0];
    if(!f) return;
    var img = new Image(), rd = new FileReader();
    rd.onload = function(){ img.src = rd.result; };
    img.onload = function(){
      // 压缩：长边不超过 1600，转 JPEG
      var maxSide = 1600, w = img.width, h = img.height;
      var sc = Math.min(1, maxSide / Math.max(w, h));
      var cw = Math.round(w * sc), chh = Math.round(h * sc);
      var cv = document.createElement('canvas');
      cv.width = cw; cv.height = chh;
      var ctx = cv.getContext('2d');
      ctx.drawImage(img, 0, 0, cw, chh);
      var data = cv.toDataURL('image/jpeg', 0.86);
      try{
        localStorage.setItem(WALL_KEY, data);
      }catch(e){
        // 存不下就再压一档
        data = cv.toDataURL('image/jpeg', 0.62);
        try{ localStorage.setItem(WALL_KEY, data); }catch(e2){
          $('viewBody').insertAdjacentHTML('afterbegin',
            '<div class="card"><p style="color:#e0a09a">这张图太大了，本机存不下。换一张小一点的试试。</p></div>');
          return;
        }
      }
      sfx('relic');
      applyWall();
      renderWall();
    };
    rd.readAsDataURL(f);
  });
  var keep = $('wKeep');
  if(keep) keep.onclick = function(){ sfx('coin'); closeView(); };
  var clr = $('wClear');
  if(clr) clr.onclick = function(){
    try{ localStorage.removeItem(WALL_KEY); }catch(e){}
    sfx('discard');
    applyWall();
    renderWall();
  };
}

/* ---------- 桌面构建 ---------- */
function buildHome(){
  var g = $('grid');
  g.innerHTML = '';
  APPS.filter(function(a){ return !a.hidden; }).forEach(function(a){
    var el = document.createElement('div');
    el.className = 'app';
    el.dataset.app = a.id;
    el.innerHTML = '<div class="ico">' + a.ico + '</div><div class="nm">' + a.name + '</div>';
    el.addEventListener('click', function(){
      el.classList.add('opening');
      sfx('openapp');
      showView(a.id, el);
      setTimeout(() => el.classList.remove('opening'), 320);
    });
    g.appendChild(el);
  });
}

/* ---------- 启动 ---------- */
async function boot(serverMode){
  buildHome();
  tickClock();
  if(serverMode){
    try{
      var r = await fetch('/api/feed', {cache:'no-store'});
      var d = await r.json();
      DATA = { days: d.days, bornAt: d.born_at, total: d.total_events,
               meta: '共 ' + d.total_events + ' 条记录，从 ' + d.born_at + ' 开始。' };
      var px = await fetch('/ascii/plan.json', {cache:'no-store'}).then(x => x.json()).catch(() => null);
      if(px){ PLAN = px.plan; PLACES = px.places; }
      var raw = await fetch('/ascii/saku-data.json', {cache:'no-store'}).then(x => x.json()).catch(() => null);
      if(raw && window.Saku){
        RAW = raw;
        var g = Saku.feed(WORLD_START, new Date(), raw);
        DATA = { days: g.days, bornAt: g.bornAt, total: g.total,
                 emoByDay: (Saku.emoByDay ? Saku.emoByDay() : {}) || {},
                 meta: '共 ' + g.total + ' 条记录，从 ' + g.bornAt + ' 开始。' };
      }
      setInterval(function(){
        try{
          if(!RAW || !window.Saku) return;
          var g2 = Saku.feed(WORLD_START, new Date(), RAW);
          DATA.days = g2.days; DATA.total = g2.total;
          if(VIEW === 'now' || VIEW === 'archive'){
            if(VIEW === 'calendar') renderCalendar();
            else if(VIEW === 'diary') renderDiary();
          }
        }catch(e){}
      }, 60000);
    }catch(e){}
    $('gate').classList.add('hide');
    $('home').classList.remove('hide');
    return;
  }
  // 加密模式
  async function tryOpen(password, remember){
    $('err').textContent = '';
    $('go').textContent = '解密中…';
    try{
      window.__SAKU_PW = password;
      var d = await decryptJSON(password, window.SAKU_ENC);
      if(window.SAKU_ASCII_ENC){
        try{
          var px = await decryptJSON(password, window.SAKU_ASCII_ENC);
          PLAN = px.plan; PLACES = px.places;
        }catch(e2){}
      }
      if(remember){ try{ localStorage.setItem(STORE_KEY, password); }catch(e){} }
      RAW = d;
      if(window.SAKU_ENGINE_ENC){
        try{
          var engTxt = await decryptRaw(password, window.SAKU_ENGINE_ENC);
          (new Function(engTxt))();
        }catch(e0){}
      }
      if(!window.Saku) throw new Error('引擎没有加载');
      var fresh = Saku.feed(WORLD_START, new Date(), d);
      var emoMap = (Saku.emoByDay ? Saku.emoByDay() : {}) || {};
      DATA = { days: fresh.days, bornAt: fresh.bornAt, total: fresh.total, emoByDay: emoMap,
               meta: '共 ' + fresh.total + ' 条记录，从 ' + fresh.bornAt + ' 开始。' };
      $('gate').classList.add('hide');
      $('home').classList.remove('hide');
      tickClock();
      if(!window.__sakuTick){
        window.__sakuTick = setInterval(function(){
          try{
            if(!RAW || !window.Saku) return;
            var g2 = Saku.feed(WORLD_START, new Date(), RAW);
            DATA.days = g2.days; DATA.total = g2.total;
            DATA.emoByDay = (Saku.emoByDay ? Saku.emoByDay() : {}) || {};
            if(VIEW === 'calendar') renderCalendar();
            else if(VIEW === 'diary') renderDiary();
          }catch(e){}
        }, 60000);
      }
    }catch(e){
      var msg = (e && e.message) ? e.message : String(e);
      // 解密本身失败（AEAD 校验不过）才是密码错；其它错照实说
      var isPw = /decrypt|OperationError|DataError|tag|unable to authenticate/i.test(msg);
      $('err').textContent = isPw ? '密码不对，或者数据已损坏' : ('出错了：' + msg);
      $('go').textContent = '进入';
      if(isPw){ try{ localStorage.removeItem(STORE_KEY); }catch(e2){} }
      if(window.console) console.error('[saku] 打开失败', e);
    }
  }
  $('go').addEventListener('click', function(){ tryOpen($('pw').value, true); });
  $('pw').addEventListener('keydown', function(e){ if(e.key === 'Enter') tryOpen($('pw').value, true); });
  var saved = null;
  try{ saved = localStorage.getItem(STORE_KEY); }catch(e){}
  if(saved) tryOpen(saved, false); else $('pw').focus();
}

$('viewBack').addEventListener('click', closeView);
document.addEventListener('keydown', function(e){ if(e.key === 'Escape' && VIEW) closeView(); });

/* 左边缘右滑返回 */
(function(){
  var x0 = 0, y0 = 0, tracking = false;
  document.addEventListener('touchstart', function(e){
    if(!VIEW) return;
    var t = e.touches[0];
    if(t.clientX < 24){ tracking = true; x0 = t.clientX; y0 = t.clientY; }
  }, {passive:true});
  document.addEventListener('touchmove', function(e){
    if(!tracking) return;
    var t = e.touches[0];
    if(Math.abs(t.clientY - y0) > 60) tracking = false;
  }, {passive:true});
  document.addEventListener('touchend', function(e){
    if(!tracking) return;
    tracking = false;
    var t = e.changedTouches[0];
    if(t.clientX - x0 > 70 && Math.abs(t.clientY - y0) < 70) closeView();
  }, {passive:true});
})();

/* 壁纸初始化 */
applyWall();
/* 桌游结果桥 */
bindBridge();
boot(IS_DEPLOY ? false : true);
</script>
