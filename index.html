<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#080b14">
<title>朔</title>
<style>
:root{
  --bg:#080b14; --card:#141a2a; --card2:#1b2338; --line:rgba(255,255,255,.09);
  --fg:#e8eef9; --dim:#8695b0; --dim2:#5a6880; --accent:#c9b98f;
  --red:#c0706a; --green:#7fc79a; --blue:#6fa8dc;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bot:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{
  background:
    radial-gradient(130% 80% at 80% -10%, #1c2a47 0%, rgba(28,42,71,0) 55%),
    radial-gradient(100% 60% at 8% 8%, #16203a 0%, rgba(22,32,58,0) 60%),
    var(--bg);
  color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  font-size:15px; line-height:1.75;
  -webkit-font-smoothing:antialiased;
}
.hide{display:none !important}

/* ================= 密码门 ================= */
#gate{
  position:fixed; inset:0; z-index:200; display:flex; flex-direction:column;
  align-items:center; justify-content:center; text-align:center; padding:24px;
  background:linear-gradient(180deg,#0a0e18,#070a12);
}
#gate .moon{width:58px;height:58px;margin-bottom:16px;opacity:.9}
#gate h1{font-size:26px;margin:0;letter-spacing:8px;font-weight:600}
#gate p{color:var(--dim2);font-size:12.5px;letter-spacing:1px;margin:10px 0 24px}
#gate input{
  width:100%;max-width:300px;padding:14px 16px;border-radius:13px;
  border:1px solid var(--line);background:rgba(255,255,255,.045);color:var(--fg);
  font-size:16px;font-family:inherit;outline:none;text-align:center;letter-spacing:1px;
}
#gate input:focus{border-color:rgba(201,185,143,.5);background:rgba(255,255,255,.07)}
#gate button{
  margin-top:13px;width:100%;max-width:300px;padding:14px;border-radius:13px;
  border:1px solid rgba(201,185,143,.35);background:rgba(201,185,143,.13);
  color:#e8dcb4;font-size:15.5px;font-family:inherit;font-weight:600;cursor:pointer;
}
#gate button:active{transform:scale(.985);background:rgba(201,185,143,.2)}
#gate .err{color:#f0a0a0;font-size:12.5px;margin-top:13px;min-height:18px}
#gate .tip{color:var(--dim2);font-size:11.5px;margin-top:18px;line-height:1.9;max-width:300px}

/* ================= 桌面 ================= */
#home{
  position:fixed; inset:0; display:flex; flex-direction:column;
  padding:calc(var(--safe-top) + 14px) 20px calc(var(--safe-bot) + 14px);
  transition:opacity .3s, transform .34s cubic-bezier(.3,.9,.3,1), filter .3s;
}
#home.push{opacity:0; transform:scale(.94); filter:blur(3px)}

/* 状态栏 */
.statusbar{display:flex; align-items:flex-end; gap:12px; margin-bottom:26px}
.statusbar .clockbig{
  font-size:44px; font-weight:300; letter-spacing:1px; line-height:1;
  font-variant-numeric:tabular-nums; color:#f2f6ff;
}
.statusbar .right{margin-left:auto; text-align:right}
.statusbar .date{font-size:12px; color:var(--dim); letter-spacing:.5px}
.statusbar .where{
  font-size:12px; color:var(--accent); margin-top:3px; letter-spacing:.5px;
  display:flex; align-items:center; gap:5px; justify-content:flex-end;
}
.dot{width:6px;height:6px;border-radius:50%;background:#7dd3fc;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

/* 图标网格 */
.grid{
  display:grid; gap:22px 16px;
  grid-template-columns:repeat(auto-fill,minmax(78px,1fr));
  align-content:start;
}
.app{
  display:flex; flex-direction:column; align-items:center; gap:8px;
  cursor:pointer; user-select:none;
  transition:transform .16s cubic-bezier(.3,1.4,.5,1), opacity .3s;
}
.app:active{transform:scale(.9)}
.app.zooming{opacity:0}
.app .ico{
  width:62px;height:62px;border-radius:17px;
  display:flex;align-items:center;justify-content:center;
  font-size:27px; line-height:1;
  border:1px solid rgba(255,255,255,.13);
  box-shadow:0 6px 16px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.12);
  background:linear-gradient(165deg,#242c44,#161c2c);
  transition:transform .22s cubic-bezier(.3,1.5,.5,1), box-shadow .22s;
}
.app.opening .ico{transform:scale(1.18); box-shadow:0 10px 26px rgba(0,0,0,.5)}
.app .nm{font-size:11.5px; color:var(--dim); letter-spacing:.5px; white-space:nowrap}
.app[data-app="calendar"] .ico{background:linear-gradient(165deg,#2b3040,#1a1d29)}
.app[data-app="diary"] .ico{background:linear-gradient(165deg,#332b3c,#1e1926)}
.app[data-app="game"] .ico{background:linear-gradient(165deg,#3a2b2b,#241a1a)}
.app[data-app="about"] .ico{background:linear-gradient(165deg,#2d2a3c,#1b1926)}
.app[data-app="wall"] .ico{background:linear-gradient(165deg,#2b3a44,#182228)}

/* ---------- 桌面壁纸 ---------- */
#wallpaper{
  position:fixed; inset:0; z-index:-1; background-size:cover; background-position:center;
  opacity:0; transition:opacity .5s;
}
#wallpaper.on{opacity:1}
#home .veil{
  position:fixed; inset:0; z-index:-1; pointer-events:none;
  background:linear-gradient(180deg,rgba(6,9,16,.62),rgba(6,9,16,.34) 42%,rgba(6,9,16,.72));
  opacity:0; transition:opacity .5s;
}
#home .veil.on{opacity:1}

/* 壁纸视图内的控件 */
.wpick{
  display:block; width:100%; border:2px dashed rgba(201,185,143,.4); border-radius:15px;
  padding:26px 16px; text-align:center; cursor:pointer; background:rgba(255,255,255,.03);
  font-size:15px; color:var(--accent); margin-bottom:12px;
}
.wpick:active{background:rgba(255,255,255,.08)}
.wpick input{display:none}
.wprev{
  width:100%; border-radius:15px; border:1px solid var(--line);
  max-height:52vh; object-fit:cover; display:block; margin-bottom:12px; background:#0c1018;
}
.wbtns{display:flex; gap:9px; flex-wrap:wrap}
.wbtns button{
  flex:1 1 120px; border:1px solid var(--line); background:rgba(255,255,255,.05);
  color:var(--fg); font-family:inherit; font-size:14px; border-radius:11px;
  padding:11px 14px; cursor:pointer;
}
.wbtns button.pri{border-color:rgba(201,185,143,.42); background:rgba(201,185,143,.15); color:#e8dcb4; font-weight:600}
.wbtns button.dan{border-color:rgba(192,112,106,.5); color:#e0a09a}
.wbtns button:active{transform:scale(.97)}
.app .badge{
  position:absolute; margin:-42px 0 0 44px; min-width:17px; height:17px; padding:0 4px;
  border-radius:9px; background:var(--red); color:#fff; font-size:10.5px;
  display:flex; align-items:center; justify-content:center; line-height:1;
}

/* Dock */
.dock{
  margin-top:auto; display:flex; justify-content:center; gap:8px; padding-top:18px;
}
.dock i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.25)}
.dock i.on{background:rgba(255,255,255,.6)}

/* ================= App 视图 ================= */
#viewHost{
  position:fixed; inset:0; z-index:100; display:flex; flex-direction:column;
  background:
    radial-gradient(120% 70% at 80% -8%, #1a2743 0%, rgba(26,39,67,0) 55%),
    var(--bg);
  opacity:0; transform:scale(.9); pointer-events:none;
  transition:opacity .26s ease, transform .34s cubic-bezier(.2,.9,.25,1);
  transform-origin:50% 50%;
}
#viewHost.on{opacity:1; transform:scale(1); pointer-events:auto}
.view-bar{
  display:flex; align-items:center; gap:12px; flex:0 0 auto;
  padding:calc(var(--safe-top) + 12px) 16px 12px;
  border-bottom:1px solid var(--line);
  background:rgba(10,14,24,.72); backdrop-filter:blur(12px);
}
.view-bar .back{
  border:1px solid var(--line); background:rgba(255,255,255,.05); color:var(--fg);
  font-size:13.5px; font-family:inherit; border-radius:999px; padding:6px 14px; cursor:pointer;
}
.view-bar .back:active{background:rgba(255,255,255,.12)}
.view-bar .vt{font-size:15px; letter-spacing:2px; color:var(--accent); font-weight:600}
.view-body{
  position:relative; flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch;
  padding:18px 18px calc(var(--safe-bot) + 40px);
}
.view-body.short{overflow:hidden; padding:0}

/* 视图内元素 */
.card{
  border:1px solid var(--line); border-radius:15px; padding:16px;
  background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.015));
  margin-bottom:14px;
}
.card.hl{
  border-color:rgba(201,185,143,.3);
  background:linear-gradient(180deg,rgba(201,185,143,.11),rgba(201,185,143,.025));
}
.card h3{margin:0 0 10px; font-size:13px; letter-spacing:2px; color:var(--accent); font-weight:600}
.card .big{font-size:22px; font-weight:600; color:#f2ecdc; letter-spacing:1px; margin-bottom:4px}
.card .sub{font-size:12.5px; color:var(--dim2)}
.card p{margin:8px 0; font-size:14px; color:#dfe6f2}

ul.items{list-style:none;margin:0;padding:0}
ul.items li{display:flex;gap:14px;padding:11px 0;border-top:1px solid rgba(255,255,255,.055)}
ul.items li:first-child{border-top:none}
ul.items .t{flex:0 0 44px;color:#9d8f68;font-size:12.5px;font-variant-numeric:tabular-nums;padding-top:3px}
ul.items .x{margin:0;flex:1;color:#dfe6f2;font-size:14.5px}
ul.items li.night .x{color:#b9c5d8}

.day{margin-bottom:9px;border:1px solid var(--line);border-radius:13px;overflow:hidden;
     background:rgba(255,255,255,.02)}
.dayhead{display:flex;align-items:center;gap:10px;cursor:pointer;
         padding:13px 15px;font-size:13.5px;color:var(--dim);user-select:none}
.dayhead .arrow{color:var(--dim2);font-size:10px;transition:transform .22s}
.day.open .dayhead .arrow{transform:rotate(90deg)}
.day.open .dayhead{color:var(--accent)}
.dayhead .tag{font-size:11px;color:var(--accent);border:1px solid rgba(201,185,143,.3);
              border-radius:999px;padding:1px 8px}
.dayhead .n{margin-left:auto;color:var(--dim2);font-size:12px}
.day ul.items{display:none;padding:0 15px 8px}
.day.open ul.items{display:block}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{font-size:12px;color:var(--dim);border:1px solid var(--line);
      padding:5px 11px;border-radius:999px;background:rgba(255,255,255,.025)}

/* 桌游视图 */
.game-shell{position:absolute; inset:0; display:flex; flex-direction:column; z-index:1}
.game-frame{flex:1; width:100%; border:0; background:#2e2822; display:block}

/* 返回按钮：足够显眼、可点、永远压在内容上面 */
.view-bar{position:relative; z-index:20}
.view-bar .back{
  border:1px solid rgba(201,185,143,.42) !important;
  background:rgba(201,185,143,.14) !important;
  color:#e8dcb4 !important;
  font-weight:600; padding:8px 18px !important;
  box-shadow:0 2px 10px rgba(0,0,0,.35);
}
.view-bar .back:active{transform:scale(.96); background:rgba(201,185,143,.26) !important}
/* 桌游视图里额外给一个悬浮退出按钮（万一顶部被挡） */
.game-exit{
  position:absolute; right:12px; bottom:calc(12px + var(--safe-bot)); z-index:30;
  border:2px solid rgba(91,70,50,.6); background:rgba(255,253,247,.94); color:#5b4632;
  font-family:inherit; font-size:13px; border-radius:999px; padding:9px 20px;
  box-shadow:0 4px 14px rgba(0,0,0,.4); cursor:pointer;
}
.game-exit:active{transform:scale(.96)}
/* 左边缘右滑返回的提示条 */
.edge{
  position:fixed; left:0; top:0; bottom:0; width:18px; z-index:25;
  touch-action:pan-y;
}

/* ---------- 日记 ---------- */
.diary-bar{display:flex; gap:7px; overflow-x:auto; padding-bottom:10px; margin-bottom:14px;
           -webkit-overflow-scrolling:touch; scrollbar-width:none}
.diary-bar::-webkit-scrollbar{display:none}
.dchip{flex:0 0 auto; border:1px solid var(--line); background:rgba(255,255,255,.04);
       color:var(--dim); font-family:inherit; font-size:12.5px; border-radius:999px;
       padding:6px 13px; cursor:pointer; white-space:nowrap}
.dchip.on{background:rgba(201,185,143,.2); border-color:rgba(201,185,143,.5); color:#f0e6c8; font-weight:600}
.dchip:active{transform:scale(.95)}
.diary-paper{
  border:1px solid var(--line); border-radius:15px; padding:20px 18px 18px;
  background:
    repeating-linear-gradient(0deg,rgba(201,185,143,.05) 0 1px,transparent 1px 30px),
    linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.012));
  box-shadow:0 8px 26px rgba(0,0,0,.3);
}
.dhead{display:flex; align-items:baseline; gap:10px; margin-bottom:14px}
.dhead .d1{font-size:21px; letter-spacing:2px; color:#f2ecdc; font-weight:600}
.dhead .d2{font-size:12.5px; color:var(--dim2)}
.dsum{font-size:13.5px; color:var(--accent); line-height:1.85; margin-bottom:14px; letter-spacing:.3px}
.dline{height:1px; background:linear-gradient(90deg,rgba(201,185,143,.35),rgba(201,185,143,0)); margin:14px 0}
ul.ditems{list-style:none; margin:0; padding:0}
ul.ditems li{display:flex; gap:13px; padding:9px 0; line-height:1.8}
ul.ditems .dt{flex:0 0 46px; font-size:12px; color:#9d8f68; font-variant-numeric:tabular-nums; padding-top:4px}
ul.ditems .dx{flex:1; font-size:14.5px; color:#e2e9f5; line-height:1.85}
.dfoot{font-size:14px; color:#cdd7e8; text-align:right; font-style:italic; letter-spacing:1px; opacity:.9}

/* ---------- 日历 ---------- */
.cal-head{
  display:flex; align-items:center; gap:12px; margin-bottom:14px;
}
.cal-head .ym{font-size:17px; letter-spacing:2px; color:var(--accent); font-weight:600}
.cal-head .sp{flex:1}
.cal-nav{
  border:1px solid var(--line); background:rgba(255,255,255,.05); color:var(--fg);
  font-family:inherit; font-size:16px; line-height:1; border-radius:10px;
  width:36px; height:36px; cursor:pointer; display:flex; align-items:center; justify-content:center;
}
.cal-nav:active{background:rgba(255,255,255,.13)}
.cal-nav:disabled{opacity:.28}
.cal-week{
  display:grid; grid-template-columns:repeat(7,1fr); gap:5px;
  font-size:11.5px; color:var(--dim2); text-align:center; margin-bottom:7px;
  letter-spacing:1px;
}
.cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:5px}
.cal-cell{
  position:relative; aspect-ratio:1/1; border-radius:11px;
  border:1px solid transparent; background:rgba(255,255,255,.028);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  font-size:14.5px; color:var(--dim2); cursor:default;
  transition:transform .14s, background .16s, border-color .16s;
}
.cal-cell.empty{background:transparent; border-color:transparent}
.cal-cell.has{
  background:rgba(201,185,143,.13); border-color:rgba(201,185,143,.3);
  color:#f0e6c8; cursor:pointer;
}
.cal-cell.has:active{transform:scale(.93); background:rgba(201,185,143,.24)}
.cal-cell.today{border-color:rgba(125,211,252,.7); box-shadow:0 0 0 1px rgba(125,211,252,.35) inset}
.cal-cell.sel{background:rgba(201,185,143,.3); border-color:var(--accent); color:#fff8e6}
.cal-cell .cnt{
  position:absolute; bottom:5px; font-size:9.5px; line-height:1;
  color:var(--accent); letter-spacing:.5px;
}
.cal-cell .dots{position:absolute; bottom:13px; display:flex; gap:2px}
.cal-cell .dots i{width:3px;height:3px;border-radius:50%;background:var(--accent);opacity:.75}
.cal-day{
  margin-top:16px; border-top:1px solid var(--line); padding-top:14px;
}
.cal-day .dh{
  display:flex; align-items:baseline; gap:10px; margin-bottom:8px;
}
.cal-day .dh .d{font-size:16px; color:var(--accent); letter-spacing:1px; font-weight:600}
.cal-day .dh .w{font-size:12.5px; color:var(--dim2)}
.cal-day .dh .n{margin-left:auto; font-size:12px; color:var(--dim2)}

/* ---------- 她的东西 ---------- */
.things-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:12px}
.thing{
  border:1px solid var(--line); border-radius:14px; padding:14px 12px;
  background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.015));
  text-align:center; transition:transform .16s;
}
.thing:active{transform:scale(.97)}
.thing .art{
  font-family:ui-monospace,Menlo,Consolas,monospace; font-size:11px; line-height:1.15;
  white-space:pre; color:var(--accent); margin-bottom:10px; min-height:52px;
  display:flex; align-items:center; justify-content:center;
}
.thing .nm{font-size:14px; color:#f2ecdc; letter-spacing:1px; margin-bottom:5px}
.thing .ds{font-size:11.5px; color:var(--dim); line-height:1.6}
.places{display:flex; flex-direction:column; gap:8px}
.place{
  display:flex; align-items:center; gap:12px; padding:11px 13px;
  border:1px solid var(--line); border-radius:12px; background:rgba(255,255,255,.025);
}
.place .ic{
  font-family:ui-monospace,monospace; font-size:15px; color:var(--accent);
  width:30px; text-align:center; flex:0 0 auto;
}
.place .tx{flex:1; min-width:0}
.place .tx b{font-size:14px; color:#f2ecdc; font-weight:500}
.place .tx div{font-size:11.5px; color:var(--dim2); margin-top:2px}
.place .tagn{font-size:11px; color:var(--dim2); white-space:nowrap}

/* 列表式入口（规则/关于） */
.doc{font-size:14.5px;line-height:1.95;color:#cdd7e8}
.doc h4{margin:20px 0 8px;font-size:14px;letter-spacing:1.5px;color:var(--accent)}
.doc h4:first-child{margin-top:0}
.doc p{margin:8px 0}
.doc ul{margin:8px 0;padding-left:20px}
.doc li{margin:5px 0}
.doc b{color:#f2ecdc}
.doc code{background:rgba(255,255,255,.07);padding:1px 6px;border-radius:5px;font-size:13px}

.empty{color:var(--dim2);font-size:13.5px;padding:14px 0}
.center{text-align:center;padding:30px 0;color:var(--dim2);font-size:13.5px}

/* 桌面淡入 */
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.app{animation:fadeUp .42s backwards}
.app:nth-child(1){animation-delay:.02s}
.app:nth-child(2){animation-delay:.06s}
.app:nth-child(3){animation-delay:.1s}
.app:nth-child(4){animation-delay:.14s}
.app:nth-child(5){animation-delay:.18s}
.app:nth-child(6){animation-delay:.22s}
</style>
</head>
<body>

<!-- ================= 密码门 ================= -->
<div id="gate">
  <svg class="moon" viewBox="0 0 48 48" fill="none" aria-hidden="true">
    <path d="M30 6a18 18 0 1 0 12 30 15 15 0 0 1-12-30Z" fill="#c9b98f" opacity=".85"/>
  </svg>
  <h1>朔</h1>
  <p id="gateSub">这个世界是加密的</p>
  <input id="pw" type="password" placeholder="请输入密码" autocomplete="current-password">
  <button id="go">进入</button>
  <div class="err" id="err"></div>
  <div class="tip">没有密码只能看到密文。<br>进入后会记住，之后打开直接进。</div>
</div>

<!-- ================= 桌面 ================= -->
<div id="wallpaper"></div>
<div id="home" class="hide">
  <div class="veil"></div>
  <div class="statusbar">
    <div class="clockbig" id="clkBig">--:--</div>
    <div class="right">
      <div class="date" id="clkDate">—</div>
      <div class="where"><span class="dot"></span><span id="clkWhere">接入中</span></div>
    </div>
  </div>
  <div class="grid" id="grid"></div>
  <div class="dock"><i class="on"></i><i></i></div>
</div>

<!-- ================= App 视图 ================= -->
<div id="viewHost">
  <div class="view-bar">
    <button class="back" id="viewBack">← 返 回</button>
    <span class="vt" id="viewTitle">现在</span>
  </div>
  <div class="view-body" id="viewBody"></div>
</div>

<script src="saku-data.enc.js"></script>
<script src="saku-ascii.enc.js"></script>
<script src="maze.enc.js"></script>
<script>
/* =====================================================================
   朔 · 观察窗口（手机桌面风格）
   ===================================================================== */
const $ = id => document.getElementById(id);
const IS_DEPLOY = true;
const STORE_KEY = 'saku_pw';

const APPS = [
  {id:'calendar',ico:'▦', name:'日历'},
  {id:'game',    ico:'⚄', name:'桌游'},
  {id:'diary',   ico:'✎', name:'日记'},
  {id:'wall',    ico:'▧', name:'壁纸'},
  {id:'about',   ico:'◌', name:'关于'},
];

let DATA = null, PLAN = null, PLACES = null, VIEW = null, clockSkew = 0;
let DATA_RAW = null;

/* ============================================================
   音频引擎：主总线 + 混响 + 多层合成，做出"游戏感"而不是哔哔声
   ============================================================ */
let ACTX = null, MASTER = null, REVERB = null, REV_GAIN = null, SFX_ON = true;

function actx(){
  if(!ACTX){
    try{
      ACTX = new (window.AudioContext || window.webkitAudioContext)();
      MASTER = ACTX.createGain(); MASTER.gain.value = 0.72; MASTER.connect(ACTX.destination);
      // 程序生成的混响脉冲（衰减噪声），营造空间感
      const sr = ACTX.sampleRate, len = Math.floor(sr * 1.6);
      const imp = ACTX.createBuffer(2, len, sr);
      for(let c = 0; c < 2; c++){
        const d = imp.getChannelData(c);
        for(let i = 0; i < len; i++){
          const t = i / len;
          d[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, 2.6) * (i < sr * 0.012 ? 0.35 : 1);
        }
      }
      REVERB = ACTX.createConvolver(); REVERB.buffer = imp;
      REV_GAIN = ACTX.createGain(); REV_GAIN.gain.value = 0.34;
      REVERB.connect(REV_GAIN); REV_GAIN.connect(MASTER);
    }catch(e){ ACTX = null; }
  }
  if(ACTX && ACTX.state === 'suspended') ACTX.resume();
  return ACTX;
}
/* 一个音符：可选滑音、滤波、声像、混响量 */
function note(o){
  const c = actx(); if(!c || !SFX_ON) return;
  const t0 = c.currentTime + (o.at || 0);
  const dur = o.dur || 0.2;
  const osc = c.createOscillator();
  osc.type = o.type || 'sine';
  osc.frequency.setValueAtTime(o.f, t0);
  if(o.to){ osc.frequency.exponentialRampToValueAtTime(Math.max(20, o.to), t0 + dur * (o.slide || 1)); }
  if(o.detune) osc.detune.setValueAtTime(o.detune, t0);
  const g = c.createGain();
  const peak = o.vol == null ? 0.16 : o.vol;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(peak, t0 + (o.att || 0.008));
  g.gain.exponentialRampToValueAtTime(peak * 0.42, t0 + dur * 0.35);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  let node = osc;
  if(o.lp){ const f = c.createBiquadFilter(); f.type = 'lowpass';
    f.frequency.setValueAtTime(o.lp, t0);
    if(o.lpTo) f.frequency.exponentialRampToValueAtTime(o.lpTo, t0 + dur);
    f.Q.value = o.q || 1; node.connect(f); node = f; }
  if(o.bp){ const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = o.bp; f.Q.value = o.bq || 3;
    node.connect(f); node = f; }
  const pan = c.createStereoPanner ? c.createStereoPanner() : null;
  if(pan){ pan.pan.value = o.pan || 0; node.connect(g); node = pan; node.connect(g); }
  else node.connect(g);
  g.connect(MASTER);
  if(o.rev){ const rg = c.createGain(); rg.gain.value = o.rev; g.connect(rg); rg.connect(REVERB); }
  osc.start(t0); osc.stop(t0 + dur + 0.05);
}
/* 噪声层：撞击/沙沙/爆炸 */
function noiseHit(o){
  const c = actx(); if(!c || !SFX_ON) return;
  const t0 = c.currentTime + (o.at || 0);
  const dur = o.dur || 0.2;
  const len = Math.floor(c.sampleRate * dur);
  const buf = c.createBuffer(1, len, c.sampleRate);
  const d = buf.getChannelData(0);
  for(let i = 0; i < len; i++){
    const t = i / len;
    d[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, o.decay || 2.2);
  }
  const src = c.createBufferSource(); src.buffer = buf;
  const f = c.createBiquadFilter();
  f.type = o.type || 'highpass';
  f.frequency.setValueAtTime(o.f || 900, t0);
  if(o.fTo) f.frequency.exponentialRampToValueAtTime(Math.max(60, o.fTo), t0 + dur);
  f.Q.value = o.q || 1;
  const g = c.createGain(); g.gain.value = o.vol == null ? 0.14 : o.vol;
  src.connect(f); f.connect(g); g.connect(MASTER);
  if(o.rev){ const rg = c.createGain(); rg.gain.value = o.rev; g.connect(rg); rg.connect(REVERB); }
  src.start(t0);
}
/* 低频冲击：打击感 */
function thump(freq, dur, vol, at){
  note({ f:freq, to:freq*0.42, dur:dur, type:'sine', vol:vol, att:0.004, at:at||0, lp:420 });
}
const SCALE = [0, 2, 4, 7, 9];          // 大调五声
const nf = (semi, base) => (base || 523.25) * Math.pow(2, semi / 12);

const SFX_LAST = {};
const SFX_GAP = { openapp:260, closeapp:260, click:120, place:70, coin:90, advance:90, tick:40 };
function sfx(name){
  if(!SFX_ON) return;
  var now = performance.now();
  var gap = SFX_GAP[name] || 0;
  if(gap && SFX_LAST[name] && now - SFX_LAST[name] < gap) return;   // 连点不叠音
  SFX_LAST[name] = now;
  actx();
  switch(name){
    /* —— 骰子：木质碰撞 + 滚动沙沙 —— */
    case 'roll':
      for(let i = 0; i < 5; i++)
        noiseHit({ type:'bandpass', f: 1100 + i*380, dur:0.045, vol:0.09, at:i*0.055, bq:4 });
      note({ f:170, to:90, dur:0.16, type:'triangle', vol:0.10, lp:900 });
      break;
    case 'tick':
      noiseHit({ type:'bandpass', f: 2600 + Math.random()*1600, dur:0.022, vol:0.055, bq:6 });
      break;
    case 'land':                        // 骰子落定：木质叩击 + 余韵
      noiseHit({ type:'bandpass', f:2200, dur:0.05, vol:0.13, bq:3, rev:0.5 });
      note({ f:330, to:240, dur:0.20, type:'triangle', vol:0.13, lp:1800, rev:0.55 });
      note({ f:660, to:520, dur:0.16, type:'sine', vol:0.07, at:0.02, rev:0.5 });
      break;
    case 'place':                       // 放进房间：轻快双击（音量收敛）
      note({ f:nf(4,440), dur:0.10, type:'sine', vol:0.07, lp:2200, rev:0.25 });
      note({ f:nf(7,440), dur:0.15, type:'sine', vol:0.055, at:0.05, lp:2400, rev:0.35 });
      break;
    case 'discard':
      note({ f:260, to:140, dur:0.22, type:'sawtooth', vol:0.075, lp:1200, lpTo:400, rev:0.2 });
      noiseHit({ type:'lowpass', f:800, dur:0.12, vol:0.06 });
      break;
    /* —— 正向反馈：灵魂/碎片/遗物 —— */
    case 'coin':
      [0, 4, 7, 12].forEach((semi, i) => {
        note({ f:nf(semi, 880), dur:0.30, type:'triangle', vol:0.10, at:i*0.045, rev:0.6 });
      });
      noiseHit({ type:'highpass', f:5200, dur:0.08, vol:0.05, rev:0.4 });
      break;
    case 'relic':
      [0, 4, 7, 11, 14].forEach((semi, i) => {
        note({ f:nf(semi, 659.25), dur:0.7, type:'sine', vol:0.10, at:i*0.07, rev:0.85 });
        note({ f:nf(semi, 659.25)*2, dur:0.4, type:'triangle', vol:0.035, at:i*0.07, rev:0.7 });
      });
      break;
    case 'heal':
      note({ f:523.25, to:783.99, dur:0.42, type:'sine', vol:0.11, rev:0.7 });
      note({ f:783.99, dur:0.5, type:'sine', vol:0.07, at:0.14, rev:0.8 });
      break;
    /* —— 战斗 —— */
    case 'good':                        // 击破小怪：冲击 + 上扬和弦
      noiseHit({ type:'bandpass', f:1800, fTo:300, dur:0.30, vol:0.17, q:1.4, rev:0.55 });
      thump(120, 0.32, 0.20);
      [0, 4, 7, 12].forEach((semi, i) =>
        note({ f:nf(semi, 523.25), dur:0.5, type:'triangle', vol:0.10, at:i*0.055, rev:0.7 }));
      break;
    case 'hurt':                        // 受伤：闷击 + 下坠
      thump(95, 0.30, 0.24);
      noiseHit({ type:'lowpass', f:900, dur:0.20, vol:0.14 });
      note({ f:220, to:110, dur:0.36, type:'sawtooth', vol:0.10, lp:900, lpTo:260, rev:0.3 });
      break;
    case 'bad':
      [0, -2, -5].forEach((semi, i) =>
        note({ f:nf(semi, 392), dur:0.30, type:'triangle', vol:0.09, at:i*0.10, rev:0.45 }));
      break;
    case 'monster':                     // 小怪登场：低频咆哮 + 不和谐
      thump(58, 0.85, 0.26);
      thump(62, 0.75, 0.20, 0.06);
      note({ f:98, to:82, dur:1.0, type:'sawtooth', vol:0.11, lp:520, rev:0.6 });
      note({ f:139, to:131, dur:0.9, type:'square', vol:0.06, at:0.05, lp:600, rev:0.55 });
      noiseHit({ type:'lowpass', f:420, dur:0.7, vol:0.13, decay:1.6, rev:0.6 });
      break;
    case 'boss':                        // Boss：轰鸣 + 四度堆叠
      thump(44, 1.6, 0.30);
      thump(46.5, 1.4, 0.22, 0.10);
      [0, 3, 6, 10].forEach((semi, i) =>
        note({ f:nf(semi, 130.81), dur:1.5, type:'sawtooth', vol:0.085, at:i*0.13, lp:700, rev:0.9 }));
      noiseHit({ type:'lowpass', f:600, fTo:120, dur:1.3, vol:0.14, decay:1.2, rev:0.8 });
      break;
    /* —— 推进 / 界面 —— */
    case 'advance':
      note({ f:nf(0,523.25), to:nf(0,659.25), dur:0.20, type:'triangle', vol:0.10, rev:0.4 });
      noiseHit({ type:'highpass', f:3000, dur:0.05, vol:0.04, rev:0.3 });
      break;
    case 'click':
      noiseHit({ type:'lowpass', f:1400, dur:0.018, vol:0.028 });
      note({ f:420 + Math.random() * 60, dur:0.05, type:'sine', vol:0.022, att:0.004, lp:1400 });
      break;
    /* 打开/关闭 App：低频柔和的一声，每次音高略不同，不刺耳 */
    case 'openapp': {
      const v = 1 + (Math.random() - 0.5) * 0.06;
      note({ f:294 * v, to:392 * v, dur:0.26, type:'sine', vol:0.055, att:0.016, lp:1200, rev:0.35 });
      note({ f:588 * v, dur:0.18, type:'sine', vol:0.022, at:0.02, lp:1600, rev:0.3 });
      noiseHit({ type:'lowpass', f:700, dur:0.05, vol:0.022 });
      break;
    }
    case 'closeapp': {
      const v = 1 + (Math.random() - 0.5) * 0.06;
      note({ f:330 * v, to:247 * v, dur:0.24, type:'sine', vol:0.05, att:0.016, lp:1100, rev:0.3 });
      noiseHit({ type:'lowpass', f:600, dur:0.045, vol:0.018 });
      break;
    }
    /* —— 结局 —— */
    case 'win':
      [0, 4, 7, 12, 16, 19].forEach((semi, i) => {
        note({ f:nf(semi, 523.25), dur:0.9, type:'triangle', vol:0.11, at:i*0.11, rev:0.95 });
        note({ f:nf(semi, 523.25)/2, dur:0.9, type:'sine', vol:0.06, at:i*0.11, rev:0.9 });
      });
      thump(65, 1.0, 0.16, 0.02);
      break;
    case 'true':                        // 真结局：更长的上行 + 空灵
      [0, 4, 7, 11, 12, 16, 19, 24].forEach((semi, i) => {
        note({ f:nf(semi, 523.25), dur:1.3, type:'sine', vol:0.10, at:i*0.15, rev:1.0 });
        note({ f:nf(semi, 523.25)*2, dur:0.8, type:'triangle', vol:0.03, at:i*0.15+0.03, rev:0.9 });
      });
      break;
    case 'lose':
      [0, -3, -7, -12].forEach((semi, i) =>
        note({ f:nf(semi, 392), dur:1.1, type:'sine', vol:0.11, at:i*0.20, rev:0.9 }));
      thump(52, 1.4, 0.18, 0.05);
      break;
  }
}

/* ---------- 工具 ---------- */
function pad(n){ return n < 10 ? '0' + n : '' + n; }
function b64buf(b64){
  var bin = atob(b64), len = bin.length, arr = new Uint8Array(len);
  for (var i = 0; i < len; i++) arr[i] = bin.charCodeAt(i);
  return arr;
}
async function decryptRaw(password, enc){
  var material = await crypto.subtle.importKey(
    'raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
  var key = await crypto.subtle.deriveKey(
    { name:'PBKDF2', salt: b64buf(enc.salt), iterations: 250000, hash:'SHA-256' },
    material, { name:'AES-GCM', length:256 }, false, ['decrypt']);
  var ct = b64buf(enc.ct), tag = b64buf(enc.tag);
  var joined = new Uint8Array(ct.length + tag.length);
  joined.set(ct, 0); joined.set(tag, ct.length);
  var plain = await crypto.subtle.decrypt({ name:'AES-GCM', iv: b64buf(enc.iv) }, key, joined);
  return new TextDecoder().decode(plain);
}
async function decryptJSON(password, enc){
  return JSON.parse(await decryptRaw(password, enc));
}

/* ---------- 朔在哪 ---------- */
function placeAt(date){
  if(!PLAN || !PLACES) return null;
  var plan = (date.getDay() === 0 || date.getDay() === 6) ? PLAN.weekend : PLAN.weekday;
  if(!plan || !plan.length) return null;
  var m = date.getHours() * 60 + date.getMinutes();
  var hit = plan[plan.length - 1];
  for(var i = 0; i < plan.length; i++){
    var a = plan[i][0].split(':'), b = plan[i][1].split(':');
    if((+a[0])*60 + (+a[1]) <= m && m < (+b[0])*60 + (+b[1])){ hit = plan[i]; break; }
  }
  var p = PLACES[hit[2]] || ['bedroom', true, '卧室'];
  return { place:hit[2], scene:hit[3], act:hit[4], room:p[0], indoor:!!p[1], cn:p[2] };
}

function line(t, text){

const MOODS = [
  '有点累。但还好。','还行吧。','……没什么特别的。','就这样。','一般。',
  '今天不太想说话。','没什么，习惯了。','还好，一个人也可以。',
  '有点想下雨。','嗯，先这样吧。','算了，睡吧。','明天再说。',
];
const OPENERS = [
  '今天记了 {n} 件事，从 {a} 一直到 {b}。',
  '{a} 到 {b}，一共 {n} 条。',
  '这一天被切成了 {n} 段，从 {a} 开始，到 {b} 结束。',
  '{n} 件事。天亮到天黑。',
  '从 {a} 到 {b}，{n} 条。',
];
function slotOf(h){
  if(h < 6) return 'late';
  if(h < 8) return 'early';
  if(h < 11) return 'am';
  if(h < 13) return 'noon';
  if(h < 17) return 'pm';
  if(h < 19) return 'eve';
  if(h < 22) return 'night';
  return 'late';
}
function seedOf(str, salt){
  var h = 2166136261, x = str + '|' + (salt || '');
  for(var i = 0; i < x.length; i++){ h ^= x.charCodeAt(i); h = Math.imul(h, 16777619); }
  return (h >>> 0);
}
function pick(arr, seed){ return arr[seed % arr.length]; }

let DIARY_SEL = null;
function renderDiary(){
  if(!DATA) return;
  var body = $('viewBody');
  var days = (DATA.days || []).slice().reverse();
  if(!days.length){ body.innerHTML = '<div class="empty">她还没开始写。</div>'; return; }
  if(!DIARY_SEL || !days.some(function(d){ return d.date === DIARY_SEL; })) DIARY_SEL = days[0].date;

  var day = days.filter(function(d){ return d.date === DIARY_SEL; })[0];
  var items = day.items || [];
  var seed = seedOf(day.date);
  var first = items.length ? items[0].time : '—';
  var last = items.length ? items[items.length-1].time : '—';

  var slots = {};
  items.forEach(function(it){
    var k = slotOf(parseInt(it.time.slice(0,2), 10));
    (slots[k] = slots[k] || []).push(it);
  });
  var picked = ['early','am','noon','pm','eve','night','late']
    .filter(function(k){ return slots[k] && slots[k].length; })
    .map(function(k){ return slots[k][seedOf(day.date, k) % slots[k].length]; });

  var lab = fmtDay(day.date);
  var mo = parseInt(day.date.slice(5,7),10), dd = parseInt(day.date.slice(8,10),10);

  var html = '<div class="diary-bar" id="diaryBar">'
    + days.slice(0, 30).map(function(d){
        return '<button class="dchip' + (d.date === DIARY_SEL ? ' on' : '') + '" data-d="' + d.date + '">'
          + parseInt(d.date.slice(5,7),10) + '/' + parseInt(d.date.slice(8,10),10) + '</button>';
      }).join('') + '</div>';

  html += '<div class="diary-paper">'
    + '<div class="dhead"><span class="d1">' + mo + ' 月 ' + dd + ' 日</span>'
    + '<span class="d2">' + day.weekday + (lab.tag ? ' · ' + lab.tag : '') + '</span></div>'
    + '<div class="dsum">' + pick(OPENERS, seed).replace('{n}', items.length)
        .replace('{a}', first).replace('{b}', last) + '</div>'
    + '<div class="dline"></div>'
    + '<ul class="ditems">'
    + picked.map(function(it){
        return '<li><span class="dt">' + it.time + '</span><span class="dx">' + it.text + '</span></li>';
      }).join('')
    + '</ul>'
    + '<div class="dline"></div>'
    + '<div class="dfoot">' + pick(MOODS, seedOf(day.date, 'mood')) + '</div>'
    + '</div>';

  if(items.length > picked.length){
    html += '<div class="center" style="padding:14px 0">这一天还有 ' + (items.length - picked.length)
          + ' 条，去「日历」翻完整记录。</div>';
  }

  body.innerHTML = html;
  Array.prototype.forEach.call($('diaryBar').children, function(b){
    b.onclick = function(){ sfx('click'); DIARY_SEL = b.dataset.d; body.scrollTop = 0; renderDiary(); };
  });
}

/* ---------- 归档 ---------- */
function fmtDay(iso){
  var p = iso.split('-').map(Number);
  var today = new Date(); today.setHours(0,0,0,0);
  var diff = Math.round((today - new Date(p[0], p[1]-1, p[2])) / 86400000);
  var name = p[1] + '月' + p[2] + '日';
  if(new Date().getFullYear() !== p[0]) name = p[0] + '年' + name;
  return { name, tag: diff === 0 ? '今天' : diff === 1 ? '昨天' : diff === 2 ? '前天' : '' };
}
/* ---------- 日历 ---------- */
let CAL_Y = null, CAL_M = null, CAL_SEL = null;
function dayMap(){
  var m = {};
  if(DATA && DATA.days) DATA.days.forEach(function(d){ m[d.date] = d; });
  return m;
}
function renderCalendar(keepSel){
  if(!DATA) return;
  var body = $('viewBody');
  var now = new Date(Date.now() + clockSkew);
  if(CAL_Y == null){ CAL_Y = now.getFullYear(); CAL_M = now.getMonth(); }
  var map = dayMap();

  var first = new Date(CAL_Y, CAL_M, 1);
  var startDow = (first.getDay() + 6) % 7;          // 周一为第一列
  var daysIn = new Date(CAL_Y, CAL_M + 1, 0).getDate();
  var todayKey = now.getFullYear() + '-' + pad(now.getMonth()+1) + '-' + pad(now.getDate());

  var cells = '';
  for(var i = 0; i < startDow; i++) cells += '<div class="cal-cell empty"></div>';
  for(var d = 1; d <= daysIn; d++){
    var key = CAL_Y + '-' + pad(CAL_M + 1) + '-' + pad(d);
    var rec = map[key];
    var cls = 'cal-cell';
    if(rec) cls += ' has';
    if(key === todayKey) cls += ' today';
    if(key === CAL_SEL) cls += ' sel';
    var inner = '<span>' + d + '</span>';
    if(rec){
      var dots = '';
      for(var k = 0; k < Math.min(3, rec.items.length); k++) dots += '<i></i>';
      inner += '<span class="dots">' + dots + '</span>';
      inner += '<span class="cnt">' + rec.items.length + ' 条</span>';
    }
    cells += '<div class="' + cls + '" data-day="' + (rec ? key : '') + '">' + inner + '</div>';
  }

  var selHtml = '';
  if(CAL_SEL && map[CAL_SEL]){
    var r = map[CAL_SEL];
    selHtml = '<div class="cal-day"><div class="dh"><span class="d">'
      + (+CAL_SEL.slice(5,7)) + '月' + (+CAL_SEL.slice(8,10)) + '日</span>'
      + '<span class="w">' + r.weekday + '</span>'
      + '<span class="n">' + r.items.length + ' 条</span></div>'
      + '<ul class="items" id="calList"></ul></div>';
  } else if(CAL_SEL){
    selHtml = '<div class="cal-day"><div class="empty">这一天她没有留下记录。</div></div>';
  } else {
    selHtml = '<div class="cal-day"><div class="empty">点一个有记录的日期，看那天她做了什么。</div></div>';
  }

  body.innerHTML =
    '<div class="cal-head">'
    + '<div class="ym">' + CAL_Y + ' 年 ' + (CAL_M + 1) + ' 月</div>'
    + '<div class="sp"></div>'
    + '<button class="cal-nav" id="calPrev">‹</button>'
    + '<button class="cal-nav" id="calNext">›</button>'
    + '</div>'
    + '<div class="cal-week"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>'
    + '<div class="cal-grid" id="calGrid">' + cells + '</div>'
    + selHtml;

  if(CAL_SEL && map[CAL_SEL]){
    var ul = $('calList');
    map[CAL_SEL].items.forEach(function(it){ ul.appendChild(line(it.time, it.text)); });
  }

  $('calPrev').onclick = function(){
    sfx('click'); CAL_M--; if(CAL_M < 0){ CAL_M = 11; CAL_Y--; } CAL_SEL = null; renderCalendar();
  };
  $('calNext').onclick = function(){
    sfx('click'); CAL_M++; if(CAL_M > 11){ CAL_M = 0; CAL_Y++; } CAL_SEL = null; renderCalendar();
  };
  Array.prototype.forEach.call($('calGrid').children, function(el){
    var k = el.dataset.day;
    if(!k) return;
    el.addEventListener('click', function(){
      if(CAL_SEL === k){ CAL_SEL = null; }
      else { CAL_SEL = k; sfx('click'); }
      renderCalendar();
      var d = document.querySelector('.cal-day');
      if(d) d.scrollIntoView({behavior:'smooth', block:'nearest'});
    });
  });
}

/* ---------- 桌游 ---------- */
async function openGame(){
  var frame = $('gameFrame');
  if(!frame) return;
  try{
    if(!window.SAKU_MAZE_ENC) throw new Error('没有桌游数据');
    if(!window.__SAKU_PW) throw new Error('还没解锁');
    frame.srcdoc = await decryptRaw(window.__SAKU_PW, window.SAKU_MAZE_ENC);
  }catch(e){
    frame.srcdoc = '<body style="background:#2e2822;color:#f3e9d6;font-family:serif;padding:40px;line-height:1.8">'
      + '桌游载入失败：' + e.message + '</body>';
  }
}

/* ---------- 壁纸 ---------- */
const WALL_KEY = 'saku_wall';
function getWall(){ try{ return localStorage.getItem(WALL_KEY); }catch(e){ return null; } }
function applyWall(){
  var w = getWall(), el = $('wallpaper'), veil = document.querySelector('#home .veil');
  if(w){ el.style.backgroundImage = 'url(' + w + ')'; el.classList.add('on'); veil.classList.add('on'); }
  else { el.style.backgroundImage = ''; el.classList.remove('on'); veil.classList.remove('on'); }
}
function renderWall(){
  var cur = getWall();
  $('viewBody').innerHTML = `
    <div class="card"><h3>桌面壁纸</h3>
      <p style="color:var(--dim);font-size:13.5px">选一张图，它会成为这个世界的背景。图片只存在你这台手机上，不会上传到任何地方。</p>
    </div>
    ${cur ? '<img class="wprev" id="wPrev" src="' + cur + '">'
          : '<div class="card"><div class="empty">还没有设过壁纸。下面选一张。</div></div>'}
    <label class="wpick">＋ 从相册或文件里选一张图
      <input type="file" id="wFile" accept="image/*">
    </label>
    <div class="wbtns">
      ${cur ? '<button class="pri" id="wKeep">就这么用</button><button class="dan" id="wClear">清除壁纸</button>' : ''}
    </div>
    <div class="card" style="margin-top:14px"><h3>说明</h3>
      <p style="color:var(--dim);font-size:13.5px">图片会自动压缩到适合屏幕的尺寸再存下来（原图不会占空间）。竖图效果最好。</p>
    </div>`;

  var file = $('wFile');
  if(file) file.addEventListener('change', function(){
    var f = file.files && file.files[0];
    if(!f) return;
    var img = new Image(), rd = new FileReader();
    rd.onload = function(){ img.src = rd.result; };
    img.onload = function(){
      // 压缩：长边不超过 1600，转 JPEG
      var maxSide = 1600, w = img.width, h = img.height;
      var sc = Math.min(1, maxSide / Math.max(w, h));
      var cw = Math.round(w * sc), chh = Math.round(h * sc);
      var cv = document.createElement('canvas');
      cv.width = cw; cv.height = chh;
      var ctx = cv.getContext('2d');
      ctx.drawImage(img, 0, 0, cw, chh);
      var data = cv.toDataURL('image/jpeg', 0.86);
      try{
        localStorage.setItem(WALL_KEY, data);
      }catch(e){
        // 存不下就再压一档
        data = cv.toDataURL('image/jpeg', 0.62);
        try{ localStorage.setItem(WALL_KEY, data); }catch(e2){
          $('viewBody').insertAdjacentHTML('afterbegin',
            '<div class="card"><p style="color:#e0a09a">这张图太大了，本机存不下。换一张小一点的试试。</p></div>');
          return;
        }
      }
      sfx('relic');
      applyWall();
      renderWall();
    };
    rd.readAsDataURL(f);
  });
  var keep = $('wKeep');
  if(keep) keep.onclick = function(){ sfx('coin'); closeView(); };
  var clr = $('wClear');
  if(clr) clr.onclick = function(){
    try{ localStorage.removeItem(WALL_KEY); }catch(e){}
    sfx('discard');
    applyWall();
    renderWall();
  };
}

/* ---------- 桌面构建 ---------- */
function buildHome(){
  var g = $('grid');
  g.innerHTML = '';
  APPS.forEach(function(a){
    var el = document.createElement('div');
    el.className = 'app';
    el.dataset.app = a.id;
    el.innerHTML = '<div class="ico">' + a.ico + '</div><div class="nm">' + a.name + '</div>';
    el.addEventListener('click', function(){
      el.classList.add('opening');
      sfx('openapp');
      showView(a.id, el);
      setTimeout(() => el.classList.remove('opening'), 320);
    });
    g.appendChild(el);
  });
}

/* ---------- 启动 ---------- */
async function boot(serverMode){
  buildHome();
  tickClock();
  if(serverMode){
    try{
      var r = await fetch('/api/feed', {cache:'no-store'});
      var d = await r.json();
      DATA = { days: d.days, bornAt: d.born_at, total: d.total_events,
               meta: '共 ' + d.total_events + ' 条记录，从 ' + d.born_at + ' 开始。' };
      var px = await fetch('/ascii/plan.json', {cache:'no-store'}).then(x => x.json()).catch(() => null);
      if(px){ PLAN = px.plan; PLACES = px.places; }
      setInterval(async function(){
        try{
          var rr = await fetch('/api/feed', {cache:'no-store'});
          var dd = await rr.json();
          DATA.days = dd.days; DATA.total = dd.total_events;
          if(VIEW === 'now' || VIEW === 'archive'){
            if(VIEW === 'calendar') renderCalendar();
            else if(VIEW === 'diary') renderDiary();
          }
        }catch(e){}
      }, 60000);
    }catch(e){}
    $('gate').classList.add('hide');
    $('home').classList.remove('hide');
    return;
  }
  // 加密模式
  async function tryOpen(password, remember){
    $('err').textContent = '';
    $('go').textContent = '解密中…';
    try{
      window.__SAKU_PW = password;
      var d = await decryptJSON(password, window.SAKU_ENC);
      if(window.SAKU_ASCII_ENC){
        try{
          var px = await decryptJSON(password, window.SAKU_ASCII_ENC);
          PLAN = px.plan; PLACES = px.places;
        }catch(e2){}
      }
      if(remember){ try{ localStorage.setItem(STORE_KEY, password); }catch(e){} }
      DATA = { days: d.days, bornAt: d.bornAt, total: d.total,
               meta: '共 ' + d.total + ' 条记录，从 ' + d.bornAt + ' 开始。' };
      $('gate').classList.add('hide');
      $('home').classList.remove('hide');
      tickClock();
    }catch(e){
      $('err').textContent = '密码不对，或者数据已损坏';
      $('go').textContent = '进入';
      try{ localStorage.removeItem(STORE_KEY); }catch(e2){}
    }
  }
  $('go').addEventListener('click', function(){ tryOpen($('pw').value, true); });
  $('pw').addEventListener('keydown', function(e){ if(e.key === 'Enter') tryOpen($('pw').value, true); });
  var saved = null;
  try{ saved = localStorage.getItem(STORE_KEY); }catch(e){}
  if(saved) tryOpen(saved, false); else $('pw').focus();
}

$('viewBack').addEventListener('click', closeView);
document.addEventListener('keydown', function(e){ if(e.key === 'Escape' && VIEW) closeView(); });

/* 左边缘右滑返回 */
(function(){
  var x0 = 0, y0 = 0, tracking = false;
  document.addEventListener('touchstart', function(e){
    if(!VIEW) return;
    var t = e.touches[0];
    if(t.clientX < 24){ tracking = true; x0 = t.clientX; y0 = t.clientY; }
  }, {passive:true});
  document.addEventListener('touchmove', function(e){
    if(!tracking) return;
    var t = e.touches[0];
    if(Math.abs(t.clientY - y0) > 60) tracking = false;
  }, {passive:true});
  document.addEventListener('touchend', function(e){
    if(!tracking) return;
    tracking = false;
    var t = e.changedTouches[0];
    if(t.clientX - x0 > 70 && Math.abs(t.clientY - y0) < 70) closeView();
  }, {passive:true});
})();

/* 壁纸初始化 */
applyWall();
boot(IS_DEPLOY ? false : true);
</script>
